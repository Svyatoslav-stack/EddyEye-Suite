    const formatTimestampInTz = global.formatTimestampInTz;
    
    /* Оранжевый первым (стартовая серия — температура воздуха), затем green, pink, purple */
    const LF_COLOR_PALETTE = global.LF_COLOR_PALETTE || ['#F08A4B', '#33FF77', '#FF6B89', '#D1A0FF'];

    function getLFFiltersBadgeCount(station) {
        let n = 0;
        if ((window.selectedLFParams || []).length > 1) n += 1;
        const currentPeriod = window.currentLFPeriod || '7d';
        if (currentPeriod !== '7d') n += 1;
        if ((window.lfChartTimeZone || 'UTC') !== 'UTC') n += 1;
        return n;
    }

    function updateLFFiltersBadge(station) {
        const badge = document.querySelector('#tab-lf .filters-badge');
        if (!badge) return;
        const n = getLFFiltersBadgeCount(station);
        badge.textContent = String(n);
        badge.classList.toggle('hidden', n === 0);
    }

    function createUpdateLFCharts(station, chartInstances, getPeriod) {
        return function updateLFCharts(fromRetry) {
            const chartId = `lf-chart-${station.station_id}`;
            const chartElement = document.getElementById(chartId);
            if (!chartElement) {
                return;
            }
            const lfTab = document.getElementById('tab-lf');
            const lfTabActive = lfTab && lfTab.classList.contains('active');
            const hasSize = chartElement.offsetWidth > 0 && chartElement.offsetHeight > 0;
            if (!hasSize && !lfTabActive) return;
            if (!hasSize && lfTabActive && !fromRetry) {
                void chartElement.offsetHeight;
                setTimeout(() => updateLFCharts(true), 150);
                return;
            }
            if (!hasSize && lfTabActive && fromRetry) return;

            if (typeof Chart === 'undefined') {
                chartElement.innerHTML = '<p style="color: rgba(255,255,255,0.8); text-align: center; padding: 20px;">Chart.js не загружен</p>';
                return;
            }

            const periodId = getPeriod() || '7d';
            const dataKey = periodId === '7d' ? 'last_7d' : periodId === 'month' ? 'last_month' : 'annual';
            let data = station.data.lf?.[dataKey] || [];
            const qualityKey = getLFQualityColumn(data);
            if (qualityKey && (window.lfQualityFilter === 'good')) {
                data = data.filter(row => Number(row[qualityKey]) === 0);
            }
            const lfParams = getLFParams(station);
            const validKeys = new Set(lfParams.map(p => p.key));
            const selectedParams = (window.selectedLFParams || lfParams.map(p => p.key)).filter(key => validKeys.has(key));


            if (data.length === 0) {
                if (chartInstances[chartId]) {
                    try {
                        chartInstances[chartId].destroy();
                        delete chartInstances[chartId];
                    } catch (e) {
                    }
                }
                chartElement.innerHTML = '<div style="text-align:center;padding:60px;color:rgba(255,255,255,0.6);">No data available</div>';
                return;
            }

            const availableParams = lfParams;
            const chartColors = LF_COLOR_PALETTE;
            const datasets = [];
            const axisColor = 'rgba(255,255,255,0.8)';
            const parseTs = parseTimestampUTC;
            const displayTz = window.lfChartTimeZone || 'UTC';

            // Подготовка данных для Chart.js
            selectedParams.forEach((paramKey, idx) => {
                const paramConfig = availableParams.find(p => p.key === paramKey) || { label: paramKey, unit: '' };
                const color = chartColors[idx % chartColors.length];
                const label = `${paramConfig.label}${paramConfig.unit ? ` (${paramConfig.unit})` : ''}`;
                
                const seriesData = data.map(row => {
                    const timestamp = parseTs(row.TIMESTAMP);
                    const value = row[paramKey];
                    const y = value !== null && value !== undefined && !isNaN(Number(value)) ? Number(value) : null;
                    return { x: timestamp, y };
                }).filter(point => point.x != null && !isNaN(point.x));

                datasets.push({
                    label: label,
                    data: seriesData,
                    borderColor: color,
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    pointRadius: 0,
                    pointHoverRadius: 5,
                    fill: false,
                    tension: 0.15,
                    spanGaps: false,
                    showLine: true,
                    order: 1
                });
            });

            if (datasets.length === 0) {
                if (chartInstances[chartId]) {
                    try {
                        chartInstances[chartId].destroy();
                        delete chartInstances[chartId];
                    } catch (e) {
                    }
                }
                chartElement.innerHTML = '<div style="text-align:center;padding:60px;color:rgba(255,255,255,0.6);">No series to display</div>';
                return;
            }

            if (chartElement.offsetWidth === 0 || chartElement.offsetHeight === 0) return;

            // Вычисление диапазона времени для форматирования X-axis
            const lfTimestamps = data.map(r => parseTs(r.TIMESTAMP)).filter(t => t != null && !isNaN(t));
            const HALF_HOUR_MS = 30 * 60 * 1000;
            const lfDataMin = lfTimestamps.length ? Math.min(...lfTimestamps) : 0;
            const lfDataMax = lfTimestamps.length ? Math.max(...lfTimestamps) + HALF_HOUR_MS : 0;
            const lfRangeDays = lfDataMax && lfDataMin ? (lfDataMax - lfDataMin) / (24 * 60 * 60 * 1000) : 0;

            // Вычисление диапазона Y для автоматического масштабирования
            const allYValues = datasets.flatMap(d => d.data.map(p => p.y)).filter(v => v != null && isFinite(v));
            const dataMinY = allYValues.length > 0 ? Math.min(...allYValues) : 0;
            const dataMaxY = allYValues.length > 0 ? Math.max(...allYValues) : 1;
            const padding = Math.max(0.05, (dataMaxY - dataMinY) * 0.08);
            const yMin = dataMinY - padding;
            const yMax = dataMaxY + padding;

            // Настройка X-axis — аналогично EddyPro: type: 'linear' + custom ticks
            const dayOpts = { day: 'numeric', month: 'short', timeZone: displayTz };
            const monthOpts = { month: 'short', year: 'numeric', timeZone: displayTz };
            const fmtDay = (v) => new Date(v).toLocaleDateString('en-GB', dayOpts);
            const fmtMonth = (v) => new Date(v).toLocaleDateString('en-GB', monthOpts);

            // Crosshair plugin
            const crosshairPlugin = {
                id: 'lfCrosshair',
                afterDraw: (chart) => {
                    const active = chart.tooltip?.getActiveElements?.() ?? chart.tooltip?._active;
                    if (!active?.length) return;
                    const el = active[0].element;
                    const x = el.x;
                    const yScale = chart.scales.y;
                    if (!yScale || x == null) return;
                    const ctx = chart.ctx;
                    ctx.save();
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 4]);
                    ctx.moveTo(x, yScale.top);
                    ctx.lineTo(x, yScale.bottom);
                    ctx.stroke();
                    ctx.restore();
                }
            };

            // Референсная линия y=0 (если диапазон включает 0)
            if (yMin <= 0 && yMax >= 0) {
                datasets.push({
                    label: 'Zero line',
                    data: [
                        { x: lfDataMin, y: 0 },
                        { x: lfDataMax, y: 0 }
                    ],
                    borderColor: '#ffffff',
                    backgroundColor: 'transparent',
                    borderWidth: 1,
                    pointRadius: 0,
                    pointHoverRadius: 0,
                    fill: false,
                    tension: 0,
                    spanGaps: false,
                    showLine: true,
                    order: 0.5
                });
            }

            const xScaleConfig = {
                type: 'linear',
                min: lfDataMin,
                max: lfDataMax,
                grid: { color: 'rgba(255,255,255,0.1)' },
                ticks: {
                    color: axisColor,
                    maxTicksLimit: periodId === 'year' || lfRangeDays > 365 ? 12 : 10,
                    font: { size: 12, weight: '400', family: "'Roboto', 'Segoe UI', sans-serif" }
                },
                border: { display: false }
            };

            if (periodId === '7d' || (lfRangeDays <= 31 && periodId !== 'year')) {
                xScaleConfig.ticks.callback = (v) => fmtDay(v);
                xScaleConfig.afterBuildTicks = function(scale) { scale.ticks = buildDailyTicks(lfDataMin, lfDataMax, displayTz); };
            } else if (periodId === 'month' && lfRangeDays <= 365) {
                xScaleConfig.ticks.callback = (v) => fmtDay(v);
                xScaleConfig.afterBuildTicks = function(scale) { scale.ticks = buildWeeklyTicks(lfDataMin, lfDataMax, displayTz); };
            } else {
                xScaleConfig.ticks.callback = (v) => fmtMonth(v);
                xScaleConfig.afterBuildTicks = function(scale) { scale.ticks = buildMonthlyTicks(lfDataMin, lfDataMax, displayTz); };
            }

            // Определение заголовка Y-axis (используем первый параметр)
            const firstParam = availableParams.find(p => p.key === selectedParams[0]);
            const yAxisTitle = firstParam ? `${firstParam.label}${firstParam.unit ? ` (${firstParam.unit})` : ''}` : 'Value';
            // Определяем, является ли первый параметр температурой для форматирования тиков
            const isTemperatureParam = firstParam && (firstParam.unit === '°C' || firstParam.label.includes('Temperature'));

            const options = {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                transitions: {
                    active: {
                        animation: {
                            duration: 0
                        }
                    }
                },
                interaction: {
                    mode: 'index',
                    intersect: false
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: 'rgba(20, 20, 25, 0.95)',
                        borderColor: 'rgba(255, 255, 255, 0.2)',
                        borderWidth: 1,
                        padding: 10,
                        cornerRadius: 8,
                        titleColor: '#ffffff',
                        bodyColor: '#ffffff',
                        titleFont: {
                            size: 13,
                            weight: '600',
                            family: "'Roboto', 'Segoe UI', sans-serif"
                        },
                        bodyFont: {
                            size: 12,
                            family: "'Roboto', 'Segoe UI', sans-serif"
                        },
                        titleAlign: 'left',
                        bodyAlign: 'left',
                        callbacks: {
                            title: (items) => {
                                const raw = items[0]?.raw;
                                if (!raw?.x) return '';
                                if (displayTz) return formatTimestampInTz(raw.x, displayTz);
                                return new Date(raw.x).toLocaleString('en-GB', {
                                    day: '2-digit',
                                    month: 'short',
                                    year: 'numeric',
                                    hour: '2-digit',
                                    minute: '2-digit'
                                });
                            },
                            label: (ctx) => {
                                if (ctx.dataset.label === 'Zero line') return null;
                                const y = ctx.parsed.y;
                                const fullLabel = ctx.dataset.label;
                                const unitMatch = fullLabel.match(/^(.+?)\s*\(([^)]+)\)\s*$/);
                                const name = unitMatch ? unitMatch[1].trim() : fullLabel;
                                const unit = unitMatch ? unitMatch[2] : '';
                                if (y == null || !isFinite(y)) return name + ': —';
                                const isTemperature = (unit && unit.includes('°C')) || fullLabel.includes('Temperature');
                                const decimals = isTemperature ? 1 : 2;
                                return name + ': ' + y.toFixed(decimals) + (unit ? ' ' + unit : '');
                            },
                            labelColor: (ctx) => ({
                                borderColor: ctx.dataset.borderColor,
                                backgroundColor: ctx.dataset.borderColor
                            })
                        },
                        filter: (item) => item.dataset.label !== 'Zero line'
                    }
                },
                scales: {
                    x: xScaleConfig,
                    y: {
                        min: yMin,
                        max: yMax,
                        title: {
                            display: true,
                            text: yAxisTitle,
                            color: axisColor,
                            font: {
                                size: 13,
                                weight: '600',
                                family: "'Roboto', 'Segoe UI', sans-serif"
                            }
                        },
                        ticks: {
                            color: axisColor,
                            font: {
                                size: 12,
                                weight: '400',
                                family: "'Roboto', 'Segoe UI', sans-serif"
                            },
                            callback: function(value) {
                                if (value == null || !isFinite(value)) return '';
                                // Температура - 1 знак, остальное - 2 знака
                                const decimals = isTemperatureParam ? 1 : 2;
                                const formatted = value.toFixed(decimals);
                                return formatted === '-0.00' ? '0.00' : formatted;
                            },
                            maxTicksLimit: 8
                        },
                        grid: {
                            color: 'rgba(255,255,255,0.1)',
                            lineWidth: 1,
                            drawBorder: false
                        },
                        border: {
                            display: false
                        }
                    }
                },
                elements: {
                    line: {
                        borderCapStyle: 'round',
                        borderJoinStyle: 'round'
                    },
                    point: {
                        radius: 0,
                        hoverRadius: 5,
                        hoverBorderWidth: 2
                    }
                }
            };

            if (chartInstances[chartId]) {
                try {
                    chartInstances[chartId].data.datasets = datasets;
                    chartInstances[chartId].options = options;
                    chartInstances[chartId].update('none');
                } catch (error) {
                    console.error(`[LF] Error updating chart:`, error);
                    try {
                        chartInstances[chartId].destroy();
                        delete chartInstances[chartId];
                    } catch (e) {}
                    const errP = document.createElement('p');
                    errP.style.cssText = 'color: rgba(255,255,255,0.8); text-align: center; padding: 20px;';
                    errP.textContent = 'Error: ' + String(error?.message || 'Unknown error');
                    chartElement.innerHTML = '';
                    chartElement.appendChild(errP);
                }
            } else {
                chartElement.innerHTML = '<div style="position:relative;height:520px;width:100%;min-width:600px"><canvas style="display:block"></canvas></div>';
                const canvas = chartElement.querySelector('canvas');
                if (!canvas) return;

                try {
                    const ctx = canvas.getContext('2d');
                    if (!ctx) {
                        chartElement.innerHTML = '<p style="color:rgba(255,255,255,0.8);">Canvas context недоступен</p>';
                        return;
                    }

                    chartInstances[chartId] = new Chart(ctx, {
                        type: 'line',
                        data: { datasets },
                        plugins: [crosshairPlugin],
                        options: options
                    });
                } catch (error) {
                    console.error(`[LF] Error creating chart:`, error);
                    const errP = document.createElement('p');
                    errP.style.cssText = 'color: rgba(255,255,255,0.8); text-align: center; padding: 20px;';
                    errP.textContent = 'Error: ' + String(error?.message || 'Unknown error');
                    chartElement.innerHTML = '';
                    chartElement.appendChild(errP);
                }
            }
        };
    }

    function createRenderLFFiltersDrawerBody(container, station, chartInstances, getPeriod, setPeriod, updateLFCharts) {
        return function renderLFFiltersDrawerBody() {
            container.innerHTML = '';
            const maxParams = 4;
            const lfParamsList = getLFParams(station);
            const chartColors = LF_COLOR_PALETTE;

            const addSection = (title, el) => {
                const sec = document.createElement('div');
                sec.className = 'drawer-filter-section';
                sec.innerHTML = `<h3 style="margin:0 0 10px 0;font-size:14px;font-weight:600;color:rgba(255,255,255,0.95);">${title}</h3>`;
                sec.appendChild(el);
                container.appendChild(sec);
            };

            // Period section - segmented buttons like in Time Lag
            const periodSeg = document.createElement('div');
            periodSeg.className = 'control-bar-seg';
            const periodOptions = [
                { value: '7d', label: 'Last Week', periodKey: 'last_week' },
                { value: 'month', label: 'MTD', periodKey: 'mtd' },
                { value: 'year', label: 'YTD', periodKey: 'ytd' }
            ];
            periodOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.textContent = opt.label;
                btn.value = opt.value;
                const currentPeriod = getPeriod() || '7d';
                if (currentPeriod === opt.value) btn.classList.add('active');
                btn.onclick = () => {
                    setPeriod(opt.value);
                    window.currentLFPeriod = opt.value;
                    periodSeg.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.value === opt.value));
                    updateLFCharts(false);
                    updateLFFiltersBadge(station);
                    renderLFFiltersDrawerBody();
                };
                periodSeg.appendChild(btn);
            });
            addSection('Time range', periodSeg);

            {
                window.lfChartTimeZone = window.lfChartTimeZone || 'UTC';
                const tzSeg = document.createElement('div');
                tzSeg.className = 'control-bar-seg';
                [{ value: 'UTC', label: 'UTC' }, { value: 'Europe/Tallinn', label: 'Tallinn' }].forEach(opt => {
                    const btn = document.createElement('button');
                    btn.textContent = opt.label;
                    btn.value = opt.value;
                    if ((window.lfChartTimeZone || 'UTC') === opt.value) btn.classList.add('active');
                    btn.onclick = () => {
                        window.lfChartTimeZone = opt.value;
                        tzSeg.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.value === opt.value));
                        updateLFCharts(false);
                        updateLFFiltersBadge(station);
                        renderLFFiltersDrawerBody();
                    };
                    tzSeg.appendChild(btn);
                });
                addSection('Display time', tzSeg);
            }

            // Parameters section: цвет чекбокса = цвет серии на графике (по порядку выбранных)
            const paramsWrap = document.createElement('div');
            const selectedOrder = (window.selectedLFParams || []).filter(k => lfParamsList.some(p => p.key === k));
            lfParamsList.forEach((param) => {
                const selectedIdx = selectedOrder.indexOf(param.key);
                const color = selectedIdx >= 0 ? chartColors[selectedIdx % chartColors.length] : 'rgba(255,255,255,0.5)';
                const lbl = document.createElement('label');
                lbl.style.cssText = 'display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer;';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = (window.selectedLFParams || []).includes(param.key);
                cb.style.accentColor = color;
                cb.onchange = () => {
                    const cur = window.selectedLFParams || [];
                    if (cb.checked) {
                        if (cur.length >= maxParams) {
                            cb.checked = false;
                            return;
                        }
                        window.selectedLFParams = [...cur, param.key];
                    } else {
                        if (cur.length <= 1) {
                            cb.checked = true;
                            return;
                        }
                        window.selectedLFParams = cur.filter(p => p !== param.key);
                    }
                    updateLFCharts(false);
                    updateLFFiltersBadge(station);
                    renderLFFiltersDrawerBody();
                };
                lbl.appendChild(cb);
                const labelText = `${param.label}${param.unit ? ` (${param.unit})` : ''}`;
                lbl.appendChild(document.createTextNode(labelText));
                paramsWrap.appendChild(lbl);
            });
            addSection('Parameters', paramsWrap);

            const resetBtn = document.createElement('button');
            resetBtn.type = 'button';
            resetBtn.className = 'drawer-reset';
            resetBtn.textContent = 'Reset';
            resetBtn.addEventListener('click', function() {
                const defaultP = lfParamsList.find(p =>
                    (p.label || '').toLowerCase().includes('air temperature') || /AirTC|ROT_AirTC/i.test(p.key || '')
                ) || lfParamsList[0];
                const first = defaultP?.key;
                window.selectedLFParams = first ? [first] : [];
                window.lfQualityFilter = 'all';
                window.currentLFPeriod = '7d';
                setPeriod('7d');
                window.lfChartTimeZone = 'UTC';
                updateLFCharts(false);
                updateLFFiltersBadge(station);
                renderLFFiltersDrawerBody();
            });
            container.appendChild(resetBtn);
        };
    }

    function openLFFiltersDrawer(station, chartInstances, getPeriod, setPeriod, updateLFCharts) {
        const backdrop = document.getElementById('drawerBackdrop');
        const titleEl = document.getElementById('drawerTitle');
        const hintEl = document.getElementById('drawerHint');
        const bodyEl = document.getElementById('drawerBody');
        if (!backdrop || !bodyEl) return;
        titleEl.textContent = 'LF Filters';
        hintEl.textContent = 'Parameters and data quality. Changes apply immediately.';
        const renderBody = createRenderLFFiltersDrawerBody(bodyEl, station, chartInstances, getPeriod, setPeriod, updateLFCharts);
        renderBody();
        backdrop.setAttribute('aria-hidden', 'false');
        const close = () => {
            backdrop.setAttribute('aria-hidden', 'true');
            document.removeEventListener('keydown', onEsc);
            backdrop.removeEventListener('click', onBackdropClick);
            const closeBtn = document.getElementById('closeDrawer');
            if (closeBtn) closeBtn.removeEventListener('click', close);
        };
        const onEsc = (e) => { if (e.key === 'Escape') close(); };
        const onBackdropClick = (e) => { if (e.target === backdrop) close(); };
        document.addEventListener('keydown', onEsc);
        backdrop.addEventListener('click', onBackdropClick);
        const closeBtn = document.getElementById('closeDrawer');
        if (closeBtn) closeBtn.addEventListener('click', close);
    }

    function render(container, station, options) {
        if (!container) return;

        container.innerHTML = '';

        if (!station.data.lf) {
            container.innerHTML = '<p style="color: rgba(255,255,255,0.8); text-align: center; padding: 40px;">LF data unavailable for this station</p>';
            return;
        }

        const chartInstances = options.chartInstances;
        const getPeriod = options.getPeriod || (() => '7d');
        const setPeriod = options.setPeriod || (() => {});

        const lfParamsForStation = getLFParams(station);
        const validKeys = new Set(lfParamsForStation.map(p => p.key));
        const defaultLFParam = lfParamsForStation.find(p =>
            (p.label || '').toLowerCase().includes('air temperature') || /AirTC|ROT_AirTC/i.test(p.key || '')
        ) || lfParamsForStation[0];
        const defaultLFKey = defaultLFParam ? defaultLFParam.key : null;
        const current = (window.selectedLFParams || []).filter(k => validKeys.has(k));
        if (current.length === 0) {
            window.selectedLFParams = defaultLFKey ? [defaultLFKey] : (lfParamsForStation.length > 0 ? [lfParamsForStation[0].key] : []);
        }
        if (window.lfQualityFilter !== 'good' && window.lfQualityFilter !== 'all') {
            window.lfQualityFilter = 'all';
        }
        if (!window.currentLFPeriod) {
            window.currentLFPeriod = getPeriod() || '7d';
        }

        const updateLFCharts = createUpdateLFCharts(station, chartInstances, getPeriod);

        const mainLayout = document.createElement('div');
        mainLayout.className = 'eddypro-main-layout';

        const lfCard = document.createElement('div');
        lfCard.className = 'widget-card';
        const lfHeader = document.createElement('div');
        lfHeader.className = 'widget-card-header';

        const lfTitle = document.createElement('h3');
        lfTitle.className = 'widget-card-title';
        lfTitle.textContent = 'Low Frequency Data (UTC)';
        lfHeader.appendChild(lfTitle);

        const lfFiltersWrap = document.createElement('div');
        lfFiltersWrap.className = 'filters-btn-wrap';
        const lfFiltersBtn = document.createElement('button');
        lfFiltersBtn.type = 'button';
        lfFiltersBtn.className = 'filters-btn filters-pill-btn';
        lfFiltersBtn.innerHTML = '<span class="filters-icon" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg></span> Filters ';
        const lfBadge = document.createElement('span');
        lfBadge.className = 'filters-badge';
        const lfBadgeCount = getLFFiltersBadgeCount(station);
        lfBadge.textContent = String(lfBadgeCount);
        if (lfBadgeCount === 0) lfBadge.classList.add('hidden');
        lfFiltersBtn.appendChild(lfBadge);
        lfFiltersBtn.addEventListener('click', () => openLFFiltersDrawer(station, chartInstances, getPeriod, setPeriod, updateLFCharts));
        lfFiltersWrap.appendChild(lfFiltersBtn);
        lfHeader.appendChild(lfFiltersWrap);

        lfCard.appendChild(lfHeader);
        const lfBody = document.createElement('div');
        lfBody.className = 'widget-card-body widget-card-body-chart';
        const chartWrapper = document.createElement('div');
        chartWrapper.className = 'chart-wrapper';
        chartWrapper.id = `lf-chart-${station.station_id}`;
        chartWrapper.style.cssText = 'min-height: 520px; width: 100%;';
        lfBody.appendChild(chartWrapper);
        lfCard.appendChild(lfBody);
        mainLayout.appendChild(lfCard);
        container.appendChild(mainLayout);

        let attempts = 0;
        const maxAttempts = 15;
        function scheduleRun() {
            attempts += 1;
            const el = document.getElementById(`lf-chart-${station.station_id}`);
            const tab = document.getElementById('tab-lf');

            if (station?.data?.timelag_ch4?.length > 0) availableGases.push({ key: 'ch4', label: 'CH₄' });
            if (station?.data?.timelag_n2o?.length > 0) availableGases.push({ key: 'n2o', label: 'N₂O' });
        }
        function getRawData(gasKey) {
            if (gasKey === 'timelag' || !gasKey) return station?.data?.timelag || [];
            return station?.data?.['timelag_' + gasKey] || [];
        }
        function getFullData(gasKey) {
            return buildTimeLagData(getRawData(gasKey), parseTs);
        }
        var defaultSelectedGases = {};
        availableGases.forEach((g, i) => { defaultSelectedGases[g.key] = i === 0; });

        let state = {
            ...DEFAULTS,
            selectedGases: { ...defaultSelectedGases },
            dateRange: null,
            data: [],
            dataPerGas: {}
        };

        function applyFilters() {
            var sel = state.selectedGases || {};
            var dataPerGas = {};
            var firstData = [];
            var displayTz = state.chartTimeZone || DEFAULTS.chartTimeZone;
            availableGases.forEach(g => {
                if (sel[g.key]) {
                    var fd = getFullData(g.key);
                    var filtered = filterByPeriod(fd, state.period, state.dateRange, displayTz);
                    dataPerGas[g.key] = filtered;
                    if (firstData.length === 0) firstData = filtered;
                }
            });
            state.dataPerGas = dataPerGas;
            state.data = firstData;
        }

        applyFilters();

        function buildChartDataAndOptions() {
            const selectedKeys = state.dataPerGas && Object.keys(state.dataPerGas).length;
            const multiGas = selectedKeys > 1;
            const data = state.data;
            let series, colors;
            if (multiGas && state.dataPerGas) {
                const sel = state.selectedGases || {};
                const activeGases = availableGases.filter(g => sel[g.key]);
                ({ series, colors } = buildSeriesMultiGas(state.dataPerGas, activeGases, state, timezone));
            } else {
                ({ series, colors } = buildSeries(data, state, timezone));
            }
            const lineSeries = series.filter(s => s.type === 'line');
            const ciSeries = series.find(s => s.type === 'rangeArea');
            const colorsForLines = colors.filter((_, i) => series[i].type === 'line');
            const allY = [
                ...lineSeries.flatMap(s => s.data.map(d => d.y).filter(v => v != null)),
                ...(ciSeries ? ciSeries.data.flatMap(d => (Array.isArray(d.y) ? d.y : [d.y]).filter(v => v != null)) : [])
            ];
            const dataMinY = allY.length ? Math.min(...allY) : 0;
            const dataMaxY = allY.length ? Math.max(...allY) : 0;
            const pad = allY.length ? Math.max(0.05, (dataMaxY - dataMinY) * 0.08) : 0.1;
            const yMin = allY.length ? dataMinY - pad : -0.5;
            const yMax = allY.length ? dataMaxY + pad : 0.5;
            const axisColor = 'rgba(255,255,255,0.8)';
            const displayTz = state.chartTimeZone || DEFAULTS.chartTimeZone;
            const allX = lineSeries.flatMap(s => s.data.map(d => d.x)).filter(t => t != null);
            const HALF_HOUR_MS = 30 * 60 * 1000;
            const minT = allX.length ? Math.min(...allX) : 0;
            const maxT = allX.length ? Math.max(...allX) + HALF_HOUR_MS : 0;

            const datasets = [];
            if (ciSeries && ciSeries.data.length > 0 && state.showCI) {
                const ciL = ciSeries.data.map(d => ({ x: d.x, y: Array.isArray(d.y) ? d.y[0] : d.y }));
                const ciU = ciSeries.data.map(d => ({ x: d.x, y: Array.isArray(d.y) ? d.y[1] : d.y }));
                datasets.push({
                    label: 'PWB CI (lower)',
                    data: ciL,
                    borderWidth: 0,
                    backgroundColor: 'rgba(220,80,60,0.15)',
                    fill: '+1',
                    pointRadius: 0,
                    spanGaps: false,
                    order: 0
                });
                datasets.push({
                    label: 'PWB CI (upper)',
                    data: ciU,
                    borderWidth: 0,
                    backgroundColor: 'transparent',
                    fill: false,
                    pointRadius: 0,
                    spanGaps: false,
                    order: 0
                });
            }
            /* Zero line (y=0) - bright white, thicker */
            if (yMin <= 0 && yMax >= 0) {
                datasets.push({
                    label: 'Zero line',
                    data: [{ x: minT, y: 0 }, { x: maxT, y: 0 }],
                    borderColor: '#ffffff',
                    backgroundColor: 'transparent',
                    borderWidth: 1,
                    pointRadius: 0,
                    pointHoverRadius: 0,
                    fill: false,
                    tension: 0,
                    spanGaps: false,
                    showLine: true,
                    order: 0.5
                });
            }
            lineSeries.forEach((s, i) => {
                datasets.push({
                    label: s.name,
                    data: s.data.map(d => ({ x: d.x, y: d.y })),
                    borderColor: colorsForLines[i] || COLORS.eddypro,
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    pointRadius: 0,
                    pointHoverRadius: 5,
                    fill: false,
                    tension: 0.15,
                    spanGaps: false,
                    showLine: true,
                    order: 1
                });
            });

            const dayOpts = { day: 'numeric', month: 'short', timeZone: displayTz };
            const monthOpts = { month: 'short', year: 'numeric', timeZone: displayTz };
            const fmtDay = (v) => new Date(v).toLocaleDateString('en-GB', dayOpts);
            const fmtMonth = (v) => new Date(v).toLocaleDateString('en-GB', monthOpts);
            const xScaleConfig = (() => {
                const base = {
                    type: 'linear',
                    min: minT,
                    max: maxT,
                    grid: { color: 'rgba(255,255,255,0.1)' },
                    ticks: {
                        color: axisColor,
                        maxTicksLimit: state.period === 'ytd' ? 12 : 10,
                        font: {
                            size: 12,
                            weight: '400',
                            family: "'Roboto', 'Segoe UI', sans-serif"
                        }
                    }
                };
                if (state.period === 'last_week') {
                    base.ticks.callback = (v) => fmtDay(v);
                    const customTicks = displayTz && typeof buildDailyTicks === 'function'
                        ? buildDailyTicks(minT, maxT, displayTz)
                        : (() => {
                            const t = [];
                            const d = new Date(minT);
                            d.setHours(0, 0, 0, 0);
                            while (d.getTime() <= maxT) { t.push({ value: d.getTime() }); d.setDate(d.getDate() + 1); }
                            return t;
                        })();
                    base.afterBuildTicks = function(scale) { scale.ticks = customTicks; };
                } else if (state.period === 'mtd') {
                    base.ticks.callback = (v) => fmtDay(v);
                    const customTicks = displayTz && typeof buildWeeklyTicks === 'function'
                        ? buildWeeklyTicks(minT, maxT, displayTz)
                        : (() => {
                            const t = [];
                            const d = new Date(minT);
                            d.setDate(1);
                            d.setHours(0, 0, 0, 0);
                            while (d.getTime() <= maxT) { t.push({ value: d.getTime() }); d.setDate(d.getDate() + 7); }
                            return t;
                        })();
                    base.afterBuildTicks = function(scale) { scale.ticks = customTicks; };
                } else if (state.period === 'ytd') {
                    base.ticks.callback = (v) => fmtMonth(v);
                    const customTicks = displayTz && typeof buildMonthlyTicks === 'function'
                        ? buildMonthlyTicks(minT, maxT, displayTz)
                        : (() => {
                            const t = [];
                            const d = new Date(minT);
                            d.setDate(1);
                            d.setHours(0, 0, 0, 0);
                            while (d.getTime() <= maxT) { t.push({ value: d.getTime() }); d.setMonth(d.getMonth() + 1); }
                            return t;
                        })();
                    base.afterBuildTicks = function(scale) { scale.ticks = customTicks; };
                } else {
                    base.ticks.callback = (v) => fmtDay(v);
                }
                return base;
            })();

            const options = {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                transitions: { active: { animation: { duration: 0 } } },
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: 'rgba(20, 20, 25, 0.95)',
                        borderColor: 'rgba(255, 255, 255, 0.2)',
                        borderWidth: 1,
                        padding: 10,
                        cornerRadius: 8,
                        titleColor: '#ffffff',
                        bodyColor: '#ffffff',
                        titleFont: {
                            size: 13,
                            weight: '600',
                            family: "'Roboto', 'Segoe UI', sans-serif"
                        },
                        bodyFont: {
                            size: 12,
                            family: "'Roboto', 'Segoe UI', sans-serif"
                        },
                        titleAlign: 'left',
                        bodyAlign: 'left',
                        callbacks: {
                            title: (items) => {
                                const raw = items[0]?.raw;
                                if (!raw?.x) return '';
                                if (displayTz && typeof formatTimestampInTz === 'function') return formatTimestampInTz(raw.x, displayTz);
                                return new Date(raw.x).toLocaleString(undefined, { timeZone: timezone, day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                            },
                            label: (ctx) => {
                                if (ctx.dataset.label.includes('PWB CI (upper)')) return null;
                                const y = ctx.parsed.y;
                                const name = ctx.dataset.label;
                                return name + ': ' + (y != null && isFinite(y) ? y.toFixed(1) + ' s' : '—');
                            },
                            labelColor: (ctx) => ({
                                borderColor: ctx.dataset.borderColor,
                                backgroundColor: ctx.dataset.borderColor
                            })
                        },
                        filter: (item) => !item.dataset.label.includes('PWB CI (upper)') && item.dataset.label !== 'Zero line'
                    }
                },
                scales: {
                    x: xScaleConfig,
                    y: {
                        min: yMin,
                        max: yMax,
                        title: {
                            display: true,
                            text: (() => {
                                const n = state.dataPerGas && Object.keys(state.dataPerGas).length;
                                if (n > 1) return 'Timelag (s)';
                                const g = availableGases.find(x => state.selectedGases && state.selectedGases[x.key]);
                                return (g ? g.label : 'CO₂') + ' Timelag (s)';
                            })(),
                            color: axisColor,
                            font: {
                                size: 13,
                                weight: '600',
                                family: "'Roboto', 'Segoe UI', sans-serif"
                            }
                        },
                        ticks: {
                            color: axisColor,
                            callback: (v) => v != null ? v.toFixed(2) : '',
                            font: {
                                size: 12,
                                weight: '400',
                                family: "'Roboto', 'Segoe UI', sans-serif"
                            }
                        },
                        grid: { color: 'rgba(255,255,255,0.1)' }
                    }
                }
            };
            return { datasets, options, lineSeries };
        }

        function initChart() {
            const chartId = `timelag-chart-${stationId}`;
            const chartEl = document.getElementById(chartId);
            if (!chartEl) return;

            try {
                const data = state.data;
                if (!data || !data.length) {
                    if (store[chartId]) { try { store[chartId].destroy(); } catch (e) {} delete store[chartId]; }
                    chartEl.innerHTML = '<div style="text-align:center;padding:60px;color:rgba(255,255,255,0.6);">No data in selected range</div>';
                    return;
                }

                const built = buildChartDataAndOptions();
                if (!built) {
                    chartEl.innerHTML = '<div style="text-align:center;padding:60px;color:rgba(255,255,255,0.6);">No chart data</div>';
                    return;
                }
                const { datasets, options, lineSeries } = built;
                if (!lineSeries || !lineSeries.length) {
                    if (store[chartId]) { try { store[chartId].destroy(); } catch (e) {} delete store[chartId]; }
                    chartEl.innerHTML = '<div style="text-align:center;padding:60px;color:rgba(255,255,255,0.6);">No series to display</div>';
                    return;
                }

                if (store[chartId]) {
                    const chart = store[chartId];
                    chart.data.datasets = datasets;
                    chart.options = options;
                    chart.update();
                    if (onChartReady) onChartReady();
                    return;
                }

                chartEl.innerHTML = '<div style="position:relative;height:520px;width:100%;min-width:600px"><canvas style="display:block"></canvas></div>';
                const canvas = chartEl.querySelector('canvas');
                if (!canvas) return;

                if (typeof Chart === 'undefined') {
                    chartEl.innerHTML = '<p style="color:rgba(255,255,255,0.8);">Chart.js не загружен</p>';
                    return;
                }

                const ctx = canvas.getContext('2d');
                if (!ctx) {
                    chartEl.innerHTML = '<p style="color:rgba(255,255,255,0.8);">Canvas context недоступен</p>';
                    return;
                }
                const axisColor = 'rgba(255,255,255,0.8)';
                const crosshairPlugin = {
                    id: 'timelagCrosshair',
                    afterDraw: (chart) => {
                        const active = chart.tooltip?.getActiveElements?.() ?? chart.tooltip?._active;
                        if (!active?.length) return;
                        const el = active[0].element;
                        const x = el.x;
                        const yScale = chart.scales.y;
                        if (!yScale || x == null) return;
                        const ctx = chart.ctx;
                        ctx.save();
                        ctx.beginPath();
                        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([4, 4]);
                        ctx.moveTo(x, yScale.top);
                        ctx.lineTo(x, yScale.bottom);
                        ctx.stroke();
                        ctx.restore();
                    }
                };

                const chart = new Chart(ctx, {
                    type: 'line',
                    data: { datasets },
                    plugins: [crosshairPlugin],
                    options: options
                });
                store[chartId] = chart;
                if (onChartReady) onChartReady();
            } catch (e) {
                chartEl.innerHTML = `<p style="color:rgba(255,255,255,0.8);">Error: ${e.message}</p>`;
            }
        }

        function render(containerEl) {
            containerEl.innerHTML = '';

            const hasAnyData = availableGases.length > 0 && (
                (state.data && state.data.length > 0) ||
                (state.dataPerGas && Object.values(state.dataPerGas).some(function(a) { return a && a.length > 0; }))
            );
            if (!hasAnyData) {
                containerEl.innerHTML = '<div style="text-align:center;padding:60px;color:rgba(255,255,255,0.7);">No Time Lag data available</div>';
                return;
            }

            const mainLayout = document.createElement('div');
            mainLayout.className = 'eddypro-main-layout';

            const card = document.createElement('div');
            card.className = 'widget-card';

            const header = document.createElement('div');
            header.className = 'widget-card-header';
            header.style.display = 'flex';
            header.style.alignItems = 'center';
            header.style.justifyContent = 'space-between';

            const title = document.createElement('h3');
            title.className = 'widget-card-title';
            function updateTitle() {
                const keys = state.dataPerGas && Object.keys(state.dataPerGas) || [];
                if (keys.length > 1) title.textContent = 'Time Lag';
                else {
                    const g = availableGases.find(x => state.selectedGases && state.selectedGases[x.key]);
                    title.textContent = (g ? g.label : 'CO₂') + ' Time Lag';
                }
            }
            updateTitle();
            header.appendChild(title);

            const badgeEl = document.createElement('span');
            badgeEl.className = 'filters-badge';
            const updateBadge = () => {
                const n = getActiveFilterCount(state, defaultSelectedGases);
                badgeEl.textContent = String(n);
                badgeEl.classList.toggle('hidden', n === 0);
            };

            const filtersBtn = document.createElement('button');
            filtersBtn.type = 'button';
            filtersBtn.className = 'filters-btn filters-pill-btn';
            filtersBtn.innerHTML = '<span class="filters-icon" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg></span> Filters ';
            filtersBtn.appendChild(badgeEl);
            const applyAndRender = () => {
                applyFilters();
                updateTitle();
                initChart();
            };
            filtersBtn.addEventListener('click', () => openFiltersDrawer(getState, setState, applyAndRender, updateBadge, stationId, availableGases));
            header.appendChild(filtersBtn);

            card.appendChild(header);

            const body = document.createElement('div');
            body.className = 'widget-card-body widget-card-body-chart';
            const chartWrapper = document.createElement('div');
            chartWrapper.className = 'chart-wrapper';
            chartWrapper.id = `timelag-chart-${stationId}`;
            chartWrapper.style.cssText = 'min-height: 520px; width: 100%;';
            body.appendChild(chartWrapper);
            card.appendChild(body);
            mainLayout.appendChild(card);
            containerEl.appendChild(mainLayout);

            const getState = () => state;
            const setState = (s) => { Object.assign(state, s); };
            updateBadge();

            let attempts = 0;
            function scheduleRender() {
                attempts++;
                const chartEl = document.getElementById(`timelag-chart-${stationId}`);
                if (!chartEl || attempts > 80) return;
                if (chartEl.offsetWidth > 0 && chartEl.offsetHeight > 0) {
                    initChart();
                    return;
                }
                setTimeout(scheduleRender, 200);
            }
            setTimeout(scheduleRender, 100);
        }

        render(container);
        return { state, applyFilters };
    }

    const exportTarget = (typeof window !== 'undefined' ? window : global);
    if (exportTarget) {
        exportTarget.TimeLagPage = { create: createTimeLagPage, buildTimeLagData };
    }
})(typeof window !== 'undefined' ? window : this);

/**
 * EddyEye Hub - Dashboard Core
 * State, load, init, navigation, switchStation, updateParameterSelect, updateLastUpdated
 */
(function(global) {
    'use strict';

    // Global state (shared with other modules)
    let currentStationId = null;
    let currentTimePeriod = '7d';
    let currentParameter = null;
    let chartInstances = {};
    let dashboardData = [];
    let dashboardConfig = null;

    const DASHBOARD_TAB_KEY = 'eddyeye_dashboard_tab';
    const DASHBOARD_STATION_KEY = 'eddyeye_dashboard_station';

    /** Фиксированный порядок станций в UI: по алфавиту имени (не порядок в config/API). */
    function sortStationsAlphabetically(stations) {
        return (stations || []).slice().sort((a, b) => {
            const na = String(a.display_name || a.station_name || a.station_id || '');
            const nb = String(b.display_name || b.station_name || b.station_id || '');
            return na.localeCompare(nb, undefined, { sensitivity: 'base', numeric: true });
        });
    }

    // Expose state for other modules
    global.currentStationId = () => currentStationId;
    global.setCurrentStationId = (id) => { currentStationId = id; };
    global.currentTimePeriod = () => currentTimePeriod;
    global.setCurrentTimePeriod = (v) => { currentTimePeriod = v; };
    global.currentParameter = () => currentParameter;
    global.setCurrentParameter = (v) => { currentParameter = v; };
    global.chartInstances = () => chartInstances;
    global.dashboardData = () => dashboardData;
    global.dashboardConfig = () => dashboardConfig;
    global.DASHBOARD_TAB_KEY = DASHBOARD_TAB_KEY;
    global.DASHBOARD_STATION_KEY = DASHBOARD_STATION_KEY;

    async function loadDashboardData() {
        try {
            const response = await fetch('/api/data');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            let result;
            try {
                result = await response.json();
            } catch (e) {
                throw new Error('Invalid server response');
            }
            if (result.success) {
                dashboardData = sortStationsAlphabetically(result.data || []);
                dashboardConfig = result.config || {};
                if (typeof window !== 'undefined') window.dashboardConfig = dashboardConfig;

                dashboardData.forEach(station => {
                    try {
                        if (!station.parameters) {
                            const stationConfig = dashboardConfig?.stations?.find(s => s.id === station.station_id);
                            if (stationConfig && stationConfig.parameters) {
                                station.parameters = stationConfig.parameters;
                            }
                        }
                    } catch (e) {
                        throw e;
                    }
                });

                return true;
            } else {
                throw new Error(result.error || 'Failed to load data');
            }
        } catch (error) {
            console.error('[API] Ошибка при загрузке данных:', error);
            const content = document.getElementById('dashboardContent');
            if (content) {
                content.innerHTML = '<div class="glass-card" style="text-align: center; padding: 40px;">' +
                    '<h2 style="color: #ffffff;">Failed to load data</h2>' +
                    '<p style="color: rgba(255,255,255,0.8);">Failed to load data from server. Make sure the server is running.</p>' +
                    '<p id="load-error-msg" style="color: rgba(255,255,255,0.6); margin-top: 20px;"></p></div>';
                const errEl = content.querySelector('#load-error-msg');
                if (errEl) errEl.textContent = String(error?.message || 'Unknown error');
            }
            return false;
        }
    }

    function getStationIdFromPath() {
        const pathname = (window.location.pathname || '').replace(/^\/+|\/+$/g, '');
        const firstSegment = pathname.split('/')[0] || '';
        if (firstSegment === 'multi_station') {
            return 'multi_station';
        }
        return firstSegment;
    }

    function initializeStationNavigation() {
        const nav = document.getElementById('stationNav');
        if (!nav) return;

        nav.innerHTML = '';

        dashboardData.forEach(station => {
            const link = document.createElement('a');
            link.className = 'station-btn';
            link.href = '/' + station.station_id;
            link.setAttribute('data-station-id', station.station_id);
            const label = document.createTextNode(station.display_name || station.station_name);
            link.appendChild(label);
            if (station.station_id === currentStationId) {
                link.classList.add('active');
            }
            const stCfg = dashboardConfig?.stations?.find(s => s.id === station.station_id);
            const stWithParams = (stCfg?.parameters && !station.parameters)
                ? { ...station, parameters: stCfg.parameters } : station;
            const severity = (typeof global.computeStationAlertSeverity === 'function')
                ? global.computeStationAlertSeverity(stWithParams) : null;
            if (severity) {
                link.setAttribute('data-severity', severity);
                const badge = document.createElement('span');
                badge.className = `station-alert-badge station-alert-badge--${severity}`;
                badge.textContent = '!';
                badge.setAttribute('aria-label', severity === 'critical' ? 'Critical alert' : 'Warning');
                link.appendChild(badge);
            }
            if (window.location.pathname.includes('multi_station')) {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = '/' + station.station_id;
                });
            }
            nav.appendChild(link);
        });

        const separator = document.createElement('div');
        separator.className = 'station-nav-separator';
        separator.style.cssText = 'width: 1px; height: 24px; background: rgba(255,255,255,0.2); margin: 0 8px;';
        nav.appendChild(separator);

        const multiStationBtn = document.createElement('button');
        multiStationBtn.className = 'station-btn';

const MULTISTATION_HALF_HOUR_MS = 30 * 60 * 1000;
const MULTISTATION_MAX_GAP_MS = 35 * 60 * 1000;
function insertGapsInLineDataMultiStation(data, maxGapMs) {
    if (!data || data.length < 2) return data || [];
    const gap = maxGapMs != null ? maxGapMs : MULTISTATION_MAX_GAP_MS;
    const sorted = data.slice().sort((a, b) => a.x - b.x);
    const out = [];
    for (let i = 0; i < sorted.length; i++) {
        out.push(sorted[i]);
        if (i < sorted.length - 1 && (sorted[i + 1].x - sorted[i].x) > gap) {
            out.push({ x: sorted[i].x + MULTISTATION_HALF_HOUR_MS, y: null });
        }
    }
    return out;
}

function calculateCoverage(data, periodHours = 24) {
    if (!data || data.length === 0) return { percentage: 0, status: 'error' };
    
    // Calculate expected number of records for the period
    // Assuming 30-minute intervals for most data
    const expectedRecords = periodHours * 2; // 2 records per hour
    
    // Count non-null records
    const validRecords = data.filter(row => {
        // Check if row has at least one non-null numeric value (excluding TIMESTAMP)
        return Object.keys(row).some(key => 
            key !== 'TIMESTAMP' && 
            row[key] !== null && 
            row[key] !== undefined && 
            !isNaN(row[key])
        );
    }).length;
    
    const percentage = Math.min(100, (validRecords / expectedRecords) * 100);
    
    let status = 'error';
    if (percentage >= 85) status = 'good';
    else if (percentage >= 70) status = 'warn';
    
    return { percentage: Math.round(percentage * 10) / 10, status };
}

/** Рисует только кольцо (без текста) для ячейки таблицы. canvas — элемент, size — логический размер. */
function createSmallDonutRing(canvas, percentage, size) {
    if (!canvas || !canvas.getContext) return;
    size = size || 52;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const centerX = size / 2, centerY = size / 2;
    const radius = size * 0.38;
    const lineWidth = size * 0.12;
    const bgColor = 'rgba(255, 255, 255, 0.15)';
    let dynamicColor = 'rgba(76, 175, 80, 0.9)';
    if (percentage < 60) dynamicColor = 'rgba(244, 67, 54, 0.9)';
    else if (percentage < 80) dynamicColor = 'rgba(255, 193, 7, 0.9)';
    ctx.clearRect(0, 0, size, size);
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
    ctx.lineWidth = lineWidth;
    ctx.strokeStyle = bgColor;
    ctx.lineCap = 'round';
    ctx.stroke();
    if (percentage > 0) {
        const startAngle = -Math.PI / 2;
        const endAngle = startAngle + (2 * Math.PI * percentage / 100);
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, startAngle, endAngle, false);
        ctx.strokeStyle = dynamicColor;
        ctx.stroke();
    }
    const displayPct = percentage % 1 === 0 ? Math.round(percentage) : Number(percentage).toFixed(1);
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.max(9, size * 0.28)}px Roboto, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(displayPct + '%', centerX, centerY);
}

function createSingleDonutChart(canvasId, percentage, color) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    
    // Поддержка Retina дисплеев (MacBook и другие высокие DPI экраны)
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    
    // Устанавливаем внутренний размер canvas с учетом DPR
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    
    // Масштабируем контекст обратно для CSS размеров
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    
    // Теперь работаем с логическими размерами (CSS размеры)
    const logicalWidth = rect.width;
    const logicalHeight = rect.height;
    const centerX = logicalWidth / 2;
    const centerY = logicalHeight / 2;
    
    // Адаптивные размеры в зависимости от размера canvas
    const scale = Math.min(logicalWidth, logicalHeight) / 120; // Базовый размер 120px
    const radius = 45 * scale;
    const lineWidth = 12 * scale;
    const fontSize = 16 * scale;
    const bgColor = 'rgba(255, 255, 255, 0.1)';
    
    // Определяем цвет в зависимости от процента
    let dynamicColor;
    if (percentage >= 80) {
        dynamicColor = 'rgba(76, 175, 80, 0.9)'; // Зеленый (80-100%)
    } else if (percentage >= 60) {
        dynamicColor = 'rgba(255, 193, 7, 0.9)'; // Желтый (60-80%)
    } else {
        dynamicColor = 'rgba(244, 67, 54, 0.9)'; // Красный (<60%)
    }
    
    // Очищаем canvas
    ctx.clearRect(0, 0, logicalWidth, logicalHeight);
    
    // Рисуем фоновое кольцо (полный круг)
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
    ctx.lineWidth = lineWidth;
    ctx.strokeStyle = bgColor;
    ctx.lineCap = 'round';
    ctx.stroke();
    
    // Рисуем заполненную часть
    if (percentage > 0) {
        const startAngle = -Math.PI / 2; // Начинаем сверху
        const endAngle = startAngle + (2 * Math.PI * percentage / 100);
        
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, startAngle, endAngle, false);
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = dynamicColor;
        ctx.lineCap = 'round';
        ctx.stroke();
    }
    
    // Рисуем процент внутри круга (всегда, даже если 0)
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${fontSize}px Roboto, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const displayPercent = percentage % 1 === 0 ? `${Math.round(percentage)}%` : `${Number(percentage).toFixed(1)}%`;
    ctx.fillText(displayPercent, centerX, centerY);
}

// Create custom dropdown component
function createCustomDropdown(id, label, options, selectedValue, onChange) {
    const dropdown = document.createElement('div');
    dropdown.className = 'custom-dropdown';
    dropdown.id = id;
    
    const trigger = document.createElement('div');
    trigger.className = 'custom-dropdown-trigger';
    trigger.innerHTML = `
        <span class="dropdown-text">${options.find(opt => opt.value === selectedValue)?.label || options[0]?.label || ''}</span>
        <span class="dropdown-icon">▼</span>
    `;
    
    const menu = document.createElement('div');
    menu.className = 'custom-dropdown-menu';
    
    options.forEach(option => {
        const item = document.createElement('div');
        item.className = 'custom-dropdown-item' + (option.value === selectedValue ? ' selected' : '');
        item.textContent = option.label;
        item.dataset.value = option.value;
        
        item.addEventListener('click', () => {
            // Update selected item
            menu.querySelectorAll('.custom-dropdown-item').forEach(i => i.classList.remove('selected'));
            item.classList.add('selected');
            
            // Update trigger text
            trigger.querySelector('.dropdown-text').textContent = option.label;
            
            // Close menu
            trigger.classList.remove('active');
            menu.classList.remove('active');
            
            // Call onChange callback
            if (onChange) onChange(option.value);
        });
        
        menu.appendChild(item);
    });
    
    trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        const isActive = trigger.classList.contains('active');
        
        // Close all other dropdowns
        document.querySelectorAll('.custom-dropdown-trigger').forEach(t => {
            if (t !== trigger) {
                t.classList.remove('active');
                t.nextElementSibling?.classList.remove('active');
            }
        });
        
        // Toggle this dropdown
        trigger.classList.toggle('active', !isActive);
        menu.classList.toggle('active', !isActive);
    });
    
    // Close dropdown when clicking outside - use a more specific handler
    const closeHandler = (e) => {
        if (!dropdown.contains(e.target)) {
            trigger.classList.remove('active');
            menu.classList.remove('active');
        }
    };
    
    // Add event listener with capture to ensure it fires
    document.addEventListener('click', closeHandler, true);
    
    // Store handler for potential cleanup (though not strictly necessary here)
    dropdown._closeHandler = closeHandler;
    
    dropdown.appendChild(trigger);
    dropdown.appendChild(menu);
    
    return dropdown;
}

/** Находит значение параметра в NA статистике с гибким сопоставлением имён. */
function findNaValue(naStats, paramName) {
    const normalized = normalizeParamName(paramName);
    const candidates = [paramName, normalized];
    if (paramName === 'u_star') {
        candidates.push('u*', 'ustar', 'friction_velocity', 'frictionvelocity');
    } else if (paramName === 'wind_speed') {
        candidates.push('windspeed', 'wind speed', 'ws');
    }
    for (const key in naStats) {
        if (normalizeParamName(key) === normalized || candidates.includes(key)) {
            return naStats[key];
        }
    }
    return null;
}

    // Get NA statistics

function createChartJSGauge(canvasId, value, thresholds) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    
    // Determine color based on value
    let color = 'rgba(244, 67, 54, 0.6)'; // danger
    if (value >= thresholds.success[0]) {
        color = 'rgba(76, 175, 80, 0.6)'; // success
    } else if (value >= thresholds.warning[0]) {
        color = 'rgba(255, 193, 7, 0.6)'; // warning
    }
    
    const chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            datasets: [{
                data: [value, 100 - value],
                backgroundColor: [color, 'rgba(255, 255, 255, 0.1)'],
                borderWidth: 0
            }]
        },
        options: {
            cutout: '75%',
            plugins: {
                legend: { display: false },
                tooltip: {
                    enabled: true,
                    callbacks: {
                        label: function(context) {
                            return `${context.parsed}%`;
                        }
                    }
                }
            },
            responsive: true,
            maintainAspectRatio: false,
            animation: {
                onComplete: function() {
                    // Рисуем текст после завершения анимации Chart.js
                    // Chart.js сам обрабатывает devicePixelRatio и устанавливает правильный размер canvas
                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;
                    
                    ctx.save();
                    ctx.fillStyle = '#ffffff';
                    // Используем размер шрифта пропорциональный размеру canvas (Chart.js уже масштабировал его)
                    const fontSize = Math.min(canvas.width, canvas.height) * 0.15;
                    ctx.font = `bold ${fontSize}px Roboto`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(`${value}%`, centerX, centerY);
                    ctx.restore();
                }
            }
        }
    });
}

/**
 * Returns parameters that are available in all selected stations
 * Compares by label (normalized) instead of key/name to handle different naming conventions
 * @param {Array} selectedStations - Array of station objects
 * @param {string} dataType - 'eddypro' or 'lf'
 * @returns {Array} Array of common parameters
 */
function getCommonParameters(selectedStations, dataType) {
    if (!selectedStations || selectedStations.length === 0) {
        return [];
    }

    // Normalize label for comparison (lowercase, remove extra spaces)
    const normalizeLabel = (label) => {
        return (label || '').toLowerCase().trim().replace(/\s+/g, ' ');
    };

    // Collect all unique parameters from all stations grouped by normalized label
    const paramsByLabel = new Map();
    
    selectedStations.forEach(station => {
        // Try to get parameters from station object first, then from config
        let stationParams = dataType === 'eddypro' 
            ? (station.parameters?.eddypro || [])
            : (station.parameters?.lf || []);
        
        // If no parameters in station object, try to get from config
        if (!stationParams || stationParams.length === 0) {
            const stationConfig = dashboardConfig?.stations?.find(s => s.id === station.station_id);
            if (stationConfig) {
                stationParams = dataType === 'eddypro' 
                    ? (stationConfig.parameters?.eddypro || [])
                    : (stationConfig.parameters?.lf || []);
            }
        }

        const epOv = (typeof globalThis !== 'undefined' && typeof globalThis.isEddyProOverviewParam === 'function')
            ? globalThis.isEddyProOverviewParam
            : (p) => p && p.gauge === true;
        const lfOv = (typeof globalThis !== 'undefined' && typeof globalThis.isLfOverviewParam === 'function')
            ? globalThis.isLfOverviewParam
            : (p) => p && typeof p === 'object';
        if (dataType === 'eddypro') {
            stationParams = (stationParams || []).filter((p) => epOv(p));
        } else {
            stationParams = (stationParams || []).filter((p) => lfOv(p));
        }

        stationParams.forEach(param => {
            const normalizedLabel = normalizeLabel(param.label);
            if (!paramsByLabel.has(normalizedLabel)) {
                paramsByLabel.set(normalizedLabel, {
                    label: param.label,
                    unit: param.unit,
                    stations: new Map() // Map of station_id -> param object
                });
            }
            const paramGroup = paramsByLabel.get(normalizedLabel);
            paramGroup.stations.set(station.station_id, param);
        });
    });

    // Filter parameters that exist in ALL selected stations
    const commonParams = [];
    const stationIds = selectedStations.map(s => s.station_id);
    
    paramsByLabel.forEach((paramGroup, normalizedLabel) => {
        const hasInAllStations = stationIds.every(id => paramGroup.stations.has(id));
        
        if (hasInAllStations) {
            // Use the first station's parameter as reference
            const firstStationId = stationIds[0];
            const firstParam = paramGroup.stations.get(firstStationId);
            
            // Create station param map
            const stationParamMap = new Map(
                Array.from(paramGroup.stations.entries()).map(([sid, p]) => [
                    sid,
                    dataType === 'eddypro' ? p.name : p.key
                ])
            );
            
            
            commonParams.push({
                label: paramGroup.label,
                unit: paramGroup.unit,
                // Store mapping of station_id -> param key/name for data extraction
                stationParamMap: stationParamMap
            });
        }
    });

    
    return commonParams;
}
