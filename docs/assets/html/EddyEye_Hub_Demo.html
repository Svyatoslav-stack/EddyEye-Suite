<script>
(function () {
  'use strict';

  /**
   * При file:// вызов history.replaceState(null, '', '/agali_cc') превращает документ в file:///agali_cc
   * и ломает безопасность/загрузку. Hub делает это для «красивого» URL на сервере — в демо отключаем.
   */
  if (location.protocol === 'file:') {
    var origReplace = history.replaceState.bind(history);
    var origPush = history.pushState.bind(history);
    function isVirtualHubPath(url) {
      if (url == null || typeof url !== 'string') return false;
      if (url.indexOf('.html') !== -1) return false;
      return /^\/[^#?]*$/.test(url) && url.length > 1;
    }
    history.replaceState = function (state, title, url) {
      if (isVirtualHubPath(url)) return;
      return origReplace(state, title, url);
    };
    history.pushState = function (state, title, url) {
      if (isVirtualHubPath(url)) return;
      return origPush(state, title, url);
    };
  }

  var nativeFetch = window.fetch ? window.fetch.bind(window) : null;

  var HF_SVG = 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405">' +
    '<defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">' +
    '<stop offset="0%" style="stop-color:#0d1f33"/><stop offset="100%" style="stop-color:#1a3a66"/></linearGradient></defs>' +
    '<rect width="720" height="405" fill="url(#g)"/>' +
    '<text x="360" y="200" fill="rgba(255,255,255,0.85)" font-family="Roboto,Arial,sans-serif" font-size="20" text-anchor="middle">HF demo frame</text>' +
    '<text x="360" y="230" fill="rgba(255,255,255,0.5)" font-family="Roboto,Arial,sans-serif" font-size="13" text-anchor="middle">EddyEye Hub · offline</text>' +
    '</svg>'
  );

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function utcTimestamp(ms) {
    var d = new Date(ms);
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()) + ' ' +
      pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes()) + ':' + pad2(d.getUTCSeconds());
  }

  /** Вчера 23:30 UTC — как в прод-логике ожидаемого конца периода */
  function yesterdayEndUtcMs() {
    var now = new Date();
    var y = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - 1, 23, 30, 0);
    return y;
  }

  function buildHalfHourRows(endMs, slotCount, phase, amp) {
    var startMs = endMs - (slotCount - 1) * 30 * 60 * 1000;
    var rows = [];
    for (var i = 0; i < slotCount; i++) {
      var ms = startMs + i * 30 * 60 * 1000;
      var t = i / 48.0;
      var windDir = (ms / 60000) % 360;
      var windSpeed = 2.1 + Math.sin(t * phase) * 1.2 + (i % 19) * 0.015;
      var co2 = Math.sin(t * 0.85 + phase) * 9 * amp + Math.cos(i * 0.07) * 1.5;
      var q = (i % 53 === 0) ? 6 : 1;
      rows.push({
        TIMESTAMP: utcTimestamp(ms),
        co2_flux: co2,
        h2o_flux: Math.cos(t * 0.72 + phase) * 2.8 * amp,
        ch4_flux: Math.sin(t * 0.48) * 0.045 * amp,
        n2o_flux: Math.cos(t * 0.35) * 0.018 * amp,
        u_star: 0.14 + Math.abs(Math.sin(t + phase)) * 0.22,
        wind_speed: windSpeed,
        wind_dir: windDir,
        H: Math.sin(t * 1.1 + phase) * 45 * amp,
        ET: Math.max(0, Math.sin(t * 1.05) * 0.35 * amp),
        qc_co2_flux: q
      });
    }
    return { rows: rows, startMs: startMs, endMs: endMs };
  }

  function buildLfRows(endMs, slotCount, phase, amp) {
    var startMs = endMs - (slotCount - 1) * 30 * 60 * 1000;
    var rows = [];
    for (var i = 0; i < slotCount; i++) {
      var ms = startMs + i * 30 * 60 * 1000;
      var t = i / 48.0;
      rows.push({
        TIMESTAMP: utcTimestamp(ms),
        ROT_AirTC_Avg: 8 + Math.sin(t * 0.6 + phase) * 4 * amp + (i % 7) * 0.02,
        ROT_RH_Avg: 65 + Math.cos(t * 0.5 + phase) * 12 * amp,
        VPD: 0.4 + Math.abs(Math.sin(t * 0.4)) * 0.35 * amp
      });
    }
    return { rows: rows, startMs: startMs, endMs: endMs };
  }

  function rangeFromRows(rows) {
    if (!rows.length) return { min: '', max: '' };
    return { min: rows[0].TIMESTAMP, max: rows[rows.length - 1].TIMESTAMP };
  }

  function naEddyParam(param, weeklyNa, monthlyNa, annualNa, avail) {
    return [
      { Parameter: param, Period: 'Weekly', NA_percent: weeklyNa },
      { Parameter: param, Period: 'Monthly', NA_percent: monthlyNa },
      { Parameter: param, Period: 'Annual', NA_percent: annualNa },
      { Parameter: param, Available_data: avail }
    ];
  }

  function naLfKey(key, w, m, y) {
    return [
      { Parameter: key, Period: 'Weekly', NA_percent: w },
      { Parameter: key, Period: 'Monthly', NA_percent: m },
      { Parameter: key, Period: 'Annual', NA_percent: y }
    ];
  }

  function buildStation(spec) {
    var end = yesterdayEndUtcMs();
    var ep7 = buildHalfHourRows(end, 7 * 48 + 1, spec.phase, spec.amp);
    var epM = buildHalfHourRows(end, Math.min(30 * 48 + 1, 900), spec.phase + 0.2, spec.amp);
    var epY = buildHalfHourRows(end, Math.min(120 * 48 + 1, 2000), spec.phase + 0.4, spec.amp * 0.95);
    var lf7 = buildLfRows(end, 7 * 48 + 1, spec.phase, spec.amp);
    var lfM = buildLfRows(end, Math.min(30 * 48 + 1, 900), spec.phase, spec.amp);
    var lfY = buildLfRows(end, Math.min(120 * 48 + 1, 2000), spec.phase, spec.amp);

    var eddypro_na = [].concat(
      naEddyParam('co2_flux', 5, 7, 9, 93 - spec.naBias),
      naEddyParam('h2o_flux', 6, 8, 10, 91 - spec.naBias),
      naEddyParam('ch4_flux', 8, 10, 12, 88 - spec.naBias),
      naEddyParam('n2o_flux', 9, 11, 14, 86 - spec.naBias),
      naEddyParam('u_star', 4, 6, 8, 94 - spec.naBias),
      naEddyParam('wind_speed', 5, 7, 9, 92 - spec.naBias),
      naEddyParam('H', 7, 9, 11, 90 - spec.naBias),
      naEddyParam('ET', 8, 10, 12, 89 - spec.naBias)
    );

    var lf_na = [].concat(
      naLfKey('ROT_AirTC_Avg', 3, 5, 7),
      naLfKey('ROT_RH_Avg', 4, 6, 8),
      naLfKey('VPD', 4, 5, 7)
    );

    var hf_na = [
      { Parameter: 'CO2_DRY', Period: 'Weekly', Collected_percent: 92 - spec.naBias, Missing_original: 0.2, Missing_before_filt: 2.1, Missing_after_filt: 1.4 },
      { Parameter: 'CO2_DRY', Period: 'Monthly', Collected_percent: 90 - spec.naBias, Missing_original: 0.3, Missing_before_filt: 2.4, Missing_after_filt: 1.6 },
      { Parameter: 'CO2_DRY', Period: 'Annual', Collected_percent: 88 - spec.naBias, Missing_original: 0.4, Missing_before_filt: 2.8, Missing_after_filt: 1.9 },
      { Parameter: 'H2O_DRY', Period: 'Weekly', Collected_percent: 91 - spec.naBias, Missing_original: 0.25, Missing_before_filt: 2.0, Missing_after_filt: 1.5 },
      { Parameter: 'Aux_1_Avg', Period: 'Weekly', Collected_percent: 89 - spec.naBias, Missing_original: 0.3, Missing_before_filt: 2.2, Missing_after_filt: 1.7 }
    ];

    return {
      station_id: spec.id,
      display_name: spec.display_name,
      station_name: spec.display_name,
      timezone: 'Europe/Tallinn',
      parameters: spec.parameters,
      data: {
        eddypro: {
          last_7d: ep7.rows,
          last_month: epM.rows,
          annual: epY.rows
        },
        eddypro_actual_ranges: {
          last_7d: rangeFromRows(ep7.rows),
          last_month: rangeFromRows(epM.rows),
          annual: rangeFromRows(epY.rows)
        },
        eddypro_na: eddypro_na,
        lf: {
          last_7d: lf7.rows,
          last_month: lfM.rows,
          annual: lfY.rows
        },
        lf_actual_ranges: {
          last_7d: rangeFromRows(lf7.rows),
          last_month: rangeFromRows(lfM.rows),
          annual: rangeFromRows(lfY.rows)
        },
        lf_na: lf_na,
        hf: {
          overview: { note: 'demo' },
          total_records: 250000 + spec.phase * 1000,
          date_range: { min: utcTimestamp(end - 3 * 86400000), max: utcTimestamp(end) }
        },
        hf_na: hf_na,
        decouple_na: []
      }
    };
  }

  function demoConfig(stationsMeta) {
    var now = new Date();
    var du = pad2(now.getUTCDate()) + '.' + pad2(now.getUTCMonth() + 1) + '.' + now.getUTCFullYear() + ' ' +
      pad2(now.getUTCHours()) + ':' + pad2(now.getUTCMinutes()) + ' UTC';

    var stCfg = stationsMeta.map(function (m) {
      return {
        id: m.id,

        name: m.display_name,
        timezone: 'Europe/Tallinn',
        hf_display: m.hf_display,
        parameters: m.parameters
      };
    });

    return {
      general: { last_updated: du },
      dashboard: {
        availability_thresholds: {
          danger: [0, 59.99],
          warning: [60, 79.99],
          success: [80, 100]
        },
        danger_zone_threshold: 60
      },
      outdated_tolerance_days: 1,
      stations: stCfg
    };
  }

  function pickEstonianDemoNames() {
    var poolA = [
      'Rannamõisa liivik', 'Haademeeste rand', 'Nõva puisniit', 'Kihnu kadastik',
      'Loode küla heinamaa', 'Vormsi põhjamets'
    ];
    var poolB = [
      'Kõruse puisniit', 'Soomaa serv', 'Matsalu niit', 'Vilsandi kadakas',
      'Panga pank', 'Sõrve säär'
    ];
    var a = poolA[Math.floor(Math.random() * poolA.length)];
    var b = poolB[Math.floor(Math.random() * poolB.length)];
    if (b === a) b = poolB[(poolB.indexOf(b) + 1) % poolB.length];
    return { firstName: a, secondName: b };
  }

            { name: 'u_star', label: 'Friction velocity', unit: 'm/s', overview: true },

          ],

            { name: 'h2o_flux', label: 'H₂O flux', unit: 'mmol m⁻² s⁻¹', overview: true },
            { name: 'ch4_flux', label: 'CH₄ flux', unit: 'μmol m⁻² s⁻¹', overview: true },

          ],

  window.__EEDY_BUILD_DEMO__ = buildDemoApiResponse;

  function demoResolveFetchUrl(input) {
    if (typeof input === 'string') {

    if (input && typeof Request !== 'undefined' && input instanceof Request) return input.url;

  }

  function demoUrlLooksLikeApiData(href) {
    if (!href) return false;
    if (href.indexOf('/api/data') !== -1) return true;
    if (href.indexOf('api/data') !== -1 && href.indexOf('api/stations') === -1) return true;
    try {
      var p = new URL(href, location.href).pathname;
      return p.indexOf('api/data') !== -1;
    } catch (e2) {

    }
  }

  function demoUrlLooksLikeHfImage(href) {
    if (!href) return false;
    return href.indexOf('/hf-image/') !== -1 || href.indexOf('hf-image') !== -1;

  window.fetch = function (input, init) {
    var href = demoResolveFetchUrl(input);
    if (demoUrlLooksLikeApiData(href)) {
      var body = JSON.stringify(buildDemoApiResponse());
      return Promise.resolve(new Response(body, {

        status: 200,

/* ========== dashboard-utils.js ========== */
/**
 * EddyEye Hub - Shared utilities for dashboard modules
 * Functions used by Overview, LF, EddyPro, Cross-Station and other components
 */
(function(global) {
    'use strict';

    /** Parse "YYYY-MM-DD HH:MM:SS" or "YYYY-MM-DDTHH:MM:SS" or "YYYY-MM-DD HH:MM" as UTC; returns ms. All stations store TIMESTAMP in UTC. */
    function parseTimestampUTC(timestampStr) {
        if (!timestampStr) return null;
        const str = String(timestampStr).trim();
        const match = str.match(/^(\d{4})-(\d{2})-(\d{2})[\sT](\d{2}):(\d{2})(?::(\d{2}))?/);
        if (!match) return new Date(str).getTime();
        const year = parseInt(match[1], 10);
        const month = parseInt(match[2], 10) - 1;
        const day = parseInt(match[3], 10);
        const hour = parseInt(match[4], 10);
        const minute = parseInt(match[5], 10);
        const second = match[6] ? parseInt(match[6], 10) : 0;
        return Date.UTC(year, month, day, hour, minute, second);
    }

    /** Format timestamp (ms) for axis/tooltip in given IANA timezone (e.g. 'Europe/Tallinn' or 'UTC'). */
    function formatTimestampInTz(ms, timeZone, options) {
        if (ms == null || !isFinite(ms)) return '';
        const opts = options || { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
        return new Date(ms).toLocaleString('en-GB', { ...opts, timeZone });
    }

    function formatDateShort(d) {
        if (!d || !(d instanceof Date) || isNaN(d.getTime())) return '—';
        const day = d.getDate();
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const month = months[d.getMonth()];
        const year = d.getFullYear();
        const thisYear = new Date().getFullYear();
        return year !== thisYear ? `${day} ${month} ${year}` : `${day} ${month}`;
    }

    function formatDateShortInTz(ms, timeZone) {
        if (ms == null || !isFinite(ms)) return '—';
        const d = new Date(ms);
        if (isNaN(d.getTime())) return '—';
        const parts = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone }).formatToParts(d);
        const day = (parts.find(p => p.type === 'day') || {}).value || '';
        const month = (parts.find(p => p.type === 'month') || {}).value || '';
        const year = (parts.find(p => p.type === 'year') || {}).value || '';
        const thisYear = new Date().getFullYear();
        return Number(year) !== thisYear ? `${day} ${month} ${year}` : `${day} ${month}`;
    }

    function getActualDateRange(data, parseFunc) {
        if (!data || data.length === 0) return null;
        const pf = parseFunc || parseTimestampUTC;
        const timestamps = data.map(row => row?.TIMESTAMP ? pf(row.TIMESTAMP) : null).filter(ts => ts != null && !isNaN(ts));
        if (timestamps.length === 0) return null;
        const minMs = Math.min(...timestamps);
        const maxMs = Math.max(...timestamps);
        return { minDate: new Date(minMs), maxDate: new Date(maxMs), minMs, maxMs };
    }

    /** Возвращает фактический диапазон из eddypro_actual_ranges или lf_actual_ranges (с сервера). */
    function getActualRangeFromServer(actualRanges, periodKey) {
        if (!actualRanges || typeof actualRanges !== 'object') return null;
        const keyMap = { '7d': 'last_7d', 'month': 'last_month', 'year': 'annual' };
        const r = actualRanges[keyMap[periodKey]];
        if (!r || !r.min || !r.max) return null;
        const minDate = new Date(String(r.min).replace(' ', 'T') + 'Z');
        const maxDate = new Date(String(r.max).replace(' ', 'T') + 'Z');
        if (isNaN(minDate.getTime()) || isNaN(maxDate.getTime())) return null;
        return { minDate, maxDate, minMs: minDate.getTime(), maxMs: maxDate.getTime() };
    }

    function getExpectedEndForPeriod(period, sourceType) {
        const now = new Date();
        const yesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
        if (period === '7d') return yesterday;
        if (period === 'month' || period === 'year') {
            const end = new Date(yesterday);
            end.setHours(23, 59, 59, 999);
            return end;
        }
        return yesterday;
    }

    /** Returns { minDate, maxDate } for the expected period range. EddyPro: +1 day both. LF/HF: +1 day min only. */
    function getExpectedRangeForPeriod(period, sourceType) {
        const now = new Date();
        const yesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
        yesterday.setHours(23, 59, 59, 999);
        let minDate;
        if (period === '7d') {
            minDate = new Date(yesterday);
            minDate.setDate(minDate.getDate() - 6);
            minDate.setHours(0, 0, 0, 0);
        } else if (period === 'month') {
            minDate = new Date(now.getFullYear(), now.getMonth(), 1);
        } else if (period === 'year') {
            minDate = new Date(now.getFullYear(), 0, 1);
        } else {
            minDate = new Date(yesterday);
            minDate.setDate(minDate.getDate() - 6);
            minDate.setHours(0, 0, 0, 0);
        }
        let maxDate = yesterday;
        if (sourceType === 'eddypro') {
            minDate = new Date(minDate.getTime() + 86400000);
            minDate.setHours(0, 0, 0, 0);
            maxDate = new Date(yesterday.getTime() + 86400000);
            maxDate.setHours(23, 59, 59, 999);
        } else if (sourceType === 'lf' || sourceType === 'hf') {
            minDate = new Date(minDate.getTime() + 86400000);
            minDate.setHours(0, 0, 0, 0);
        }
        return { minDate, maxDate };
    }

    function isPeriodOutdated(actualEndDate, expectedEndDate, toleranceDays) {
        if (!actualEndDate || !expectedEndDate) return false;
        toleranceDays = toleranceDays ?? 1;
        const actualDay = new Date(actualEndDate.getFullYear(), actualEndDate.getMonth(), actualEndDate.getDate()).getTime();
        const expectedDay = new Date(expectedEndDate.getFullYear(), expectedEndDate.getMonth(), expectedEndDate.getDate()).getTime();
        const diffDays = (expectedDay - actualDay) / (1000 * 60 * 60 * 24);
        return diffDays >= toleranceDays;
    }

    /** Returns number of days actualEnd is behind expectedEnd (0 if actualEnd >= expectedEnd). */
    function getDaysBehind(actualEndDate, expectedEndDate) {
        if (!actualEndDate || !expectedEndDate) return 0;
        const actualDay = new Date(actualEndDate.getFullYear(), actualEndDate.getMonth(), actualEndDate.getDate()).getTime();
        const expectedDay = new Date(expectedEndDate.getFullYear(), expectedEndDate.getMonth(), expectedEndDate.getDate()).getTime();
        const diffDays = Math.round((expectedDay - actualDay) / (1000 * 60 * 60 * 24));
        return Math.max(0, diffDays);
    }

    /** Returns number of days actualStart is behind expectedStart (0 if actualStart <= expectedStart). Data starts later = missing days at start. */
    function getDaysBehindStart(actualMinDate, expectedMinDate) {
        if (!actualMinDate || !expectedMinDate) return 0;
        const actualDay = new Date(actualMinDate.getFullYear(), actualMinDate.getMonth(), actualMinDate.getDate()).getTime();
        const expectedDay = new Date(expectedMinDate.getFullYear(), expectedMinDate.getMonth(), expectedMinDate.getDate()).getTime();
        const diffDays = Math.round((actualDay - expectedDay) / (1000 * 60 * 60 * 24));
        return Math.max(0, diffDays);
    }

    function normalizeStationId(id) {
        return (id || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function normalizeParamName(name) {
        if (!name) return '';
        return String(name).toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function paramMatchesNaRow(rowParam, configParamName) {
        const r = (rowParam || '').toString().trim();
        const n = normalizeParamName(r);
        const c = normalizeParamName(configParamName);
        if (n === c) return true;
        if (configParamName === 'u_star' && ['u*', 'ustar', 'friction_velocity', 'frictionvelocity'].includes(n)) return true;
        if (configParamName === 'wind_speed' && ['windspeed', 'wind speed', 'ws'].includes(n)) return true;
        return false;
    }

    function getAvailabilityThresholds() {
        const dashboardConfig = (typeof global !== 'undefined' && global.dashboardConfig) || {};
        const t = dashboardConfig?.dashboard?.availability_thresholds;
        return {
            success: t?.success ?? [80, 100],
            warning: t?.warning ?? [50, 79.99],
            danger: t?.danger ?? [0, 49.99]
        };
    }

    function getDangerThreshold() {
        const dashboardConfig = (typeof global !== 'undefined' && global.dashboardConfig) || {};
        // Используем отдельный порог для danger zone, если указан, иначе берем warning[0]
        if (dashboardConfig?.dashboard?.danger_zone_threshold != null) {
            return Number(dashboardConfig.dashboard.danger_zone_threshold);
        }
        return getAvailabilityThresholds().warning[0];
    }

    function getOutdatedToleranceDays() {
        const dashboardConfig = (typeof global !== 'undefined' && global.dashboardConfig) || {};
        // Используем значение из конфига, если указано, иначе по умолчанию 1 день
        if (dashboardConfig?.dashboard?.outdated_tolerance_days != null) {
            return Number(dashboardConfig.dashboard.outdated_tolerance_days);
        }
        return 1;
    }

    /** CH4/CO2/H2O/N2O → CH₄/CO₂/H₂O/N₂O в подписи (таблицы HF, алерты, fallback). */
    function beautifyGasMoleculeSubscripts(s) {
        if (s == null || typeof s !== 'string') return s;
        return s
            .replace(/\bCH4\b/gi, 'CH₄')
            .replace(/\bCO2\b/gi, 'CO₂')
            .replace(/\bH2O\b/gi, 'H₂O')
            .replace(/\bN2O\b/gi, 'N₂O');
    }

    /** EddyPro: charts, gauges, overview — параметры с overview: true (fallback: legacy gauge: true). */
    function isEddyProOverviewParam(param) {
        if (!param || typeof param !== 'object') return false;
        if (typeof param.overview === 'boolean') return param.overview;
        return param.gauge === true;
    }

    /** LF: charts, overview — параметры с overview: true (если overview не задан, все из списка). */
    function isLfOverviewParam(param) {
        if (!param || typeof param !== 'object') return false;
        if (typeof param.overview === 'boolean') return param.overview;
        return true;
    }

    /**
     * Determine which tabs/sections to show for a station.
     * Uses config.dashboard.show_tabs or station show_tabs if set; else derives from data.
     */
    function getStationTabVisibility(station, dashboardConfig) {
        const stationConfig = dashboardConfig?.stations?.find(s => s.id === station.station_id);
        const stationTabs = stationConfig?.show_tabs;
        const defaultTabs = dashboardConfig?.dashboard?.show_tabs;
        const derive = () => ({
            eddypro: !!(station.parameters?.eddypro?.length && station.data?.eddypro),
            hf: !!(stationConfig?.hf_display || (station.data?.hf_na && station.data.hf_na.length > 0) || station.data?.hf),
            lf: !!(station.parameters?.lf?.length && station.data?.lf)
        });
        if (stationTabs && typeof stationTabs === 'object') {
            return {
                eddypro: stationTabs.eddypro !== false,
                hf: stationTabs.hf !== false,
                lf: stationTabs.lf !== false
            };
        }
        if (defaultTabs && typeof defaultTabs === 'object') {
            const d = derive();
            return {
                eddypro: defaultTabs.eddypro !== false && d.eddypro,
                hf: defaultTabs.hf !== false && d.hf,
                lf: defaultTabs.lf !== false && d.lf
            };
        }
        return derive();
    }

    function getEddyProCoverageFromNa(station, parameterName) {
        const na = station.data.eddypro_na;
        if (!na || !Array.isArray(na)) {
            return { '7d': { percentage: 0 }, 'month': { percentage: 0 }, 'year': { percentage: 0 } };
        }
        const pctFromNaPercent = (naPct) => Math.max(0, Math.min(100, 100 - (Number(naPct) || 0)));
        const param = (s) => (s.Parameter || s.parameter || '').toString().trim();
        const period = (s) => (s.Period || '').toString().trim();
        let weekPct = 0, monthPct = 0, yearPct = 0;
        for (const row of na) {
            if (!paramMatchesNaRow(param(row), parameterName)) continue;
            const naVal = row.NA_percent;
            const pct = pctFromNaPercent(naVal);
            const p = period(row);
            if (p === 'Weekly') weekPct = pct;
            else if (p === 'Monthly') monthPct = pct;
            else if (p === 'Annual') yearPct = pct;
        }
        return { '7d': { percentage: weekPct }, 'month': { percentage: monthPct }, 'year': { percentage: yearPct } };
    }

    function getLFCoverageFromNa(station, parameterKey) {
        const na = station.data.lf_na;
        if (!na || !Array.isArray(na)) {
            return { '7d': { percentage: 0 }, 'month': { percentage: 0 }, 'year': { percentage: 0 } };
        }
        const pctFromNaPercent = (naPct) => Math.max(0, Math.min(100, 100 - (Number(naPct) || 0)));
        const param = (s) => (s.Parameter || s.parameter || s.key || '').toString().trim();
        const period = (s) => (s.Period || '').toString().trim();
        let weekPct = 0, monthPct = 0, yearPct = 0;
        for (const row of na) {
            if (param(row) !== parameterKey) continue;
            const naVal = row.NA_percent;
            const pct = pctFromNaPercent(naVal);
            const p = period(row);
            if (p === 'Weekly') weekPct = pct;
            else if (p === 'Monthly') monthPct = pct;
            else if (p === 'Annual') yearPct = pct;
        }
        return { '7d': { percentage: weekPct }, 'month': { percentage: monthPct }, 'year': { percentage: yearPct } };
    }

    /** Unique Parameter strings from eddypro_na (NA statistics / count CSV from station pipeline). */
    function getUniqueEddyProNaParameters(naRows) {
        const seen = new Map();
        for (const row of naRows || []) {
            const p = (row.Parameter || row.parameter || '').toString().trim();
            if (!p) continue;
            const k = p.toLowerCase();
            if (!seen.has(k)) seen.set(k, p);
        }
        return Array.from(seen.values());
    }

    /** Unique parameter keys from lf_na. */
    function getUniqueLfNaParameters(naRows) {
        const seen = new Map();
        for (const row of naRows || []) {
            const p = (row.Parameter || row.parameter || row.key || '').toString().trim();
            if (!p) continue;
            const k = p.toLowerCase();
            if (!seen.has(k)) seen.set(k, p);
        }
        return Array.from(seen.values());
    }

    /**
     * Parameters for EddyPro «overall» coverage: intersection of NA file columns with config overview params.
     * Uses labels from config when matched; if intersection is empty, falls back to all NA parameters.
     * @returns {{ id: string, label: string, naKey: string }[]}
     */
    function getEddyProOverallNaItems(station) {
        const na = station?.data?.eddypro_na;
        const naParams = getUniqueEddyProNaParameters(na);
        if (!naParams.length) return [];
        const configParams = (station?.parameters?.eddypro || []).filter(isEddyProOverviewParam);
        const matched = [];
        for (const naP of naParams) {
            const cfg = configParams.find((cp) => paramMatchesNaRow(naP, cp.name));
            if (cfg) {
                matched.push({
                    id: cfg.name,
                    label: cfg.label != null ? cfg.label : cfg.name,
                    naKey: naP
                });
            }
        }
        if (matched.length) return matched;
        return naParams.map((naP) => ({ id: naP, label: naP, naKey: naP }));
    }

    /**
     * Все overview-параметры EddyPro из конфига; для каждого подставляется запись из getEddyProOverallNaItems при совпадении id.
     * Нужно, чтобы KPI/алерты учитывали те же метрики, что таблица «Lowest availability»: если в NA нет строки, getEddyProCoverageFromNa даёт 0%,
     * но параметр не выпадал из среднего и драйверов (например CO₂/H₂O mixing ratio).
     * @param {Array<{id: string, label?: string}>} eddyGaugeList
     * @returns {{ id: string, label: string, naKey?: string }[]}
     */
    function mergeEddyProCovItemsFromNa(station, eddyGaugeList) {
        const gaugeItems = (eddyGaugeList || []).map((p) => ({
            id: p.id,
            label: p.label != null ? p.label : p.id
        }));
        if (!gaugeItems.length) return [];
        let naItems = [];
        if (station?.data?.eddypro_na?.length) {
            naItems = getEddyProOverallNaItems(station) || [];
        }
        if (!naItems.length) return gaugeItems;
        const naById = new Map(naItems.map((it) => [it.id, it]));
        return gaugeItems.map((g) => naById.get(g.id) || g);
    }

    /**
     * LF overall coverage set: NA file keys ∩ getLFParams(station); fallback all NA keys.
     * @returns {{ id: string, label: string, naKey: string }[]}
     */
    function getLfOverallNaItems(station) {
        const na = station?.data?.lf_na;
        const naParams = getUniqueLfNaParameters(na);
        if (!naParams.length) return [];
        const lfList = getLFParams(station);
        const matched = [];
        for (const naP of naParams) {
            const cfg = lfList.find((lp) => {
                const k = (lp.key || lp.name || '').toString().trim().toLowerCase();
                return k === naP.toLowerCase();
            });
            if (cfg) {
                matched.push({
                    id: cfg.key,
                    label: cfg.label != null ? cfg.label : cfg.key,
                    naKey: naP
                });
            }
        }
        if (matched.length) return matched;
        return naParams.map((naP) => ({ id: naP, label: naP, naKey: naP }));
    }

    const LF_CHART_PARAMS_FALLBACK = [
        { key: 'ROT_AirTC_Avg', label: 'ROT AirTC Avg', unit: '°C' },
        { key: 'ROT_RH_Avg', label: 'ROT RH Avg', unit: '%' },
        { key: 'VPD', label: 'VPD', unit: 'kPa' }
    ];

    const LF_COLOR_PALETTE = ['#F08A4B', '#FF6B89', '#33FF77', '#D1A0FF'];

    function getLFParams(station) {
        const raw = station?.parameters?.lf;
        if (Array.isArray(raw) && raw.length > 0) {
            return raw
                .filter(isLfOverviewParam)
                .map((p, idx) => ({
                    key: p.key || p.name || String(idx),
                    label: p.label != null ? p.label : (p.key || p.name || String(idx)),
                    unit: p.unit != null ? p.unit : ''
                }));
        }
        return LF_CHART_PARAMS_FALLBACK;
    }

    function getLFQualityColumn(data) {
        if (!data || data.length === 0) return null;
        const keys = Object.keys(data[0]);
        return keys.find(k => /^quality$/i.test(k) || /quality_flag/i.test(k) || /^qc$/i.test(k)) || null;
    }

    /**
     * Finds the quality column for an EddyPro parameter.
     * Quality 1-9, 1=best, 9=worst.
     * Gap-filled rows from prepareTimeSeries may only have TIMESTAMP,
     * so we scan multiple rows to find one with data columns.
     * @param {Array} data - EddyPro data rows
     * @param {string} paramName - e.g. 'co2_flux'
     * @returns {string|null} Column name or null
     */
    function getEddyProQualityColumn(data, paramName) {
        if (!data || data.length === 0 || !paramName) return null;
        const param = String(paramName).toLowerCase();
        const matcher = (k) => {
            const lk = k.toLowerCase();
            return lk === `${param}_qualid` || lk === `qc_${param}` || lk === `${param}_qc` ||
                lk === 'qualid' || lk === 'qc';
        };
        const limit = Math.min(data.length, 200);
        for (let i = 0; i < limit; i++) {
            const keys = Object.keys(data[i]);
            const found = keys.find(matcher);
            if (found) return found;
        }
        return null;
    }

    /**
     * Gets storage column for a flux parameter (e.g. co2_strg for co2_flux).
     * @param {Object} row - Data row
     * @param {string} paramName - e.g. 'co2_flux'
     * @returns {string|null} Storage column name if exists
     */
    function getEddyProStorageColumn(row, paramName) {
        if (!paramName || !/^[a-z0-9]+_flux$/i.test(paramName)) return null;
        const base = paramName.replace(/_flux$/i, '');
        const candidates = [`${base}_strg`, `${base}_storage`, `strg_${base}`];
        const keys = Object.keys(row);
        const found = keys.find(k => candidates.some(c => k.toLowerCase() === c.toLowerCase()));
        return found || null;
    }

    function getZonedParts(ms, timeZone) {
        const dtf = new Intl.DateTimeFormat('en-GB', {
            timeZone, hour12: false,
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
        });
        const parts = dtf.formatToParts(new Date(ms));
        const obj = {};
        for (const p of parts) if (p.type !== 'literal') obj[p.type] = p.value;
        return { year: +obj.year, month: +obj.month, day: +obj.day, hour: +obj.hour, minute: +obj.minute, second: +obj.second };
    }

    function getTimeZoneOffsetMs(timeZone, ms) {

                } else {
                    const hfwm = hfNaWmy();
                    leftCovW = hfwm.w;
                    leftCovM = hfwm.m;
                    leftCovY = hfwm.y;
                }

                const gLf = (key) => global.getLFCoverageFromNa(station, key);
                const lfCovItems = lfItemsForOverall.length ? lfItemsForOverall : mapGaugeToOverallItems(lfParamList);
                const lfCovHasItems = visibility.lf && lfCovItems.length;
                const rightCovW = lfCovHasItems ? avgNaPeriod(gLf, lfCovItems, '7d') : null;
                const rightCovM = lfCovHasItems ? avgNaPeriod(gLf, lfCovItems, 'month') : null;
                const rightCovY = lfCovHasItems ? avgNaPeriod(gLf, lfCovItems, 'year') : null;

                const covPctClass = (pct) => {
                    if (pct == null || !Number.isFinite(pct)) return 'updated-kpi-cov-na';
                    if (pct >= successMinAvail) return 'updated-kpi-cov-ok';
                    if (pct >= warnMinAvail) return 'updated-kpi-cov-warn';
                    return 'updated-kpi-cov-bad';
                };
                const fmtCovCell = (pct) => `<span class="${covPctClass(pct)}">${pct != null && Number.isFinite(pct) ? `${pct.toFixed(1)}%` : '—'}</span>`;

                const freshLeft = useEddyLeft
                    ? formatFreshnessBlock(eddyRange?.maxMs)
                    : formatFreshnessBlock(hfLastObsMs);
                const freshRight = visibility.lf
                    ? formatFreshnessBlock(lfRange?.maxMs)
                    : { tsLine: '—', status: '—', statusClass: 'flat' };
                const leftFreshLabel = useEddyLeft ? 'EddyPro' : 'High frequency';

                const alerts = [];
                const covChecks = [
                    { label: `${leftCovAlertLabel} Week`,  pct: leftCovW, scope: 'left', period: 'w' },
                    { label: `${leftCovAlertLabel} Month`, pct: leftCovM, scope: 'left', period: 'm' },
                    { label: `${leftCovAlertLabel} Year`,  pct: leftCovY, scope: 'left', period: 'y' },
                    { label: 'LF Week',  pct: rightCovW, scope: 'lf', period: 'w' },
                    { label: 'LF Month', pct: rightCovM, scope: 'lf', period: 'm' },
                    { label: 'LF Year',  pct: rightCovY, scope: 'lf', period: 'y' },
                ];

                const naPeriodToCovKey = { w: '7d', m: 'month', y: 'year' };

                const collectHfNaRowsOverview = () => {
                    const rows = [];
                    if (Array.isArray(station?.data?.hf_na)) rows.push(...station.data.hf_na);
                    if (Array.isArray(station?.data?.decouple_na)) rows.push(...station.data.decouple_na);
                    return rows;
                };

                const hfRowBucket = (row) => {
                    const pl = String(row.Period || row.period || '').trim().toLowerCase();
                    if (pl === 'weekly' || pl === 'week' || pl === '7d' || pl === '') return 'w';
                    if (pl === 'monthly' || pl === 'month') return 'm';
                    if (pl === 'annual' || pl === 'year' || pl === 'yearly') return 'y';
                    return null;
                };

                const hfPctFromRow = (row) => {
                    const v = row.Collected_percent != null ? Number(row.Collected_percent)
                        : (row.Available_data != null ? Number(row.Available_data) : NaN);
                    if (!Number.isFinite(v)) return null;
                    return Math.max(0, Math.min(100, v));
                };

                const hfLabelForParam = (raw) => {
                    if (typeof global.resolveHfNaParameterLabel === 'function') {
                        return global.resolveHfNaParameterLabel(raw);
                    }
                    const map = (typeof global.HF_NA_PARAMETER_LABELS === 'object' && global.HF_NA_PARAMETER_LABELS) || {};
                    if (raw && map[raw]) return map[raw];
                    const fb = String(raw || '—').replace(/_/g, ' ').replace(/\b\w/g, (l) => l.toUpperCase());
                    return typeof global.beautifyGasMoleculeSubscripts === 'function'
                        ? global.beautifyGasMoleculeSubscripts(fb)
                        : fb;
                };

                const pickCoverageDrivers = (scored, thresholdPct) => {
                    if (!scored.length) return [];
                    const below = scored.filter((i) => i.pct < thresholdPct).sort((a, b) => a.pct - b.pct);
                    if (below.length) {
                        const out = [];
                        const seen = new Set();
                        for (const x of below) {
                            if (!seen.has(x.label)) { seen.add(x.label); out.push(x.label); }
                        }
                        return out;
                    }
                    const worst = Math.min(...scored.map((i) => i.pct));
                    const out = [];
                    const seen = new Set();
                    for (const x of scored) {
                        if (Math.abs(x.pct - worst) < 1e-6 && !seen.has(x.label)) {
                            seen.add(x.label);
                            out.push(x.label);
                        }
                    }
                    return out;
                };

                const driversForHfPeriod = (bucket, thresholdPct) => {
                    const scored = [];
                    for (const row of collectHfNaRowsOverview()) {
                        if (hfRowBucket(row) !== bucket) continue;
                        const pct = hfPctFromRow(row);
                        if (pct == null) continue;
                        const raw = row.Parameter || row.parameter;
                        scored.push({ label: hfLabelForParam(raw), pct });
                    }
                    return pickCoverageDrivers(scored, thresholdPct);
                };

                const driversForNaItems = (getCov, items, covKey, thresholdPct) => {
                    const scored = [];
                    for (const it of items) {
                        const cov = getCov(it.id);
                        const p = cov && cov[covKey] ? Number(cov[covKey].percentage) : NaN;
                        if (!Number.isFinite(p)) continue;
                        scored.push({ label: it.label || it.id, pct: p });
                    }
                    return pickCoverageDrivers(scored, thresholdPct);
                };

                const resolveCovDrivers = (check, severityKind) => {
                    const thresh = severityKind === 'critical' ? warnMinAvail : successMinAvail;
                    const covKey = naPeriodToCovKey[check.period];
                    if (!covKey) return [];
                    if (check.scope === 'lf') {
                        if (!lfCovHasItems) return [];
                        return driversForNaItems(gLf, lfCovItems, covKey, thresh);
                    }
                    if (check.scope === 'left') {
                        if (useEddyLeft) {
                            if (!eddyCovItems.length) return [];
                            const gE = (name) => global.getEddyProCoverageFromNa(station, name);
                            return driversForNaItems(gE, eddyCovItems, covKey, thresh);
                        }
                        return driversForHfPeriod(check.period, thresh);
                    }
                    return [];
                };

                const mergeMinPctByLabel = (scored) => {
                    const m = new Map();
                    for (const { label, pct } of scored) {
                        const prev = m.get(label);
                        if (prev == null || pct < prev) m.set(label, pct);
                    }
                    return [...m.entries()].map(([label, pct]) => ({ label, pct }));
                };

                const collectScoredForCovCheck = (check) => {
                    const covKey = naPeriodToCovKey[check.period];
                    if (!covKey) return [];
                    if (check.scope === 'lf') {
                        if (!lfCovHasItems) return [];
                        const scored = [];
                        for (const it of lfCovItems) {
                            const cov = gLf(it.id);
                            const p = cov && cov[covKey] ? Number(cov[covKey].percentage) : NaN;
                            if (!Number.isFinite(p)) continue;
                            scored.push({ label: it.label || it.id, pct: p });
                        }
                        return mergeMinPctByLabel(scored);
                    }
                    if (check.scope === 'left') {
                        if (useEddyLeft) {
                            const gE = (name) => global.getEddyProCoverageFromNa(station, name);
                            const scored = [];
                            for (const it of eddyCovItems) {
                                const cov = gE(it.id);
                                const p = cov && cov[covKey] ? Number(cov[covKey].percentage) : NaN;
                                if (!Number.isFinite(p)) continue;
                                scored.push({ label: it.label || it.id, pct: p });
                            }
                            return mergeMinPctByLabel(scored);
                        }
                        const scored = [];
                        for (const row of collectHfNaRowsOverview()) {
                            if (hfRowBucket(row) !== check.period) continue;
                            const pct = hfPctFromRow(row);
                            if (pct == null) continue;
                            const raw = row.Parameter || row.parameter;
                            scored.push({ label: hfLabelForParam(raw), pct });
                        }
                        return mergeMinPctByLabel(scored);
                    }
                    return [];
                };

                const mergeDriversWithDanger = (existingLabels, scoredAll, dangerThreshold) => {
                    if (!Number.isFinite(dangerThreshold)) return existingLabels || [];
                    const pctByLabel = new Map();
                    for (const s of scoredAll) {
                        const prev = pctByLabel.get(s.label);
                        if (prev == null || s.pct < prev) pctByLabel.set(s.label, s.pct);
                    }
                    const belowDangerLabels = new Set(
                        scoredAll.filter((s) => s.pct < dangerThreshold).map((s) => s.label)
                    );
                    const labels = new Set([...(existingLabels || []), ...belowDangerLabels]);
                    return [...labels].sort((a, b) => {
                        const pa = pctByLabel.get(a);
                        const pb = pctByLabel.get(b);
                        return (Number.isFinite(pa) ? pa : 999) - (Number.isFinite(pb) ? pb : 999);
                    });
                };

                for (const c of covChecks) {
                    if (c.pct == null || !Number.isFinite(c.pct)) continue;
                    if (c.pct < warnMinAvail) {
                        const drivers = resolveCovDrivers(c, 'critical');
                        alerts.push({
                            severity: 'critical',
                            reason: 'Low data coverage',
                            parameter: c.label,
                            value: `${c.pct.toFixed(1)}%`,
                            drivers
                        });
                    } else if (c.pct < successMinAvail) {
                        const drivers = resolveCovDrivers(c, 'warning');
                        alerts.push({
                            severity: 'warning',
                            reason: 'Reduced data coverage',
                            parameter: c.label,
                            value: `${c.pct.toFixed(1)}%`,
                            drivers
                        });
                    }
                }

                const dangerThr =
                    typeof global.getDangerThreshold === 'function' ? Number(global.getDangerThreshold()) : NaN;
                if (Number.isFinite(dangerThr)) {
                    const coverageReasons = new Set(['Low data coverage', 'Reduced data coverage']);
                    const checkByLabel = new Map(covChecks.map((ch) => [ch.label, ch]));
                    for (const a of alerts) {
                        if (!coverageReasons.has(a.reason)) continue;
                        const ch = checkByLabel.get(a.parameter);
                        if (!ch) continue;
                        const scoredAll = collectScoredForCovCheck(ch);
                        a.drivers = mergeDriversWithDanger(a.drivers, scoredAll, dangerThr);
                    }
                    for (const ch of covChecks) {
                        const avgBad =
                            ch.pct != null &&
                            Number.isFinite(ch.pct) &&
                            (ch.pct < warnMinAvail || ch.pct < successMinAvail);
                        if (avgBad) continue;
                        const scoredAll = collectScoredForCovCheck(ch);
                        const below = scoredAll.filter((s) => s.pct < dangerThr);
                        if (!below.length) continue;
                        below.sort((a, b) => a.pct - b.pct);
                        const minPct = below[0].pct;
                        const drivers = mergeDriversWithDanger([], scoredAll, dangerThr);
                        const severity = minPct < warnMinAvail ? 'critical' : 'warning';
                        const reason = minPct < warnMinAvail ? 'Low data coverage' : 'Reduced data coverage';
                        alerts.push({
                            severity,
                            reason,
                            parameter: ch.label,
                            value: `${minPct.toFixed(1)}%`,
                            drivers
                        });
                    }
                }

                {
                    const covReasonsMin = new Set(['Low data coverage', 'Reduced data coverage']);
                    const chkByLabelMin = new Map(covChecks.map((ch) => [ch.label, ch]));
                    for (const a of alerts) {
                        if (!covReasonsMin.has(a.reason)) continue;
                        const ch = chkByLabelMin.get(a.parameter);
                        if (!ch) continue;
                        const scoredAll = collectScoredForCovCheck(ch);
                        if (!scoredAll.length) continue;
                        const minAny = Math.min(...scoredAll.map((s) => s.pct));
                        if (Number.isFinite(minAny) && minAny < warnMinAvail) {
                            a.severity = 'critical';
                            a.reason = 'Low data coverage';
                            a.value = `${minAny.toFixed(1)}%`;
                        }
                    }
                    for (const a of alerts) {
                        if (a.severity !== 'critical' || a.reason !== 'Low data coverage') continue;
                        const ch = chkByLabelMin.get(a.parameter);
                        if (!ch || !a.drivers || !a.drivers.length) continue;
                        const scoredAll = collectScoredForCovCheck(ch);
                        const pctByLabel = new Map();
                        for (const s of scoredAll) {
                            const prev = pctByLabel.get(s.label);
                            if (prev == null || s.pct < prev) pctByLabel.set(s.label, s.pct);
                        }
                        a.drivers = a.drivers.filter((lab) => {
                            const p = pctByLabel.get(lab);
                            return Number.isFinite(p) && p < warnMinAvail;
                        });
                    }
                }

                if (freshLeft.statusClass === 'down') {
                    alerts.push({ severity: 'critical', reason: 'Stale data', parameter: leftFreshLabel, value: freshLeft.tsLine });
                }
                if (freshRight.statusClass === 'down') {
                    alerts.push({ severity: 'critical', reason: 'Stale data', parameter: 'Low frequency', value: freshRight.tsLine });
                }

                const mergeAlertsBySeverityAndReason = (list) => {
                    const groups = new Map();
                    for (const a of list) {
                        const key = `${a.severity}\0${a.reason}`;
                        if (!groups.has(key)) groups.set(key, []);
                        groups.get(key).push(a);
                    }
                    const out = [];
                    for (const g of groups.values()) {
                        if (g.length === 1) {
                            out.push(g[0]);
                        } else {
                            out.push({
                                severity: g[0].severity,
                                reason: g[0].reason,
                                _parts: g.map((x) => ({ parameter: x.parameter, value: x.value, drivers: x.drivers }))
                            });
                        }
                    }
                    return out;
                };
                const KPI_ALERT_DRIVERS_PREVIEW = 5;

                const formatCoveragePeriodLabelHtml = (label) => {
                    const esc = escapeUpdatedHtml(label);
                    const periodRe = /^(EddyPro|HF|LF) (Week|Month|Year)$/;
                    const legacyHfRe = /^High frequency (Week|Month|Year)$/;
                    if (periodRe.test(label) || legacyHfRe.test(label)) {
                        return '<strong class="kpi-alert-period-em">' + esc + '</strong>';
                    }
                    return esc;
                };

                const formatCoverageDriversHtml = (drivers) => {
                    if (!drivers || !drivers.length) return '';
                    if (drivers.length <= KPI_ALERT_DRIVERS_PREVIEW) {
                        return drivers.map((d) => escapeUpdatedHtml(d)).join(', ');
                    }
                    const head = drivers.slice(0, KPI_ALERT_DRIVERS_PREVIEW).map((d) => escapeUpdatedHtml(d)).join(', ');
                    const tail = drivers.slice(KPI_ALERT_DRIVERS_PREVIEW).map((d) => escapeUpdatedHtml(d)).join(', ');
                    return (
                        '<span class="kpi-alert-drivers-wrap">' +
                        '<span class="kpi-alert-drivers-chunk kpi-alert-drivers-chunk--short">' + head + '</span>' +
                        '<span class="kpi-alert-drivers-chunk kpi-alert-drivers-chunk--rest" hidden>, ' + tail + '</span> ' +
                        '<button type="button" class="kpi-alert-readmore" aria-expanded="false">Read more</button>' +
                        '</span>'
                    );
                };

                const formatAlertParamCell = (a) => {
                    const parts = a._parts || [{ parameter: a.parameter, value: a.value, drivers: a.drivers }];
                    if (a.reason === 'Stale data') {
                        return parts.map((p) => escapeUpdatedHtml(p.parameter)).join(', ');
                    }
                    if (a.reason === 'Low data coverage' || a.reason === 'Reduced data coverage') {
                        return parts.map((p) => {
                            const base = formatCoveragePeriodLabelHtml(p.parameter);
                            const dr = p.drivers && p.drivers.length
                                ? ': ' + formatCoverageDriversHtml(p.drivers)
                                : '';
                            return base + dr;
                        }).join('; ');
                    }
                    return parts.map((p) => `${escapeUpdatedHtml(p.parameter)}: ${escapeUpdatedHtml(p.value)}`).join('; ');
                };

                const formatAlertTooltipPlain = (a) => {
                    const parts = a._parts || [{ parameter: a.parameter, value: a.value, drivers: a.drivers }];
                    if (a.reason === 'Stale data') {
                        return parts.map((p) => p.parameter).join(', ');
                    }
                    if (a.reason === 'Low data coverage' || a.reason === 'Reduced data coverage') {
                        return parts.map((p) => {
                            let t = p.parameter;
                            if (p.drivers && p.drivers.length) {
                                const shown = p.drivers.slice(0, KPI_ALERT_DRIVERS_PREVIEW).join(', ');
                                const more = p.drivers.length > KPI_ALERT_DRIVERS_PREVIEW
                                    ? ` (+${p.drivers.length - KPI_ALERT_DRIVERS_PREVIEW} more)`
                                    : '';
                                t += ': ' + shown + more;
                            }
                            return t;
                        }).join('; ');
                    }
                    return parts.map((p) => `${p.parameter}: ${p.value}`).join('; ');
                };

                const mergedAlerts = mergeAlertsBySeverityAndReason(alerts);

                const coverageSeverity = covChecks.some(c => c.pct != null && Number.isFinite(c.pct) && c.pct < warnMinAvail)
                    ? 'critical'
                    : covChecks.some(c => c.pct != null && Number.isFinite(c.pct) && c.pct < successMinAvail)
                        ? 'warning' : null;
                const freshnessSeverity = (freshLeft.statusClass === 'down' || freshRight.statusClass === 'down')
                    ? 'critical' : null;

                const severityBadge = (sev, tooltip) => sev
                    ? `<span class="kpi-alert-badge kpi-alert-badge--${sev}" title="${escapeUpdatedHtml(tooltip)}">!</span>`
                    : '';
                const covBadgeTooltip = mergedAlerts.filter(a => a.reason.includes('coverage')).map(formatAlertTooltipPlain).join(', ') || '';
                const freshBadgeTooltip = mergedAlerts.filter(a => a.reason === 'Stale data').map(formatAlertTooltipPlain).join(', ') || '';

                const sortedAlerts = mergedAlerts.slice().sort((a, b) => (a.severity === 'critical' ? 0 : 1) - (b.severity === 'critical' ? 0 : 1));
                const alertsHtml = sortedAlerts.length === 0
                    ? '<span class="updated-kpi-summary-alerts-caption" style="color: rgba(126,231,135,0.8);">✓ No active alerts</span>'
                    : sortedAlerts.map(a => `<div class="kpi-alert-row kpi-alert-row--${a.severity}"><span class="kpi-alert-severity">${a.severity === 'critical' ? 'Critical' : 'Warning'}</span><span class="kpi-alert-reason">${escapeUpdatedHtml(a.reason)}</span><span class="kpi-alert-param">${formatAlertParamCell(a)}</span></div>`).join('');
                const alertsCardSeverity = sortedAlerts.length ? sortedAlerts[0].severity : null;

                updatedLayoutEl.innerHTML = `
                    <div class="updated-row updated-row-1">
                        <div class="updated-stat updated-stat-kpi updated-kpi-coverage-card updated-kpi-summary-card"${coverageSeverity ? ` data-severity="${coverageSeverity}"` : ''}>
                            ${severityBadge(coverageSeverity, covBadgeTooltip)}
                            <div class="updated-kpi-summary-card-title">Overall Data Coverage</div>
                            <div class="updated-kpi-avail-split updated-kpi-summary-split">
                                <div class="updated-kpi-avail-section updated-kpi-summary-col">
                                    <div class="updated-kpi-summary-subtitle">${escapeUpdatedHtml(leftCovLabel)}</div>
                                    <div class="updated-kpi-summary-lines">
                                        <div class="updated-kpi-summary-line"><span class="updated-kpi-summary-label">Week</span><span class="updated-kpi-summary-value">${fmtCovCell(leftCovW)}</span></div>
                                        <div class="updated-kpi-summary-line"><span class="updated-kpi-summary-label">Month</span><span class="updated-kpi-summary-value">${fmtCovCell(leftCovM)}</span></div>
                                        <div class="updated-kpi-summary-line"><span class="updated-kpi-summary-label">Year</span><span class="updated-kpi-summary-value">${fmtCovCell(leftCovY)}</span></div>
                                    </div>
                                </div>
                                <div class="updated-kpi-avail-divider updated-kpi-summary-vrule" aria-hidden="true"></div>
                                <div class="updated-kpi-avail-section updated-kpi-summary-col">
                                    <div class="updated-kpi-summary-subtitle">Low frequency</div>
                                    <div class="updated-kpi-summary-lines">
                                        <div class="updated-kpi-summary-line"><span class="updated-kpi-summary-label">Week</span><span class="updated-kpi-summary-value">${fmtCovCell(rightCovW)}</span></div>
                                        <div class="updated-kpi-summary-line"><span class="updated-kpi-summary-label">Month</span><span class="updated-kpi-summary-value">${fmtCovCell(rightCovM)}</span></div>
                                        <div class="updated-kpi-summary-line"><span class="updated-kpi-summary-label">Year</span><span class="updated-kpi-summary-value">${fmtCovCell(rightCovY)}</span></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="updated-stat updated-stat-kpi updated-kpi-freshness-card updated-kpi-summary-card"${freshnessSeverity ? ` data-severity="${freshnessSeverity}"` : ''}>
                            ${severityBadge(freshnessSeverity, freshBadgeTooltip)}
                            <div class="updated-kpi-summary-card-title">Data Freshness</div>
                            <div class="updated-kpi-avail-split updated-kpi-summary-split">
                                <div class="updated-kpi-avail-section updated-kpi-summary-col">
                                    <div class="updated-kpi-summary-subtitle">${escapeUpdatedHtml(leftFreshLabel)}</div>
                                    <div class="updated-kpi-summary-lines">
                                        <div class="updated-kpi-summary-line"><span class="updated-kpi-summary-label">Last observation</span><span class="updated-kpi-summary-value updated-kpi-summary-value--multiline">${escapeUpdatedHtml(freshLeft.tsLine)}</span></div>
                                        <div class="updated-kpi-summary-line"><span class="updated-kpi-summary-label">Status</span><span class="updated-kpi-summary-value"><span class="updated-delta ${freshLeft.statusClass}">${escapeUpdatedHtml(freshLeft.status)}</span></span></div>
                                    </div>
                                </div>
                                <div class="updated-kpi-avail-divider updated-kpi-summary-vrule" aria-hidden="true"></div>
                                <div class="updated-kpi-avail-section updated-kpi-summary-col">
                                    <div class="updated-kpi-summary-subtitle">Low frequency</div>
                                    <div class="updated-kpi-summary-lines">
                                        <div class="updated-kpi-summary-line"><span class="updated-kpi-summary-label">Last observation</span><span class="updated-kpi-summary-value updated-kpi-summary-value--multiline">${escapeUpdatedHtml(freshRight.tsLine)}</span></div>
                                        <div class="updated-kpi-summary-line"><span class="updated-kpi-summary-label">Status</span><span class="updated-kpi-summary-value"><span class="updated-delta ${freshRight.statusClass}">${escapeUpdatedHtml(freshRight.status)}</span></span></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="updated-stat updated-stat-kpi updated-kpi-alerts-card updated-kpi-summary-card"${alertsCardSeverity ? ` data-severity="${alertsCardSeverity}"` : ''}>
                            <div class="updated-kpi-summary-card-title">Alerts${sortedAlerts.length ? ` <span class="kpi-alerts-count kpi-alerts-count--${alertsCardSeverity}">${sortedAlerts.length}</span>` : ''}</div>
                            <div class="updated-kpi-summary-alerts">
                                ${alertsHtml}
                            </div>
                        </div>
                    </div>
                `;

                if (!updatedLayoutEl._kpiAlertReadMoreBound) {
                    updatedLayoutEl._kpiAlertReadMoreBound = true;
                    updatedLayoutEl.addEventListener('click', (e) => {
                        const btn = e.target.closest('.kpi-alert-readmore');
                        if (!btn || !updatedLayoutEl.contains(btn)) return;
                        e.preventDefault();
                        const wrap = btn.closest('.kpi-alert-drivers-wrap');
                        if (!wrap) return;
                        const rest = wrap.querySelector('.kpi-alert-drivers-chunk--rest');
                        const expanded = btn.getAttribute('aria-expanded') === 'true';
                        if (expanded) {
                            if (rest) rest.hidden = true;
                            btn.setAttribute('aria-expanded', 'false');
                            btn.textContent = 'Read more';
                        } else {
                            if (rest) rest.hidden = false;
                            btn.setAttribute('aria-expanded', 'true');
                            btn.textContent = 'Read less';
                        }
                    });
                }
            };

            try { buildUpdatedOverview(); } catch (e) { /* ignore */ }

            const buildCursorSummaries = () => {
                const thresholds = (typeof global.getAvailabilityThresholds === 'function')
                    ? global.getAvailabilityThresholds()

        ctx.font = '13px Roboto';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        DIR_LABELS_8.forEach((lbl, idx) => {
            const i = idx * 2;
            const a = (i * SECTOR_DEG - 90) * Math.PI / 180;
            const x = cx + (r + 18) * Math.cos(a);
            const y = cy + (r + 18) * Math.sin(a);
            ctx.fillText(lbl, x, y);
        });

        if (wrap) {
            let calmBadge = wrap.querySelector('.wind-rose-calm');
            if (!calmBadge) {
                calmBadge = document.createElement('div');
                calmBadge.className = 'wind-rose-calm';
                wrap.appendChild(calmBadge);
            }
            calmBadge.textContent = calmPct.toFixed(1) + '% of the time wind speed was below 1 m/s (calm)';
        }
    }

    function drawFluxRose(canvas, wrap, data, dirCol, fluxCol, opts) {
        const minN = (opts && opts.minN) ?? FLUX_ROSE_MIN_N;
        const fluxUnit = (opts && opts.fluxUnit) || '';
        if (!data.length || !dirCol || !fluxCol) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        canvas.width = canvas.offsetWidth * dpr;
        canvas.height = canvas.offsetHeight * dpr;
        ctx.scale(dpr, dpr);
        const cx = canvas.offsetWidth / 2;
        const cy = canvas.offsetHeight / 2;
        const r = Math.min(cx, cy) * 0.85;

        const vals = Array(NUM_SECTORS).fill(null).map(() => []);
        const badRaw = [];
        let totalRows = 0, usedFlux = 0;
        let dirBad = 0;

        data.forEach(row => {
            totalRows++;
            const dirRaw = row[dirCol];
            const fluxRaw = row[fluxCol];
            const dir = toNum(dirRaw);
            const fl = toNum(fluxRaw);
            if (dir == null || dir < 0 || dir >= 360) { dirBad++; return; }
            if (fl == null) {
                if (fluxRaw != null && fluxRaw !== '' && badRaw.length < 5) badRaw.push(String(fluxRaw).slice(0, 30));
                return;
            }
            usedFlux++;
            const sec = dirToSector(dir);
            if (sec < 0) return;
            vals[sec].push(fl);
        });
        const medians = vals.map(v => v.length ? median(v) : null);
        const counts = vals.map(v => v.length);
        const validMedians = medians.filter(m => m != null);
        const absVals = validMedians.map(m => Math.abs(m));
        const scaleMode = (wrap && wrap._fluxRoseScaleMode) || 'p90';
        function perc(arr, p) {
            if (!arr.length) return 0.01;
            const sorted = [...arr].sort((a, b) => a - b);
            const idx = Math.min(arr.length - 1, Math.floor((p / 100) * arr.length));
            return sorted[idx] || 0.01;
        }
        const absMax = absVals.length
            ? (scaleMode === 'p90' ? perc(absVals, 90) : Math.max(...absVals, 0.01))
            : 0.01;

        if (usedFlux < minN && wrap) {
            ctx.clearRect(0, 0, canvas.offsetWidth, canvas.offsetHeight);
            let msgEl = wrap.querySelector('.flux-rose-no-data');
            if (!msgEl) { msgEl = document.createElement('div'); msgEl.className = 'flux-rose-no-data'; wrap.appendChild(msgEl); }
            msgEl.style.cssText = 'font-size:12px;color:rgba(255,255,255,0.7);margin-top:8px;';
            msgEl.textContent = `Not enough valid flux data (used ${usedFlux}/${totalRows})`;
            wrap._fluxRoseData = null;
            return;
        }
        let noDataEl = wrap.querySelector('.flux-rose-no-data');
        if (noDataEl) noDataEl.remove();

        ctx.clearRect(0, 0, canvas.offsetWidth, canvas.offsetHeight);

        const gapRad = (GAP_DEG / 2) * Math.PI / 180;
        ctx.globalAlpha = 0.88;
        medians.forEach((m, i) => {
            const n = counts[i];
            if (m == null || n === 0) return;
            const lowN = n < minN;
            const alpha = lowN ? 0.25 : 0.85;
            const a0 = (i * SECTOR_DEG - SECTOR_DEG / 2 - 90) * Math.PI / 180;
            const a1 = (i * SECTOR_DEG + SECTOR_DEG / 2 - 90) * Math.PI / 180;
            const a0g = a0 + gapRad;
            const a1g = a1 - gapRad;
            const barR = (Math.abs(m) / absMax) * r * 0.9;
            if (barR > 0) {
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, barR, a0g, a1g);
                ctx.closePath();
                ctx.fillStyle = m >= 0 ? `rgba(76, 175, 80, ${alpha})` : `rgba(244, 67, 54, ${alpha})`;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        });
        ctx.globalAlpha = 1;

        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx, cy - r);
        ctx.lineTo(cx, cy + r);
        ctx.moveTo(cx - r, cy);
        ctx.lineTo(cx + r, cy);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.font = '13px Roboto';
        ctx.textAlign = 'center';
        DIR_LABELS_8.forEach((lbl, idx) => {
            const i = idx * 2;
            const a = (i * SECTOR_DEG - 90) * Math.PI / 180;
            const x = cx + (r + 18) * Math.cos(a);
            const y = cy + (r + 18) * Math.sin(a);
            ctx.fillText(lbl, x, y);
        });

        if (wrap) {
            wrap._fluxRoseRedraw = () => drawFluxRose(canvas, wrap, data, dirCol, fluxCol, opts);
            let scaleEl = wrap.querySelector('.flux-rose-scale');
            if (!scaleEl) {
                scaleEl = document.createElement('div');
                scaleEl.className = 'flux-rose-scale';
                scaleEl.style.cursor = 'pointer';
                scaleEl.title = 'Click to switch scale (MAX ↔ P90)';
                wrap.appendChild(scaleEl);
                scaleEl.addEventListener('click', function() {
                    const cur = wrap._fluxRoseScaleMode || 'p90';
                    wrap._fluxRoseScaleMode = cur === 'p90' ? 'max' : 'p90';
                    if (wrap._fluxRoseRedraw) wrap._fluxRoseRedraw();
                });
            }
            const unitStr = fluxUnit ? ` ${fluxUnit}` : '';
            const lowNCount = counts.filter(c => c > 0 && c < minN).length;
            const modeLabel = scaleMode.toUpperCase();
            scaleEl.innerHTML = `${modeLabel}=${absMax.toFixed(2)}${unitStr} (used ${usedFlux}/${totalRows}${lowNCount > 0 ? `, n&lt;${minN} dimmed` : ''})`;
            wrap._fluxRoseData = { medians: medians.slice(), counts: counts.slice(), fluxUnit, r, cx, cy };
            if (!wrap._fluxRoseTooltipBound) {
                wrap._fluxRoseTooltipBound = true;
                const tooltip = document.createElement('div');
                tooltip.className = 'flux-rose-tooltip';
                tooltip.style.cssText = 'display:none;position:absolute;background:rgba(0,0,0,0.9);color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;z-index:100;pointer-events:none;';
                wrap.style.position = 'relative';
                wrap.appendChild(tooltip);
                canvas.addEventListener('mousemove', function(e) {
                    const rect = canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const wr = wrap.getBoundingClientRect();
                    const d = wrap._fluxRoseData;
                    if (!d) return;
                    const dx = x - d.cx;
                    const dy = y - d.cy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > d.r) { tooltip.style.display = 'none'; return; }
                    const angleDeg = (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;
                    const sec = Math.floor(angleDeg / SECTOR_DEG) % NUM_SECTORS;
                    const m = d.medians[sec];
                    const n = d.counts[sec];
                    const u = d.fluxUnit ? ' ' + d.fluxUnit : '';
                    tooltip.textContent = `${DIR_LABELS[sec]}: n=${n}${m != null ? `, median=${m.toFixed(2)}${u}` : ' (no data)'}`;
                    tooltip.style.display = 'block';
                    tooltip.style.left = (e.clientX - wr.left + 12) + 'px';
                    tooltip.style.top = (e.clientY - wr.top + 12) + 'px';
                });
                canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
            }
        }
    }

    function createRoseCard(title, canvasId, drawFn, options) {
        const card = document.createElement('div');
        card.className = 'widget-card';
        const header = document.createElement('div');
        header.className = 'widget-card-header';
        const titleEl = document.createElement('h3');
        titleEl.className = 'widget-card-title';
        titleEl.textContent = title;
        header.appendChild(titleEl);
        if (options?.legend) {
            const leg = document.createElement('div');
            leg.className = 'wind-rose-legend';
            options.legend.forEach((item, i) => {
                const it = document.createElement('div');
                it.className = 'wind-rose-legend-item';
                it.innerHTML = `<span class="wind-rose-legend-swatch" style="background:${SPEED_COLORS[i]}"></span><span>${item}</span>`;
                leg.appendChild(it);
            });
            header.appendChild(leg);
        }
        card.appendChild(header);
        const body = document.createElement('div');
        body.className = 'widget-card-body';
        const wrap = document.createElement('div');
        wrap.className = 'wind-rose-canvas-wrap';
        const canvas = document.createElement('canvas');
        canvas.id = canvasId;
        canvas.style.width = '100%';
        canvas.style.maxWidth = '400px';
        canvas.style.height = '400px';
        wrap.appendChild(canvas);
        body.appendChild(wrap);
        card.appendChild(body);
        return { card, draw: () => drawFn(canvas, wrap) };
    }

    function render(container, station, data, fluxParam) {
        if (!container || !data) return;

        const dirCol = getEddyProWindDirColumn(data);
        const speedCol = getWindSpeedColumn(data);
        const fluxCol = fluxParam || 'co2_flux';

        const hasWind = dirCol && speedCol && data.length > 0;
        const hasFlux = dirCol && fluxCol && data.some(r => toNum(r[fluxCol]) != null);

        const existingRoses = container.querySelector('.roses-grid');
        if (existingRoses) existingRoses.remove();

        const rosesContainer = document.createElement('div');
        rosesContainer.className = 'roses-grid';
        rosesContainer.style.cssText = 'display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; margin-top: 20px;';

        if (hasWind) {
            const legLabels = SPEED_BINS.slice(0, -1).map((b, i) => `${b}-${SPEED_BINS[i + 1]} m/s`);
            legLabels.push(`>${SPEED_BINS[SPEED_BINS.length - 1]} m/s`);
            const { card, draw } = createRoseCard('Wind Rose', `wind-rose-${station.station_id}`, (c, w) => drawWindRose(c, w, data, dirCol, speedCol), { legend: legLabels });
            rosesContainer.appendChild(card);
            setTimeout(() => draw(), 100);
        }

        if (hasFlux) {
            const fluxConfig = station.parameters?.eddypro?.find(p => p.name === fluxCol);
            const fluxUnit = fluxConfig?.unit || '';
            const { card, draw } = createRoseCard('Flux Rose', `flux-rose-${station.station_id}`, (c, w) => drawFluxRose(c, w, data, dirCol, fluxCol, { fluxUnit, minN: FLUX_ROSE_MIN_N }));
            rosesContainer.appendChild(card);
            setTimeout(() => draw(), 100);
        }

        if (rosesContainer.children.length > 0) {
            container.appendChild(rosesContainer);
        }
    }

    global.WindRosePage = { render, drawWindRose, drawFluxRose };
})(typeof window !== 'undefined' ? window : this);

    function resolveHfNaParameterLabel(raw) {

        const lower = key.toLowerCase();
        for (const k of Object.keys(HF_PARAMETER_LABELS)) {
            if (k.toLowerCase() === lower) return HF_PARAMETER_LABELS[k];

    function getAvailabilityNumeric(stat) {
        let availability = stat.Collected_percent !== undefined && stat.Collected_percent !== null

        if (availability == null) return null;

    function availabilityTierClass(pct, thresholds) {
        if (!Number.isFinite(pct) || !thresholds) return '';

        if (s && pct >= s[0] && pct <= s[1]) return 'hf-availability--success';
        if (w && pct >= w[0] && pct <= w[1]) return 'hf-availability--warning';

    function fmtPct(v) {

    function buildAvailabilityTable(station) {

        const thresholds = typeof global.getAvailabilityThresholds === 'function'
            ? global.getAvailabilityThresholds()
            : { danger: [0, 59.99], warning: [60, 79.99], success: [80, 100] };

            if (va == null && vb == null) {

                const pb = String(b.Parameter || b.parameter || '');
                return pa.localeCompare(pb);

            if (va == null) return 1;
            if (vb == null) return -1;
            if (va !== vb) return va - vb;
            const pa = String(a.Parameter || a.parameter || '');
            const pb = String(b.Parameter || b.parameter || '');
