<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EddyEye Hub Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
/* Liquid Glass / Glassmorphism Styles for EddyEye Hub Dashboard */

/* Import Roboto Font */
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap');

/* CSS Variables for Theme */
:root {
    /* French Blue as main color */
    --color-french-blue: #0072BB;
    --color-french-blue-light: #3399DD;
    --color-french-blue-dark: #005588;
    --color-gold: #F5B700;
    --color-white: #ffffff;
    
    --glass-bg: rgba(0, 114, 187, 0.15);
    --glass-border: rgba(0, 114, 187, 0.3);
    --glass-shadow: 0 8px 32px 0 rgba(0, 85, 136, 0.3);
    --glass-blur: blur(10px);
    --primary-color: #0072BB;
    --primary-light: rgba(0, 114, 187, 0.3);
    --accent-color: #F5B700;
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.85);
    --success-color: #4CAF50;
    --warning-color: #F5B700;
    --danger-color: #ff6b6b;
    --gradient-1: linear-gradient(135deg, rgba(0, 114, 187, 0.5) 0%, rgba(51, 153, 221, 0.3) 100%);
    --gradient-2: linear-gradient(135deg, rgba(0, 114, 187, 0.15) 0%, rgba(0, 114, 187, 0.05) 100%);

    /* Overview (JS + tables): status & bars — single source for dashboard-overview.js */
    --overview-status-ok: rgba(76, 175, 80, 0.95);
    --overview-status-stale: rgba(244, 67, 54, 0.95);
    --overview-status-dot-muted: rgba(255, 255, 255, 0.3);
    --overview-label-on-range: rgba(255, 255, 255, 0.95);
    --overview-range-muted: rgba(255, 255, 255, 0.65);
    --overview-range-faint: rgba(255, 255, 255, 0.5);
    --overview-cell-danger-bg: rgba(244, 67, 54, 0.08);
    --overview-bar-ok: rgba(76, 175, 80, 0.9);
    --overview-bar-warn: rgba(255, 193, 7, 0.9);
    --overview-bar-bad: rgba(244, 67, 54, 0.9);
    --overview-progress-text-on-bar: rgba(255, 255, 255, 0.95);
    --overview-progress-text-beside: rgba(255, 255, 255, 0.85);
}

/* Base Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(145deg, #0a0a12 0%, #0d1220 20%, #131d33 40%, #1a2744 50%, #131d33 60%, #0d1220 80%, #0a0a12 100%);
    background-size: 400% 400%;
    background-attachment: fixed;
    min-height: 100vh;
    color: var(--text-primary);
    overflow-x: hidden;
    animation: bgPulse 20s ease-in-out infinite;
}

@keyframes bgPulse {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}

/* Glass Card Base */
.glass-card {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-radius: 16px;
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    padding: 20px;
    transition: all 0.3s ease;
}

.glass-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.5);
    border-color: rgba(255, 255, 255, 0.3);
}

/* Dashboard Container */
.dashboard-container {
    font-family: 'Roboto', sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 20px;
    gap: 20px;
}

/* Адаптивность контейнера дашборда */
@media (max-width: 1200px) {
    .dashboard-container {
        padding: 16px;
        gap: 16px;
    }
}

@media (max-width: 768px) {
    .dashboard-container {
        padding: 12px;
        gap: 12px;
    }
}

/* Topbar (3 zones: brand | stations | status) */
.topbar {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-radius: 20px;
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    padding: 0;
    overflow: hidden;
}
.topbar .topbar-inner {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0;
    padding: 16px 24px;
}
.topbar-zone {
    display: flex;
    align-items: center;
    padding: 0 12px;
}
.topbar-zone.topbar-brand {
    padding-left: 20px;
}
.topbar-zone.topbar-stations {
    flex: 1;
    justify-content: flex-start;
    min-width: 0;
}
.topbar-zone.topbar-status {
    padding-right: 20px;
    gap: 16px;
    flex-wrap: wrap;
}
.topbar-sep {
    width: 1px;
    height: 28px;
    background: rgba(255,255,255,0.15);
    flex-shrink: 0;
}
.brand-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0;
}
.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(76, 175, 80, 0.2);
    color: rgba(76, 175, 80, 0.95);
    font-size: 0.9rem;
    font-weight: 500;
}
.status-badge.status-warn { background: rgba(255, 193, 7, 0.2); color: rgba(255, 193, 7, 0.95); }
.status-badge.status-error { background: rgba(244, 67, 54, 0.2); color: rgba(244, 67, 54, 0.95); }
.last-updated-wrap {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.7);
}
.last-updated-value.last-updated-today { color: #4CAF50; font-weight: 500; }
.last-updated-value.last-updated-old { color: rgba(255,255,255,0.6); }
.topbar .tabs-nav {
    margin: 0;
    padding: 12px 24px 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
    gap: 4px;
}

/* Header */
.dashboard-header {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-radius: 20px;
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    padding: 20px 30px;
}

.header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
}

.dashboard-title {
    font-size: 2.5rem;
    font-weight: 700;
    color: #ffffff;
    position: relative;
    display: inline-block;
    animation: titleGradient 30s ease-in-out infinite;
}

@keyframes titleGradient {
    0%, 12% { color: #F7FAFF; }
    20%, 32% { color: #BEE3DB; }
    40%, 52% { color: #D1A0FF; }
    60%, 72% { color: #FFC09F; }
    80%, 92% { color: #FFF1B8; }
    100% { color: #F7FAFF; }
}

/* Station Navigation - segmented control */
.station-nav {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}
.station-nav.station-segmented {
    display: inline-flex;
    gap: 12px;
    overflow: visible;
}
.station-nav.station-segmented .station-btn {
    border-radius: 8px;
    padding: 10px 18px;
    min-height: 40px;
    font-size: 0.95rem;
    border: none;
    box-shadow: none;
}
.station-nav.station-segmented .station-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    transform: none;
}
.station-nav.station-segmented .station-btn.active {
    background: rgba(255, 255, 255, 0.25);
    font-weight: 600;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.3);
}

.station-btn {
    position: relative;
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 12px 24px;
    color: var(--text-primary);
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 16px 0 rgba(31, 38, 135, 0.2);
}

a.station-btn {
    text-decoration: none;
    display: inline-flex;
    align-items: center;
}

.station-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px 0 rgba(31, 38, 135, 0.4);
}
.station-nav.station-segmented .station-btn:hover { transform: none; }

.station-btn.active {
    background: var(--gradient-1);
    border-color: rgba(255, 255, 255, 0.4);
    box-shadow: 0 8px 24px 0 rgba(3, 60, 115, 0.5);
    font-weight: 700;
}

/* Station badge (warning) */
.station-btn-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    background: rgba(244, 67, 54, 0.95);
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
}

/* Station alert severity badge (top-right corner, like KPI cards) */
.station-alert-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 900;
    line-height: 1;
    z-index: 3;
    pointer-events: none;
}

.station-alert-badge--warning {
    background: rgba(42, 36, 10, 0.95);
    color: #f2cc60;
    border: 1.5px solid rgba(255, 193, 7, 0.5);
    box-shadow: 0 2px 6px rgba(255, 193, 7, 0.18);
}

.station-alert-badge--critical {
    background: rgba(42, 12, 10, 0.95);
    color: #ff8b8b;
    border: 1.5px solid rgba(244, 67, 54, 0.5);
    box-shadow: 0 2px 6px rgba(244, 67, 54, 0.18);
    animation: station-alert-pulse 2.5s ease-in-out infinite;
}

@keyframes station-alert-pulse {
    0%, 100% { box-shadow: 0 2px 6px rgba(244, 67, 54, 0.18), 0 0 0 0 rgba(244, 67, 54, 0.25); }
    50%      { box-shadow: 0 2px 6px rgba(244, 67, 54, 0.18), 0 0 0 4px rgba(244, 67, 54, 0); }
}

.station-btn[data-severity="warning"] {
    border-color: rgba(255, 193, 7, 0.35);
}

.station-btn[data-severity="critical"] {
    border-color: rgba(244, 67, 54, 0.35);
}

.station-nav.station-segmented .station-btn[data-severity="warning"] {
    box-shadow: 0 0 0 1px rgba(255, 193, 7, 0.15);
}

.station-nav.station-segmented .station-btn[data-severity="critical"] {
    box-shadow: 0 0 0 1px rgba(244, 67, 54, 0.15);
}

.station-nav.station-segmented .station-btn.active[data-severity="warning"] {
    box-shadow: 0 0 0 1px rgba(255, 193, 7, 0.25), 0 8px 24px 0 rgba(3, 60, 115, 0.5);
}

.station-nav.station-segmented .station-btn.active[data-severity="critical"] {
    box-shadow: 0 0 0 1px rgba(244, 67, 54, 0.25), 0 8px 24px 0 rgba(3, 60, 115, 0.5);
}

/* Main Content */
.dashboard-main {
    display: flex;
    flex: 1;
    width: 100%;
}

.dashboard-content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 100%;
}



.filter-group {
    margin-bottom: 20px;
}

.filter-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: var(--text-secondary);
}

.glass-select {
    width: 100%;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(5px);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    padding: 10px 15px;
    color: var(--text-primary);
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
}

.glass-select:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.3);
}

.glass-select:focus {
    outline: none;
    border-color: rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
}

.glass-select option {
    background: #667eea;
    color: var(--text-primary);
}

/* Custom Dropdown Styles */
.custom-dropdown {
    position: relative;
    width: 100%;
    margin-bottom: 0;
    z-index: 1000;
}

/* EddyPro Filters Panel */
.eddypro-filters-panel {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-radius: 12px;
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    padding: 16px 20px;
    margin-bottom: 20px;
}

.eddypro-filter-item {
    display: flex;
    align-items: center;
    gap: 10px;
}

.eddypro-filter-item label {
    color: rgba(255, 255, 255, 0.9);
    font-weight: 500;
    white-space: nowrap;
    font-size: 0.95rem;
}

@media (max-width: 768px) {
    .eddypro-filters-panel {
        flex-direction: column;
        align-items: stretch;
    }
    
    .eddypro-filter-item {
        flex-direction: column;
        align-items: stretch;
    }
    
    .eddypro-filter-item label {
        margin-bottom: 8px;
    }
    
    .eddypro-filter-item .custom-dropdown {
        width: 100%;
    }
}

.custom-dropdown-trigger {
    width: 100%;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text-primary);
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 16px 0 rgba(31, 38, 135, 0.2);
}

.custom-dropdown-trigger:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.4);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px 0 rgba(31, 38, 135, 0.3);
}

.custom-dropdown-trigger.active {
    background: rgba(255, 255, 255, 0.25);
    border-color: rgba(255, 255, 255, 0.5);
    box-shadow: 0 8px 24px 0 rgba(31, 38, 135, 0.4);
}

.custom-dropdown-trigger .dropdown-icon {
    transition: transform 0.3s ease;
    font-size: 0.9rem;
    opacity: 0.8;
}

.custom-dropdown-trigger.active .dropdown-icon {
    transform: rotate(180deg);
}

.custom-dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 12px;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.5);
    overflow: hidden;
    z-index: 10000;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: all 0.3s ease;
    max-height: 300px;
    overflow-y: auto;
}

.custom-dropdown-menu.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.custom-dropdown-item {
    padding: 12px 16px;
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.2s ease;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    font-weight: 400;
}

.custom-dropdown-item:last-child {
    border-bottom: none;
}

.custom-dropdown-item:hover {
    background: rgba(255, 255, 255, 0.2);
    padding-left: 20px;
}

.custom-dropdown-item.selected {
    background: var(--gradient-1);
    font-weight: 600;
    color: #ffffff;
}

.custom-dropdown-item.selected::after {
    content: '✓';
    float: right;
    font-weight: bold;
    color: rgba(255, 255, 255, 0.9);
}

/* Content Area */

.station-section {
    display: none;
}

.station-section.active {
    display: block;
}

/* Gauge Container */
.gauges-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.gauge-card {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-radius: 16px;
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    padding: 20px;
    text-align: center;
    transition: all 0.3s ease;
}

.gauge-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.5);
}

.gauge-title {
    font-size: 0.9rem;
    font-weight: 500;
    margin-bottom: 15px;
    color: var(--text-secondary);
}

.gauge-canvas-container {
    position: relative;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Chart Container */
.chart-container {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-radius: 16px;
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    padding: 20px;
    margin-bottom: 20px;
}

.chart-title {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 15px;
    color: var(--text-primary);
}

.chart-wrapper {
    position: relative;
    width: 100%;
    min-height: 400px;
}

/* Loading Spinner */
.loading-message {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 400px;
    color: var(--text-primary);
}

.spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255, 255, 255, 0.2);
    border-top-color: var(--text-primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Footer */
.dashboard-footer {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-radius: 16px;
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    padding: 15px 30px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 0.9rem;
}

/* Plotly Chart Customization */
.plotly {
    background: transparent !important;
}

.plotly .modebar {
    background: rgba(255, 255, 255, 0.1) !important;
    backdrop-filter: blur(10px);
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.plotly .modebar-btn {
    color: var(--text-primary) !important;
}

.plotly .modebar-btn:hover {
    background: rgba(255, 255, 255, 0.2) !important;
}

/* ApexCharts Customization */
.apexcharts-canvas {
    background: transparent !important;
}

.apexcharts-tooltip {
    background: var(--glass-bg) !important;
    backdrop-filter: var(--glass-blur) !important;
    border: 1px solid var(--glass-border) !important;
    border-radius: 8px !important;
    color: var(--text-primary) !important;
    box-shadow: var(--glass-shadow) !important;
}

.apexcharts-menu {
    background: var(--glass-bg) !important;
    backdrop-filter: var(--glass-blur) !important;
    border: 1px solid var(--glass-border) !important;
    border-radius: 8px !important;
}

.apexcharts-menu-item {
    color: var(--text-primary) !important;
}

.apexcharts-menu-item:hover {
    background: rgba(255, 255, 255, 0.1) !important;
}

/* Responsive Design */
@media (max-width: 1200px) {
    .dashboard-header {
        padding: 16px 20px;
    }
    
    .header-content {
        flex-direction: column;
        gap: 16px;
    }
    
    .dashboard-title {
        font-size: 2rem;
    }
}

@media (max-width: 768px) {
    .dashboard-container {
        padding: 10px;
    }
    
    .dashboard-header {
        padding: 12px 16px;
    }
    
    .dashboard-title {
        font-size: 1.6rem;
    }
    
    .station-nav {
        flex-direction: column;
        gap: 10px;
    }
    
    .station-btn {
        width: 100%;
        padding: 10px 20px;
        font-size: 0.9rem;
    }
    
    .gauges-container {
        grid-template-columns: 1fr;
    }
    
    .dashboard-main {
        grid-template-columns: 1fr;
    }
    
    .tabs-container {
        padding: 16px;
    }
    
    .tabs-nav {
        flex-wrap: wrap;
        gap: 8px;
    }
    
    .tab-btn {
        padding: 10px 16px;
        font-size: 0.9rem;
    }
}

/* Tabs Styling */
.tabs-container {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-radius: 20px;
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    padding: 20px;
    margin-bottom: 20px;
}

.tabs-nav {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 10px;
}

.tab-btn {
    background: transparent;
    border: none;
    padding: 12px 24px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    border-radius: 8px 8px 0 0;
    transition: all 0.3s ease;
    position: relative;
}

.tab-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-primary);
}

.tab-btn.active {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.15);
    font-weight: 600;
}

.tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--primary-color);
    border-radius: 2px 2px 0 0;
}

.tab-content {
    display: none;
    width: 100%;
    max-width: 100%;
}

.tab-content.active {
    display: block;
    animation: fadeIn 0.3s ease-in;
    width: 100%;
    max-width: 100%;
}

/* Overview Cards */
.overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

/* Raw Flux Section */
.raw-flux-section {
    margin-bottom: 40px;
    width: 100%;
    max-width: 100%;
}

.raw-flux-section-title {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 30px;
    text-align: center;
}

/* Адаптивность заголовков */
@media (max-width: 1200px) {
    .raw-flux-section-title {
        font-size: 1.5rem;
        margin-bottom: 24px;
    }
}

@media (max-width: 768px) {
    .raw-flux-section-title {
        font-size: 1.3rem;
        margin-bottom: 20px;
    }
}

/* Raw Flux Grid - адаптивная сетка */
.raw-flux-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    margin-bottom: 30px;
    width: 100%;
    max-width: 100%;
    min-width: 0;
}

/* Для HF карточек - компактно в одну строку на всю ширину */
.hf-compact-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 12px;
    width: 100%;
    padding-bottom: 10px;
}

/* Большие мониторы (>1600px) - 8 колонок */
@media (min-width: 1601px) {
    .hf-compact-grid {
        grid-template-columns: repeat(8, 1fr);
        gap: 14px;
    }
}

/* Средние мониторы и ноутбуки 13" (1200-1600px) - 4 колонки */
@media (max-width: 1600px) and (min-width: 1201px) {
    .hf-compact-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }
}

/* Планшеты и маленькие ноутбуки (768-1200px) - 2 колонки */
@media (max-width: 1200px) and (min-width: 769px) {
    .hf-compact-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }
}

/* Телефоны (<768px) - 1 колонка */
@media (max-width: 768px) {
    .hf-compact-grid {
        grid-template-columns: 1fr;
        gap: 12px;
    }
}

.hf-compact-grid .raw-flux-card {
    width: 100%;
    min-width: 0;
    max-width: none;
}

/* Адаптивность для обычных карточек (EddyPro Data Availability) */
@media (max-width: 1600px) and (min-width: 1201px) {
    .raw-flux-grid:not(.hf-compact-grid) {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }
}

@media (max-width: 1200px) and (min-width: 769px) {
    .raw-flux-grid:not(.hf-compact-grid) {
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }
}

@media (max-width: 768px) {
    .raw-flux-grid:not(.hf-compact-grid) {
        grid-template-columns: 1fr;
        gap: 16px;
    }
}

/* Raw Flux Card */
.raw-flux-card {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-radius: 20px;
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    padding: 30px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    min-height: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-width: 0;
}

/* Адаптивность карточек Raw Flux */
@media (max-width: 1200px) and (min-width: 769px) {
    .raw-flux-card:not(.hf-compact-card) {
        padding: 24px;
        min-height: 300px;
    }
    
    .raw-flux-header {
        font-size: 1.2rem;
    }
}

@media (max-width: 768px) {
    .raw-flux-card:not(.hf-compact-card) {
        padding: 12px;
        min-height: auto;
    }
    
    .raw-flux-header {
        font-size: 0.95rem;
        margin-bottom: 12px;
        line-height: 1.2;
    }
    
    .raw-flux-charts-container {
        gap: 4px;
        padding: 8px 0;
        justify-content: space-between;
    }
    
    .raw-flux-single-chart {
        flex: 1;
        min-width: 0;
        gap: 4px;
        max-width: calc(33.333% - 3px);
    }
    
    .raw-flux-single-chart canvas {
        width: 65px !important;
        height: 65px !important;
        max-width: 100%;
    }
    
    .raw-flux-chart-label {
        font-size: 0.7rem;
        line-height: 1.1;
        word-break: break-word;
        text-align: center;
    }
}

@media (max-width: 480px) {
    .raw-flux-card:not(.hf-compact-card) {
        padding: 10px;
    }
    
    .raw-flux-header {
        font-size: 0.85rem;
        margin-bottom: 10px;
    }
    
    .raw-flux-charts-container {
        gap: 3px;
        padding: 6px 0;
    }
    
    .raw-flux-single-chart {
        gap: 3px;
        max-width: calc(33.333% - 2px);
    }
    
    .raw-flux-single-chart canvas {
        width: 55px !important;
        height: 55px !important;
    }
    
    .raw-flux-chart-label {
        font-size: 0.65rem;
    }
}

.raw-flux-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.5);
    border-color: rgba(255, 255, 255, 0.3);
}

.raw-flux-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--gradient-1);
}

/* Красная зона: рамка и восклицательный знак */
.raw-flux-card.danger-zone,
.gauge-card.danger-zone {
    border: 2px solid rgba(244, 67, 54, 0.9);
    box-shadow: 0 0 0 1px rgba(244, 67, 54, 0.3), 0 8px 32px 0 rgba(244, 67, 54, 0.15);
}

.danger-exclamation {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 28px;
    height: 28px;
    background: #e53935;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
    box-shadow: 0 2px 8px rgba(229, 57, 53, 0.5);
    z-index: 2;
}

.raw-flux-card,
.gauge-card {
    position: relative;
}

.station-btn .danger-exclamation-inline {
    position: absolute;
    top: 4px;
    right: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    background: #e53935;
    border-radius: 50%;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    box-shadow: 0 1px 4px rgba(229, 57, 53, 0.5);
}

/* Восклицательный знак в ячейке таблицы Eddy covariance (Overview) — заметнее при быстром просмотре */
.eddy-table-danger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    background: #e53935;
    border-radius: 50%;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    box-shadow: 0 2px 8px rgba(229, 57, 53, 0.7), 0 0 0 2px rgba(255, 255, 255, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.5);
    flex-shrink: 0;
}

/* Увеличенный отступ сверху у заголовка секции Overview (кроме первой) */
.raw-flux-section.overview-section-block:not(:first-child) {
    margin-top: 2.5rem;
}
.raw-flux-section.overview-section-block .raw-flux-section-title {
    padding-top: 0.35em;
}

/* Чередование строк в таблицах Overview */
.overview-table-row-alt {
    background: rgba(255, 255, 255, 0.04);
}

/* ===== Overview: Карточный вид (основной для всех экранов) ===== */

/* Таблицы скрыты — используем только карточки (Overview); вкладка HF показывает NA-таблицу */
.overview-table-wrap {
    display: none;
}

.hf-tab-na-section .hf-na-table-wrap.overview-table-wrap {
    display: block !important;
    width: 100%;
    overflow-x: auto;
}

.hf-page-root {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    box-sizing: border-box;
}

.hf-tab-na-section.raw-flux-section.overview-section-block {
    margin-top: 0;
    margin-bottom: 0;
    padding: 14px 16px 18px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(12, 18, 34, 0.72);
}

.hf-tab-na-section .raw-flux-section-title {
    margin-bottom: 12px;
}

.hf-na-availability-table.hf-na-availability-table {
    width: 100%;
    border-collapse: collapse;
}

.hf-na-availability-table .hf-availability-value {
    font-weight: 600;
}

.hf-na-availability-table .hf-availability--danger {
    color: #ef5350;
}

.hf-na-availability-table .hf-availability--warning {
    color: #ffca28;
}

.hf-na-availability-table .hf-availability--success {
    color: #66bb6a;
}

/* Контейнер карточек — всегда видим */
.overview-cards-container {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 16px;
    width: 100%;
}

/* Карточка периода */
.overview-card-item {
    flex: 1 1 0;
    min-width: 0;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.10);
    overflow: hidden;
    padding: 22px 24px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.overview-card-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    border-color: rgba(255, 255, 255, 0.18);
}

/* Шапка карточки */
.overview-card-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 10px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.overview-card-header .period-name {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.01em;
}

/* Восклицательный знак — badge при устаревшем периоде */
.overview-card-warn-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(244, 67, 54, 0.9);
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    flex-shrink: 0;
    box-shadow: 0 0 10px rgba(244, 67, 54, 0.5);
    animation: pulse-warn 2s ease-in-out infinite;
    cursor: help;
}

@keyframes pulse-warn {
    0%, 100% { box-shadow: 0 0 8px rgba(244, 67, 54, 0.4); }
    50% { box-shadow: 0 0 16px rgba(244, 67, 54, 0.7); }
}

/* Карточка с устаревшим периодом */
.overview-card-outdated {
    border-color: rgba(244, 67, 54, 0.35);
    background: rgba(244, 67, 54, 0.04);
}

.overview-card-outdated:hover {
    border-color: rgba(244, 67, 54, 0.5);
}

/* Сетка параметров внутри карточки */
.overview-card-params {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px 16px;
}

/* Один параметр */
.overview-card-param {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
}

.overview-card-param-label {
    font-size: 11.5px;
    color: rgba(255, 255, 255, 0.55);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    text-align: center;
}

/* Обёртка бара с иконкой */
.overview-card-bar-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
}

/* Прогресс-бар */
.overview-card-param-bar {
    flex: 1;
    height: 24px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
}

.overview-card-param-fill {
    height: 100%;
    border-radius: 12px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.overview-card-param-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.95);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    pointer-events: none;
    letter-spacing: 0.03em;
}

/* Восклицательный знак при низкой доступности параметра */
.overview-card-danger-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(244, 67, 54, 0.85);
    color: #fff;
    font-weight: 800;
    font-size: 12px;
    flex-shrink: 0;
    cursor: help;
    box-shadow: 0 0 6px rgba(244, 67, 54, 0.4);
}

/* Параметр в опасной зоне */
.overview-card-param-danger .overview-card-param-label {
    color: rgba(244, 67, 54, 0.8);
}

/* Интерактивная подсказка HF (Missing / Invalid / Filtered) */
.overview-card-tooltip {
    display: none;
    position: absolute;
    left: 50%;
    bottom: calc(100% + 8px);
    transform: translateX(-50%);
    z-index: 100;
    padding: 10px 14px;
    background: rgba(20, 25, 35, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    font-size: 12px;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.9);
    font-family: Roboto, sans-serif;
    white-space: nowrap;
    pointer-events: none;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.overview-card-tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: rgba(20, 25, 35, 0.97);
}

.overview-card-tooltip b {
    color: rgba(255, 255, 255, 1);
    font-weight: 700;
}

/* ===== Focus Overview: overview layout ===== */
.overview-focus-root {
    width: 100%;
}

/* Overview content width: use almost full tab area on large screens (was 1560px — too narrow on 27") */
.overview-focus-inner {
    width: 100%;
    max-width: min(2400px, 100%);
    margin-left: auto;
    margin-right: auto;
    box-sizing: border-box;
}

/* Overview tables/cards: semantic tokens (used from dashboard-overview.js) */
.overview-period-wrap {
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.overview-period-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
}

.overview-period-dot--ok { background: var(--overview-status-ok); }
.overview-period-dot--stale { background: var(--overview-status-stale); }
.overview-period-dot--muted { background: var(--overview-status-dot-muted); }

.overview-period-label {
    font-weight: 600;
}

.overview-period-label--stale { color: var(--overview-status-stale); }
.overview-period-label--ok { color: var(--overview-status-ok); }
.overview-period-label--neutral { color: var(--overview-label-on-range); }

.overview-period-range {
    font-size: 12px;
    margin-top: 2px;
}

.overview-period-range--stale { color: var(--overview-status-stale); font-weight: 600; }
.overview-period-range--ok { color: var(--overview-status-ok); font-weight: 600; }
.overview-period-range--soft { color: var(--overview-range-muted); }
.overview-period-range--faint { color: var(--overview-range-faint); }

.overview-card-period-name--ok { color: var(--overview-status-ok); }
.overview-card-period-name--stale { color: var(--overview-status-stale); }

.overview-card-status-line--ok { color: var(--overview-status-ok); }
.overview-card-status-line--stale { color: var(--overview-status-stale); }

.overview-table-td-padded {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    vertical-align: middle;
}

.overview-table-cell--danger-bg {
    background: var(--overview-cell-danger-bg);
}

.overview-progress-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 120px;
}

.overview-progress-track {
    flex: 1;
    height: 22px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 11px;
    overflow: hidden;
    position: relative;
    min-width: 100px;
}

.overview-progress-fill {
    height: 100%;
    transition: width 0.3s ease;
    border-radius: 11px;
    position: relative;
}

.overview-progress-fill--ok { background: var(--overview-bar-ok); }
.overview-progress-fill--warn { background: var(--overview-bar-warn); }
.overview-progress-fill--bad { background: var(--overview-bar-bad); }

.overview-progress-label {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    font-size: 11px;
    font-weight: 600;
    font-family: 'Roboto', sans-serif;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
}

.overview-progress-label--center {
    justify-content: center;
    color: var(--overview-progress-text-on-bar);
    padding-left: 0;
}

.overview-progress-label--start {
    justify-content: flex-start;
    color: var(--overview-progress-text-beside);
    padding-left: 6px;
}

.overview-card-status-line {
    font-size: 12px;
    margin-top: 2px;
    flex-basis: 100%;
    font-weight: 600;
}

.overview-card-param-fill--ok { background: var(--overview-bar-ok); }
.overview-card-param-fill--warn { background: var(--overview-bar-warn); }
.overview-card-param-fill--bad { background: var(--overview-bar-bad); }

.overview-focus-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
}

.overview-focus-heading {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px 14px;
}

.overview-focus-name {
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #fff;
    text-shadow: 0 0 24px rgba(209, 160, 255, 0.35);
}

.overview-focus-sub {
    font-size: 0.95rem;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.55);
    text-transform: uppercase;
    letter-spacing: 0.12em;
}

.overview-focus-root.overview-mode-glass .overview-focus-toolbar {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(209, 160, 255, 0.25);
    margin-bottom: 10px;
    padding: 8px 12px;
    border-radius: 12px;
    gap: 10px;
}

.overview-focus-root.overview-mode-glass .overview-focus-heading {
    gap: 6px 10px;
}

.overview-focus-root.overview-mode-glass .overview-focus-name {
    font-size: 1.1rem;
}

.overview-focus-root.overview-mode-glass .overview-focus-sub {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
}

.overview-focus-body {
    min-width: 0;
}

/* Glass: полный передел — одна колонка секций; каждая метрика = маленькая стеклянная плитка */
.overview-focus-root.overview-mode-glass .overview-focus-body {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 12px 14px 16px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background:
        radial-gradient(ellipse 90% 60% at 15% 10%, rgba(209, 160, 255, 0.22) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 5%, rgba(0, 210, 255, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse 50% 40% at 50% 100%, rgba(255, 180, 100, 0.08) 0%, transparent 45%),
        linear-gradient(168deg, #121528 0%, #1a1d33 42%, #0e1324 100%);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 12px 28px rgba(0, 0, 0, 0.38);
}

.overview-focus-root.overview-mode-glass .overview-focus-body > .raw-flux-section.overview-section-block {
    margin-bottom: 0;
}

.overview-focus-root.overview-mode-glass .raw-flux-section.overview-section-block:not(:first-child) {
    margin-top: 0 !important;
}

.overview-focus-root.overview-mode-glass .raw-flux-section.overview-section-block {
    margin-top: 0 !important;

    padding: 10px 12px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(12, 18, 34, 0.72);
}

.updated-section-title {
    font-size: 12px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: rgba(225, 232, 250, 0.9);
    margin-bottom: 10px;
    font-weight: 800;
}

.updated-stat {
    border-radius: 12px;
    padding: 10px 12px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(12, 18, 34, 0.72);
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.updated-stat-label {
    font-size: 10px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: rgba(221, 229, 246, 0.72);
    font-weight: 800;
}

.updated-stat-value {
    font-size: 18px;
    font-weight: 950;
    color: rgba(232, 236, 246, 0.96);
}

.updated-stat-sub {
    font-size: 10px;
    color: rgba(221, 229, 246, 0.7);
    letter-spacing: 0.02em;
}

.updated-summary-value {
    font-size: 16px;
    font-weight: 950;
    color: rgba(232, 236, 246, 0.96);
}

.updated-issues-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.updated-issue {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 18px;
    padding: 6px 8px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(0, 0, 0, 0.12);
}

.updated-issue-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    flex: 0 0 auto;
}

.updated-issue-text {
    font-size: 11px;
    color: rgba(232, 236, 246, 0.92);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.updated-chart {
    min-height: 190px;
}

.updated-heatmap {
    max-height: 240px;
    overflow: auto;
    padding-right: 4px;
}

.updated-heat-day {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
}

.updated-heat-day-label {
    width: 60px;
    font-size: 10px;
    font-weight: 800;
    color: rgba(221, 229, 246, 0.66);
    letter-spacing: 0.02em;
}

.updated-heat-bins {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 2px;
}

.updated-heat-cell {
    aspect-ratio: 1 / 1;
    border-radius: 2px;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.updated-events-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.updated-event {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(0, 0, 0, 0.12);
}

.updated-event-sev {
    width: 56px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 900;
    color: rgba(232, 236, 246, 0.9);
}

.updated-event-text {
    font-size: 11px;
    color: rgba(232, 236, 246, 0.92);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.updated-reco-title {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: rgba(225, 232, 250, 0.9);
    font-weight: 800;
}

.updated-reco-text {
    margin-top: 6px;
    font-size: 11px;
    line-height: 1.35;
    color: rgba(221, 229, 246, 0.72);
}

/* Updated mode: KPI snapshot + issue cards (data-display patterns) */
.overview-focus-root.overview-mode-focus .updated-row-1 {
    grid-template-columns: 1.2fr 1.2fr 0.9fr;
    gap: 16px;
    margin-bottom: 18px;
    align-items: stretch;
}

.overview-focus-root.overview-mode-focus .updated-row-1 > .updated-kpi-summary-card.updated-stat-kpi {
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
}

.overview-focus-root.overview-mode-focus .updated-kpi-alerts-card .updated-kpi-summary-alerts {
    flex: 0 1 auto;
    align-self: stretch;
    min-height: 0;
    width: 100%;
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-card.updated-stat-kpi:not(.updated-kpi-alerts-card) .updated-kpi-summary-split.updated-kpi-avail-split {
    flex: 1 1 auto;
    min-height: 0;
}

.overview-focus-root.overview-mode-focus .updated-row-2.updated-row-issues-full {
    margin-bottom: 22px;
}

/* Updated mode: KPI = premium summary cards (editorial, not tabular) */
.overview-focus-root.overview-mode-focus .updated-kpi-summary-card.updated-stat-kpi {
    position: relative;
    overflow: visible;
    min-height: 0;
    padding: 22px 24px 20px;
    border-radius: 16px;
    border: 1px solid rgba(140, 170, 220, 0.14);
    background: rgba(10, 20, 42, 0.92);
    box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.06) inset,
        0 12px 32px rgba(0, 0, 0, 0.18);
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-card.updated-stat-kpi::before {
    display: none;
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-card .updated-stat-footnote {
    font-size: 11px;
    line-height: 1.35;
    color: rgba(190, 208, 240, 0.62);
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-card-title {
    font-size: 0.8rem;
    line-height: 1.25;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(231, 236, 255, 0.94);
    font-weight: 750;
    margin: 0 0 18px;
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-split.updated-kpi-avail-split {
    gap: 0 20px;
    align-items: stretch;
    margin-top: 0;
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-col {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
    min-height: 100%;
    padding: 2px 0 0;
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-vrule.updated-kpi-avail-divider {
    display: block;
    width: 1px;
    min-height: 100%;
    margin: 0 2px;
    margin-top: 0;
    align-self: stretch;
    background: linear-gradient(
        180deg,
        transparent 0%,
        rgba(148, 163, 184, 0.2) 15%,
        rgba(148, 163, 184, 0.2) 85%,
        transparent 100%
    );
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-subtitle {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(231, 236, 255, 0.82);
    font-weight: 700;
    margin: 0;
    padding: 0;
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-lines {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-line {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    padding: 0;
    margin: 0;
    border: none;
    background: none;
    box-shadow: none;
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-line + .updated-kpi-summary-line {
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-label {
    font-size: 0.8125rem;
    font-weight: 500;
    color: rgba(231, 236, 255, 0.82);
    line-height: 1.35;
    flex-shrink: 0;
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-value {
    font-size: 0.9375rem;
    font-weight: 750;
    letter-spacing: 0.01em;
    color: rgba(244, 248, 255, 0.96);
    text-align: right;
    font-variant-numeric: tabular-nums;
    line-height: 1.3;
    min-width: 0;
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-value--multiline {
    font-size: 0.8125rem;
    font-weight: 650;
    line-height: 1.4;
    white-space: normal;
    max-width: 12.5rem;
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-value .updated-kpi-cov-ok,
.overview-focus-root.overview-mode-focus .updated-kpi-summary-value .updated-kpi-cov-warn,
.overview-focus-root.overview-mode-focus .updated-kpi-summary-value .updated-kpi-cov-bad,
.overview-focus-root.overview-mode-focus .updated-kpi-summary-value .updated-kpi-cov-na {
    font-size: inherit;
    font-weight: inherit;
}

.overview-focus-root.overview-mode-focus .updated-kpi-coverage-card,
.overview-focus-root.overview-mode-focus .updated-kpi-freshness-card {
    min-height: 0;
}

.overview-focus-root.overview-mode-focus .updated-kpi-alerts-card.updated-kpi-summary-card {
    display: flex;
    flex-direction: column;
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-alerts-caption {
    font-size: 0.8125rem;
    font-weight: 500;
    color: rgba(231, 236, 255, 0.82);
    letter-spacing: 0.04em;
}

.overview-focus-root.overview-mode-focus .updated-kpi-alerts-card .updated-kpi-alerts-total {
    margin: 0;
    font-size: 2.25rem;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: rgba(248, 250, 255, 0.98);
}

.overview-focus-root.overview-mode-focus .updated-kpi-freshness-card .updated-delta {
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0;
}

/* KPI card severity borders */
.overview-focus-root.overview-mode-focus .updated-kpi-summary-card[data-severity="warning"] {
    border-color: rgba(255, 193, 7, 0.45);
    box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.06) inset,
        0 0 0 1px rgba(255, 193, 7, 0.12),
        0 0 24px rgba(255, 193, 7, 0.07),
        0 12px 32px rgba(0, 0, 0, 0.18);
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-card[data-severity="critical"] {
    border-color: rgba(244, 67, 54, 0.45);
    box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.06) inset,
        0 0 0 1px rgba(244, 67, 54, 0.12),
        0 0 24px rgba(244, 67, 54, 0.07),
        0 12px 32px rgba(0, 0, 0, 0.18);
}

/* Alert exclamation badge (top-right corner) */
.kpi-alert-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    z-index: 3;
    cursor: default;
    line-height: 1;
}

.kpi-alert-badge--warning {
    background: rgba(42, 36, 10, 0.95);
    color: #f2cc60;
    border: 1.5px solid rgba(255, 193, 7, 0.5);
    box-shadow: 0 2px 8px rgba(255, 193, 7, 0.2);
}

.kpi-alert-badge--critical {
    background: rgba(42, 12, 10, 0.95);
    color: #ff8b8b;
    border: 1.5px solid rgba(244, 67, 54, 0.5);
    box-shadow: 0 2px 8px rgba(244, 67, 54, 0.2);
    animation: kpi-alert-pulse 2s ease-in-out infinite;
}

@keyframes kpi-alert-pulse {
    0%, 100% { box-shadow: 0 2px 8px rgba(244, 67, 54, 0.2), 0 0 0 0 rgba(244, 67, 54, 0.3); }
    50%      { box-shadow: 0 2px 8px rgba(244, 67, 54, 0.2), 0 0 0 5px rgba(244, 67, 54, 0); }
}

/* Alerts card: show ~2 rows; rest scrolls (wheel) */
.overview-focus-root.overview-mode-focus .updated-kpi-summary-alerts {
    --kpi-alert-row-estimate: 4.5rem;
    --kpi-alert-row-gap: 6px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    gap: var(--kpi-alert-row-gap);
    margin-top: 4px;
    min-height: 72px;
    max-height: calc(2 * var(--kpi-alert-row-estimate) + var(--kpi-alert-row-gap));
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-gutter: stable;
}

.kpi-alert-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 0.75rem;
    line-height: 1.35;
    flex-shrink: 0;
}

.kpi-alert-row--critical {
    background: rgba(244, 67, 54, 0.07);
    border-left: 3px solid rgba(244, 67, 54, 0.6);
}

.kpi-alert-row--warning {
    background: rgba(255, 193, 7, 0.07);
    border-left: 3px solid rgba(255, 193, 7, 0.5);
}

.kpi-alert-severity {
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 0.625rem;
}

.kpi-alert-row--critical .kpi-alert-severity { color: #ff8b8b; }
.kpi-alert-row--warning .kpi-alert-severity  { color: #f2cc60; }

.kpi-alert-reason {
    color: rgba(231, 236, 255, 0.88);
    font-weight: 600;
}

.kpi-alert-param {
    color: rgba(200, 210, 235, 0.55);
    font-size: 0.6875rem;
}

.kpi-alert-param .kpi-alert-period-em {
    font-weight: 700;
    color: rgba(228, 234, 255, 0.95);
}

.kpi-alert-drivers-wrap {
    display: inline;
}

.kpi-alert-readmore {
    display: inline;
    margin-left: 4px;
    padding: 0;
    border: none;
    background: none;
    color: rgba(140, 180, 255, 0.92);
    font-size: inherit;
    font-family: inherit;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
}

.kpi-alert-readmore:hover {
    color: rgba(180, 210, 255, 1);
}

/* Alert count badge next to Alerts title */
.kpi-alerts-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    font-size: 0.65rem;
    font-weight: 800;
    margin-left: 6px;
    vertical-align: middle;
}

.kpi-alerts-count--critical {
    background: rgba(244, 67, 54, 0.15);
    color: #ff8b8b;
    border: 1px solid rgba(244, 67, 54, 0.3);
}

.kpi-alerts-count--warning {
    background: rgba(255, 193, 7, 0.15);
    color: #f2cc60;
    border: 1px solid rgba(255, 193, 7, 0.3);
}

.overview-focus-root.overview-mode-focus .updated-kpi-summary-split > .updated-kpi-avail-section:last-child {
    border-left: none;
    padding-left: 0;
}

/* Issues: компактная очередь */
.overview-focus-root.overview-mode-focus .updated-issues-section {
    padding: 12px 14px;
    border-radius: 14px;
    margin-bottom: 0;
}

.overview-focus-root.overview-mode-focus .updated-issue-card {
    padding: 12px 14px;
    min-height: 0;
    border-radius: 12px;
    border: 1px solid rgba(120, 160, 220, 0.14);
    background: rgba(20, 33, 63, 0.72);
}

.overview-focus-root.overview-mode-focus .updated-issue-card + .updated-issue-card {
    margin-top: 8px;
}

.overview-focus-root.overview-mode-focus .updated-issue-card-title {
    font-size: 14px;
    margin-bottom: 6px;
    font-weight: 700;
}

.overview-focus-root.overview-mode-focus .updated-issue-body {
    font-size: 12px;
    line-height: 1.4;
    color: rgba(205, 220, 245, 0.72);
    margin: 0;
}

.overview-focus-root.overview-mode-focus .updated-issues-show-all {
    margin-top: 8px;
}

/* Нижний слой: тише таблицы и cursor-панели */
.overview-focus-root.overview-mode-focus .overview-focus-body .raw-flux-section.overview-section-block {
    padding: 10px 12px 8px;
    border-radius: 14px;
    border: 1px solid rgba(120, 160, 220, 0.1);
    background: linear-gradient(180deg, rgba(8, 20, 42, 0.88), rgba(6, 16, 35, 0.92));
    margin-bottom: 12px;
}

.overview-focus-root.overview-mode-focus .overview-focus-body .raw-flux-section.overview-section-block + .raw-flux-section.overview-section-block {
    margin-top: 10px;
}

.overview-focus-root.overview-mode-focus .overview-focus-body .raw-flux-section-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(220, 232, 255, 0.86);
    margin-bottom: 8px;
    padding-bottom: 6px;
}

.overview-focus-root.overview-mode-focus .overview-focus-body .cursor-summary {
    gap: 8px;
}

.overview-focus-root.overview-mode-focus .overview-focus-body .cursor-worst5,
.overview-focus-root.overview-mode-focus .overview-focus-body .cursor-period-worst {
    border: 1px solid rgba(120, 160, 220, 0.08);
    border-radius: 10px;
    background: rgba(10, 20, 42, 0.52);
    min-height: 0;
}

.overview-focus-root.overview-mode-focus .overview-focus-body .cursor-summary-title {
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: none;
    font-weight: 800;
    color: rgba(225, 232, 250, 0.88);
    padding: 8px 10px 6px;
    margin: 0;
}

.overview-focus-root.overview-mode-focus .overview-focus-body .cursor-worst5-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(3.25rem, max-content);
    gap: 8px 12px;
    align-items: center;
    min-height: 28px;
    padding: 6px 10px;
    font-size: 12px;
    border-top: 1px solid rgba(120, 160, 220, 0.07);
}

.overview-focus-root.overview-mode-focus .overview-focus-body .cursor-worst5-label {
    font-size: 12px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.overview-focus-root.overview-mode-focus .overview-focus-body .cursor-worst5-value {
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    justify-self: end;
    text-align: right;
}

.overview-focus-root.overview-mode-focus .overview-focus-body .overview-table {
    border: 1px solid rgba(120, 160, 220, 0.08);
    border-radius: 10px;
    overflow: hidden;
    background: rgba(10, 20, 42, 0.52);
    font-size: 12px;
}

.overview-focus-root.overview-mode-focus .overview-focus-body .overview-table th,
.overview-focus-root.overview-mode-focus .overview-focus-body .overview-table td {
    padding: 6px 10px;
    border-color: rgba(120, 160, 220, 0.07);
    color: rgba(224, 234, 252, 0.8);
}

/* Data availability KPI: opens modal with EddyPro / LF split */
.overview-focus-root.overview-mode-focus .updated-kpi-data-avail-card {
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.overview-focus-root.overview-mode-focus .updated-kpi-data-avail-card:hover {
    border-color: rgba(148, 163, 184, 0.32);
    box-shadow: 0 0 0 1px rgba(106, 166, 255, 0.12);
}

.overview-focus-root.overview-mode-focus .updated-kpi-data-avail-card:focus {
    outline: none;
    box-shadow: 0 0 0 2px rgba(106, 166, 255, 0.45);
}

.overview-focus-root.overview-mode-focus .updated-kpi-data-avail-card:focus:not(:focus-visible) {
    box-shadow: none;
}

.overview-focus-root.overview-mode-focus .updated-kpi-data-avail-card:focus-visible {
    box-shadow: 0 0 0 2px rgba(106, 166, 255, 0.45);
}

.updated-avail-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10050;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    box-sizing: border-box;
}

.updated-avail-modal.is-open {
    display: flex;
}

.updated-avail-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(4, 8, 18, 0.72);
    backdrop-filter: blur(6px);
}

.updated-avail-modal-dialog {
    position: relative;
    z-index: 1;
    width: min(520px, 100%);
    max-height: min(88vh, 640px);
    overflow: auto;
    border-radius: 16px;
    padding: 20px 22px 18px;
    border: 1px solid rgba(148, 163, 184, 0.22);
    background: linear-gradient(165deg, rgba(22, 32, 58, 0.97), rgba(12, 18, 34, 0.98));
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
}

.updated-avail-modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 10px;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    color: rgba(221, 229, 246, 0.85);
    background: rgba(255, 255, 255, 0.06);
}

.updated-avail-modal-close:hover {
    background: rgba(255, 255, 255, 0.1);
    color: rgba(242, 246, 255, 0.98);
}

.updated-avail-modal-title {
    margin: 0 36px 8px 0;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: rgba(232, 236, 246, 0.96);
}

.updated-avail-modal-lead {
    margin: 0 0 14px;
    font-size: 11px;
    line-height: 1.45;
    color: rgba(147, 164, 194, 0.95);
}

.updated-avail-modal-lead code {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.25);
    color: rgba(200, 210, 235, 0.95);
}

.updated-kpi-avail-split--modal {
    margin-top: 4px;
    padding: 12px 10px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.06);

/* ===== Ultrawide мониторы (>2560px) ===== */
@media (min-width: 2561px) {
    .overview-cards-container {

        padding: 28px 32px;

    .overview-card-param-text {
        font-size: 12px;
    }

/* ===== Большие мониторы (1920-2560px) ===== */
@media (min-width: 1921px) and (max-width: 2560px) {
    .overview-cards-container {
        gap: 20px;
    }
    .overview-card-item {
        padding: 24px 28px;
    }
    .overview-card-header .period-name {
        font-size: 17px;
    }
    .overview-card-params {
        grid-template-columns: repeat(4, 1fr);
        gap: 14px 18px;
    }
    .overview-card-param-bar {
        height: 26px;
    }
}

/* ===== Десктоп (1200-1920px) — базовый ===== */
@media (min-width: 1201px) and (max-width: 1920px) {
    .overview-card-params {
        grid-template-columns: repeat(3, 1fr);
    }
}

/* ===== Ноутбук 13-15" (992-1200px) ===== */
@media (max-width: 1200px) and (min-width: 769px) {
    .overview-cards-container {
        gap: 14px;
    }
    .overview-card-item {
        padding: 18px 20px;
        min-width: 0;
    }
    .overview-card-header .period-name {
        font-size: 15px;
    }
    .overview-card-header .period-range {
        font-size: 12px;
    }
    .overview-card-params {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px 12px;
    }
    .overview-card-param-label {
        font-size: 10.5px;
    }
    .overview-card-param-bar {
        height: 22px;
    }
}

/* ===== Планшет / Маленький ноутбук (<=768px) ===== */
@media (max-width: 768px) {
    /* Topbar mobile */
    .topbar {
        border-radius: 12px;
        overflow: visible;
    }
    .topbar .topbar-inner {
        flex-wrap: wrap;
        padding: 12px 14px;
        gap: 8px;
    }
    .topbar-zone {
        padding: 0 6px;
    }
    .topbar-zone.topbar-brand {
        padding-left: 10px;
    }
    .topbar-zone.topbar-stations {
        order: 3;
        flex-basis: 100%;
        justify-content: center;
    }
    .topbar-zone.topbar-status {
        padding-right: 10px;
        gap: 8px;
    }
    .topbar-sep {
        display: none;
    }
    .brand-title {
        font-size: 1.1rem;
    }
    .last-updated-wrap {
        font-size: 0.75rem;
    }
    .topbar .tabs-nav {
        padding: 8px 12px 12px;
        gap: 4px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        flex-wrap: nowrap;
    }
    .topbar .tabs-nav::-webkit-scrollbar {
        display: none;
    }
    .topbar .tabs-nav .tab-btn {
        padding: 8px 12px;
        font-size: 0.8rem;
        white-space: nowrap;
        flex-shrink: 0;
    }

    /* Overview cards mobile */
    .overview-cards-container {
        flex-direction: column;
        flex-wrap: nowrap;
        gap: 12px;
    }
    .overview-card-item {
        flex: 0 0 auto;
        min-width: unset;
        width: 100%;
        overflow: visible;
        padding: 16px 18px;
    }
    .overview-card-item:hover {
        transform: none;
    }
    .overview-card-header .period-name {
        font-size: 15px;
    }
    .overview-card-params {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }
    .raw-flux-section-title {
        font-size: 1.1rem !important;
        margin-bottom: 16px !important;
    }

    /* Station nav mobile — в строку, не в столбик */
    .station-nav.station-segmented {
        display: inline-flex;
        flex-direction: row;
        gap: 6px;
    }
    .station-nav.station-segmented .station-btn {
        padding: 6px 14px;
        font-size: 0.85rem;
        min-height: 32px;
    }
}

/* ===== iPhone 14 (390px) и маленькие экраны ===== */
@media (max-width: 430px) {
    .overview-card-params {
        grid-template-columns: 1fr;
    }
    .overview-card-item {
        padding: 14px;
        border-radius: 12px;
    }
    .overview-card-header {
        flex-wrap: wrap;
        gap: 6px;
    }
    .overview-card-header .period-name {
        font-size: 14px;
    }
    .overview-card-header .period-range {
        margin-left: 22px;
        font-size: 11px;
    }
    .overview-card-param-bar {
        height: 20px;
    }
    .overview-card-param-text {
        font-size: 10px;
    }
    .topbar .topbar-inner {
        padding: 10px 10px;
    }
    .brand-title {
        font-size: 1rem;
    }
}

.wind-rose-calm {

/* Панель быстрых переключателей (внутри card header или отдельно) */

.widget-card-header {

}

.eddypro-control-bar {

.control-bar-group {

.control-bar-seg button {

}

.control-bar-seg button:hover {
    background: rgba(255, 255, 255, 0.1);

.control-bar-seg button.active {

.filters-summary {

/* Wind Rose: legend in card header (right-aligned) */
.widget-card-header .wind-rose-legend,
.eddypro-control-bar .wind-rose-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    align-items: center;
    margin: 0;
    margin-left: auto;
}
.wind-rose-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    align-items: center;
}

.wind-rose-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;

}

.wind-rose-legend-swatch {

    height: 12px;

/* LF Quality popover (всплывающая подсказка) */
.lf-quality-popover-wrap {
    position: relative;
}

.lf-quality-popover {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 6px;
    min-width: 160px;
    padding: 6px 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    z-index: 25;
}

.lf-quality-popover.open {
    display: block;
}

.lf-quality-option {
    display: block;
    width: 100%;
    padding: 8px 14px;
    border: none;
    background: transparent;
    color: rgba(255, 255, 255, 0.9);
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
}

.lf-quality-option:hover {
    background: rgba(255, 255, 255, 0.1);
}

.lf-quality-option.active {
    background: rgba(255, 255, 255, 0.15);
    font-weight: 600;
}

.filters-btn-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
}

.filters-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
}

.filters-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.35);
}

.filters-badge {
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 10px;
    background: var(--primary-color);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.filters-badge.hidden {
    display: none;
}

.filters-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-right: 4px;
}
.filters-icon svg {
    vertical-align: middle;
}

/* Pill-style Filters button (EddyPro) — заметная кнопка */
.filters-pill-btn {
    border-radius: 999px !important;
    padding: 10px 22px !important;
    background: rgba(0, 114, 187, 0.35) !important;
    border: 1px solid rgba(0, 114, 187, 0.8) !important;
    font-weight: 600 !important;
    font-size: 14px !important;
    box-shadow: 0 2px 12px rgba(0, 114, 187, 0.25);
}
.filters-pill-btn:hover {
    background: rgba(0, 114, 187, 0.5) !important;
    border-color: rgba(255, 255, 255, 0.6) !important;
    box-shadow: 0 4px 20px rgba(0, 114, 187, 0.4);
}

/* Drawer (правый выезжающий) */
.drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: none;
    align-items: stretch;
    justify-content: flex-end;
    z-index: 50;
}

.drawer-backdrop[aria-hidden="false"] {
    display: flex;
}

.drawer {
    width: 380px;
    max-width: calc(100vw - 40px);
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-left: 1px solid var(--glass-border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: -10px 0 40px rgba(0, 0, 0, 0.4);
    overflow-y: auto;
}

.drawer #drawerBody {
    display: flex;
    flex-direction: column;
}
.drawer-filters-body {
    padding: 0;
    display: flex;
    flex-direction: column;
}
.drawer-filters-body > div {
    margin-bottom: 16px;
}
.drawer-filters-body > div:last-of-type {
    margin-bottom: 0;
}

.drawer h3 {
    margin: 0 0 10px 0;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
}

.drawer .drawer-header {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
}

.drawer .drawer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

.drawer .muted {
    color: rgba(255, 255, 255, 0.6);
    font-size: 12px;
}

.drawer label {
    display: block;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 6px;
}

.drawer input[type="text"] {
    width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-primary);
    outline: none;
    font-size: 13px;
}

.drawer .params-list {
    max-height: 220px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.drawer .params-buttons-wrap,
.drawer .quality-buttons-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 18px;
}

.drawer .compact-btn {
    padding: 10px 18px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    color: rgba(255, 255, 255, 0.9);
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    border-left: 3px solid transparent;
    margin: 0;
}

.drawer .compact-btn:hover {
    background: rgba(255, 255, 255, 0.1);
}

.drawer .compact-btn.active {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.35);
    font-weight: 600;
}


.drawer .param-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.03);
}

.drawer .param-item:hover {
    background: rgba(255, 255, 255, 0.08);
}

.drawer .param-item input {
    width: 16px;
    height: 16px;
    accent-color: var(--color-french-blue-light);
}

/* Unified checkbox row for Cross-Station filters (stations + parameters) */
.drawer .drawer-checkbox-row:hover,
.drawer .drawer-filter-section label:hover {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 6px;
}
/* Time Lag Gas: single-select checkbox, blue + white checkmark */
.drawer .timelag-gas-cb {
    accent-color: #0072BB;
}

.drawer .drawer-checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0;
    font-size: 13px;
    line-height: 1.2;
}
.drawer .drawer-checkbox-row > span {
    display: inline-flex;
    align-items: center;
    min-width: 18px;
    width: 18px;
    flex-shrink: 0;
}
.drawer .drawer-checkbox-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--color-french-blue-light);
}

/* EddyPro quality slider */
.quality-slider-wrap {
    width: 100%;
    padding: 4px 0;
}
.quality-slider {
    width: 100%;
    height: 8px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 4px;
    outline: none;
}
.quality-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--color-french-blue-light);
    cursor: pointer;
    border: 2px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}
.quality-slider::-webkit-slider-thumb:hover {
    background: var(--color-french-blue);
}
.quality-slider::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--color-french-blue-light);
    cursor: pointer;
    border: 2px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}
.quality-slider::-moz-range-thumb:hover {
    background: var(--color-french-blue);
}

.drawer .quality-seg {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.drawer .quality-seg button {
    padding: 6px 12px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    color: rgba(255, 255, 255, 0.9);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
}

.drawer .quality-seg button:hover {
    background: rgba(255, 255, 255, 0.1);
}

.drawer .quality-seg button.active {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.35);
    font-weight: 600;
}

/* Light separators between filter sections */
.drawer .drawer-filter-section {
    padding-bottom: 16px;
    margin-bottom: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
}
.drawer .drawer-filter-section:last-of-type {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
}

.drawer .drawer-reset {
    margin-top: 20px;
    margin-bottom: 0;
    padding: 8px 18px;
    width: fit-content;
    align-self: center;
    border: 1px solid rgba(0, 114, 187, 0.8);
    border-radius: 999px;
    background: rgba(0, 114, 187, 0.35);
    color: rgba(255, 255, 255, 0.95);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 2px 12px rgba(0, 114, 187, 0.25);
}

.drawer .drawer-reset:hover {
    background: rgba(0, 114, 187, 0.5);
    border-color: rgba(255, 255, 255, 0.6);
    box-shadow: 0 4px 20px rgba(0, 114, 187, 0.4);
}

.iconbtn {
    border: none;
    background: transparent;
    color: rgba(255, 255, 255, 0.8);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
}

.iconbtn:hover {
    color: #fff;
}

@media (max-width: 900px) {
    .eddypro-main-layout {
        flex-direction: column;
    }
    
    .eddypro-control-bar {
        flex-direction: column;
        align-items: stretch;
    }
    
    .filters-btn-wrap {
        margin-left: 0;
    }
}

/* Animation Classes */
.fade-in {
    animation: fadeIn 0.5s ease-in;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* HF Images Gallery Styles */
.hf-images-container {
    width: 100%;
    padding: 20px 0;
}

.hf-section-title {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 30px;
    text-align: center;
}

.hf-images-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    width: 100%;
}

@media (max-width: 1200px) {
    .hf-images-grid {
        grid-template-columns: 1fr;
    }
}

.hf-image-card {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-radius: 16px;
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    overflow: hidden;
    transition: all 0.3s ease;
}

.hf-image-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.5);
    border-color: rgba(255, 255, 255, 0.3);
}

.hf-image-title {
    padding: 16px 20px;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.05);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.hf-image-wrapper {
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    background: rgba(0, 0, 0, 0.2);
}

.hf-image {
    max-width: 100%;
    max-height: 500px;
    height: auto;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.hf-image:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

.hf-image-error {
    color: rgba(255, 255, 255, 0.6);
    font-style: italic;
    text-align: center;
    padding: 40px;
}

/* HF Image Modal */
.hf-image-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    animation: fadeIn 0.2s ease;
}

.hf-modal-content {
    max-width: 95vw;
    max-height: 95vh;
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    border-radius: 16px;
    border: 1px solid var(--glass-border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.hf-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: rgba(255, 255, 255, 0.05);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);

.hf-modal-title {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--text-primary);
}

.hf-modal-close {

    border: none;
    color: var(--text-primary);
    font-size: 2rem;

.hf-modal-close:hover {

}

.hf-modal-body {
    padding: 20px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.hf-modal-body img {
    max-width: 100%;
    max-height: 80vh;
    border-radius: 8px;
}

.hf-filtering-info {

    border-top: 1px solid rgba(255, 255, 255, 0.1);

.hf-filtering-row {

.hf-filtering-row:not(:last-child) {

.hf-filtering-label {

.hf-filtered-value {

/* Time Lag Page */
.timelag-page-layout {
    width: 100%;
}

.timelag-legend {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
}

.timelag-legend label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.9);
    font-family: Roboto, sans-serif;
}

.timelag-legend label:hover {
    color: #fff;
}

.timelag-legend input[type="checkbox"] {
    cursor: pointer;
}

.timelag-widgets {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
}

.timelag-widgets .glass-card {
    border-radius: 16px;
}

.timelag-tooltip {
    min-width: 220px;
