    function stationHasParameter(station, dataType, parameterLabel) {
        if (!parameterLabel) return true;
        let params = dataType === 'eddypro' ? station?.parameters?.eddypro : station?.parameters?.lf;
        if (!params || params.length === 0) {
            const cfg = dashboardConfig?.stations?.find(s => s.id === station.station_id);
            if (cfg) params = dataType === 'eddypro' ? cfg.parameters?.eddypro : cfg.parameters?.lf;
        }
        if (!params || !params.length) return false;
        const norm = (l) => (l || '').toLowerCase().trim().replace(/\s+/g, ' ');
        return params.some(p => norm(p.label) === norm(parameterLabel));
    }

    function updateStationListVisibility() {
        const hasParamFilter = multiStationState.selectedStations.length >= 1 && multiStationState.parameter;
        stationSeg.querySelectorAll('label').forEach(lbl => {
            const cb = lbl.querySelector('input[type="checkbox"]');
            if (!cb) return;
            const station = dashboardData.find(s => s.station_id === cb.value);
            if (!station) return;
            let hasData = false;
            if (multiStationState.dataType === 'eddypro') {
                const hasDataObj = !!station?.data?.eddypro;
                const hasPeriod = !!(station.data?.eddypro?.last_7d?.length || station.data?.eddypro?.last_month?.length || station.data?.eddypro?.annual?.length);
                let hasParams = station?.parameters?.eddypro?.length > 0;
                if (!hasParams) {
                    const cfg = dashboardConfig?.stations?.find(s => s.id === station.station_id);
                    if (cfg?.parameters?.eddypro) hasParams = (station.parameters?.eddypro || cfg.parameters.eddypro).length > 0;
                }
                hasData = !!(hasDataObj && hasPeriod && hasParams);
            } else {
                const hasDataObj = !!station?.data?.lf;
                const hasPeriod = !!(station.data?.lf?.last_7d?.length || station.data?.lf?.last_month?.length || station.data?.lf?.annual?.length);
                let hasParams = (station?.parameters?.lf?.length ?? 0) > 0;
                if (!hasParams) {
                    const cfg = dashboardConfig?.stations?.find(s => s.id === station.station_id);
                    if (cfg?.parameters?.lf) hasParams = ((station.parameters?.lf) || cfg.parameters.lf).length > 0;
                }
                hasData = !!(hasDataObj && hasPeriod && hasParams);
            }
            const hasParam = stationHasParameter(station, multiStationState.dataType, multiStationState.parameter);
            const show = hasData && (!hasParamFilter || hasParam);
            // Не скрываем строки (display:none), чтобы список не «уезжал» при клике — затемняем не подходящие
            if (!hasData) {
                lbl.style.display = 'none';
            } else if (hasParamFilter && !hasParam) {
                lbl.style.display = '';
                lbl.style.opacity = '0.4';
                lbl.style.pointerEvents = 'none';
                const inp = lbl.querySelector('input[type="checkbox"]');
                if (inp) inp.disabled = true;
            } else {
                lbl.style.display = '';
                lbl.style.opacity = '';
                lbl.style.pointerEvents = '';
                const inp = lbl.querySelector('input[type="checkbox"]');
                if (inp) inp.disabled = false;
            }
        });
        if (hasParamFilter) {
            multiStationState.selectedStations = multiStationState.selectedStations.filter(s =>
                stationHasParameter(s, multiStationState.dataType, multiStationState.parameter)
            );
            stationSeg.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                const label = cb.closest('label');
                if (label && label.style.pointerEvents === 'none') return;
                cb.checked = multiStationState.selectedStations.some(s => s.station_id === cb.value);
            });
        }
    }

    // Helper function to update station availability based on data type
    function updateStationAvailability() {
        stationSeg.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            const station = dashboardData.find(s => s.station_id === cb.value);
            const label = cb.closest('label');
            let hasData = false;
            
            if (multiStationState.dataType === 'eddypro') {
                const hasDataObj = !!station?.data?.eddypro;
                const hasLast7d = station?.data?.eddypro?.last_7d?.length > 0;
                const hasLastMonth = station?.data?.eddypro?.last_month?.length > 0;
                const hasAnnual = station?.data?.eddypro?.annual?.length > 0;
                let hasParams = station?.parameters?.eddypro?.length > 0;
                
                if (!hasParams) {
                    const stationConfig = dashboardConfig?.stations?.find(s => s.id === station.station_id);
                    if (stationConfig?.parameters?.eddypro) {
                        if (!station.parameters) station.parameters = {};
                        station.parameters.eddypro = stationConfig.parameters.eddypro;
                        hasParams = (station.parameters.eddypro && station.parameters.eddypro.length) > 0;
                    }
                }
                
                hasData = !!(hasDataObj && (hasLast7d || hasLastMonth || hasAnnual) && hasParams);
            } else if (multiStationState.dataType === 'lf') {
                const hasDataObj = !!station?.data?.lf;
                const hasLast7d = station?.data?.lf?.last_7d?.length > 0;
                const hasLastMonth = station?.data?.lf?.last_month?.length > 0;
                const hasAnnual = station?.data?.lf?.annual?.length > 0;
                let hasParams = (station?.parameters?.lf?.length ?? 0) > 0;
                if (!hasParams) {
                    const stationConfig = dashboardConfig?.stations?.find(s => s.id === station.station_id);
                    if (stationConfig?.parameters?.lf) {
                        if (!station.parameters) station.parameters = {};
                        station.parameters.lf = stationConfig.parameters.lf;
                        hasParams = (station.parameters.lf && station.parameters.lf.length) > 0;
                    }
                }
                hasData = !!(hasDataObj && (hasLast7d || hasLastMonth || hasAnnual) && hasParams);
            }
            
            if (!hasData) {
                cb.disabled = true;
                cb.checked = false;
                if (label) {
                    label.style.opacity = '0.5';
                    label.style.display = 'none';
                }
            } else {
                cb.disabled = false;
                if (label) {
                    label.style.opacity = '';
                    label.style.display = '';
                }
            }
        });
        
        // Remove stations without data from selection
        multiStationState.selectedStations = multiStationState.selectedStations.filter(station => {
            let hasData = false;
            if (multiStationState.dataType === 'eddypro') {
                const hasDataObj = !!station?.data?.eddypro;
                const hasPeriodData = !!(station.data.eddypro?.last_7d?.length > 0 || 
                     station.data.eddypro?.last_month?.length > 0 || 
                     station.data.eddypro?.annual?.length > 0);
                let hasParams = station?.parameters?.eddypro?.length > 0;
                if (!hasParams) {
                    const stationConfig = dashboardConfig?.stations?.find(s => s.id === station.station_id);
                    if (stationConfig?.parameters?.eddypro) {
                        if (!station.parameters) station.parameters = {};
                        station.parameters.eddypro = stationConfig.parameters.eddypro;
                        hasParams = (station.parameters.eddypro && station.parameters.eddypro.length) > 0;
                    }
                }
                hasData = !!(hasDataObj && hasPeriodData && hasParams);
            } else if (multiStationState.dataType === 'lf') {
                const hasDataObj = !!station?.data?.lf;
                const hasPeriodData = !!(station.data.lf?.last_7d?.length > 0 || 
                     station.data.lf?.last_month?.length > 0 || 
                     station.data.lf?.annual?.length > 0);
                let hasParams = station?.parameters?.lf?.length > 0;
                if (!hasParams) {
                    const stationConfig = dashboardConfig?.stations?.find(s => s.id === station.station_id);
                    if (stationConfig?.parameters?.lf) {
                        if (!station.parameters) station.parameters = {};
                        station.parameters.lf = stationConfig.parameters.lf;
                        hasParams = (station.parameters.lf && station.parameters.lf.length) > 0;
                    }
                }
                hasData = !!(hasDataObj && hasPeriodData && hasParams);
            }
            return hasData;
        });
        
        // Update checkbox states
        stationSeg.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            const isSelected = multiStationState.selectedStations.some(s => s.station_id === cb.value);
            cb.checked = isSelected;
        });
        // Disable unchecked when max 4 already selected; enable when under limit (for hasData stations)
        const nSelected = multiStationState.selectedStations.length;
        stationSeg.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            const label = cb.closest('label');
            if (label && label.style.opacity === '0.5') return; // no-data, leave disabled
            cb.disabled = nSelected >= 4 && !cb.checked;
        });
        updateStationListVisibility();
        updateStationCheckboxColors();
    }

    // Helper function to update station selection
    function updateStationSelection() {
        const checkedBoxes = stationSeg.querySelectorAll('input[type="checkbox"]:checked');
        const selectedIds = Array.from(checkedBoxes).map(cb => cb.value);
        
        multiStationState.selectedStations = selectedIds.map(id => 
            dashboardData.find(s => s.station_id === id)
        ).filter(s => s);

        // Disable/enable checkboxes based on limit (max 4)
        stationSeg.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            const station = dashboardData.find(s => s.station_id === cb.value);
            let hasData = false;
            if (multiStationState.dataType === 'eddypro') {
                hasData = !!(station?.data?.eddypro && 
                    (station.data.eddypro.last_7d?.length > 0 || 
                     station.data.eddypro.last_month?.length > 0 || 
                     station.data.eddypro.annual?.length > 0) &&
                    station.parameters?.eddypro?.length > 0);
            } else if (multiStationState.dataType === 'lf') {
                hasData = !!(station?.data?.lf && 
                    (station.data.lf.last_7d?.length > 0 || 
                     station.data.lf.last_month?.length > 0 || 
                     station.data.lf.annual?.length > 0) &&
                    station.parameters?.lf?.length > 0);
            }
            const label = cb.closest('label');
            if (!hasData) {
                cb.disabled = true;
                if (label) label.style.opacity = '0.5';
            } else if (!cb.checked && selectedIds.length >= 4) {
                cb.disabled = true;
                if (label) label.style.opacity = '';
            } else {
                cb.disabled = false;
                if (label) label.style.opacity = hasData ? '' : '0.5';
            }
        });

        updateParameterSelection();
        updateChart();
        updateStationListVisibility();
        updateStationCheckboxColors();
    }

    function updateStationCheckboxColors() {
        stationSeg.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            const stationId = cb.value;
            const idx = multiStationState.selectedStations.findIndex(s => s.station_id === stationId);
            cb.style.accentColor = idx >= 0 ? MULTISTATION_PALETTE[idx % MULTISTATION_PALETTE.length] : 'rgba(255,255,255,0.5)';
        });
    }

    // Helper function to update parameter selection
    function updateParameterSelection() {
        // Ensure parameters are loaded from config for all selected stations
        multiStationState.selectedStations.forEach(station => {
            if (!station.parameters || (!station.parameters.eddypro && !station.parameters.lf)) {
                const stationConfig = dashboardConfig?.stations?.find(s => s.id === station.station_id);
                if (stationConfig && stationConfig.parameters) {
                    station.parameters = stationConfig.parameters;
                }
            }
        });
        
        const commonParams = getCommonParameters(multiStationState.selectedStations, multiStationState.dataType);
        
        paramSeg.innerHTML = '';
        
        if (commonParams.length === 0) {
            const emptyMsg = document.createElement('div');
            emptyMsg.style.cssText = 'padding: 12px; color: rgba(255,255,255,0.6); font-size: 14px; text-align: center;';
            emptyMsg.textContent = multiStationState.selectedStations.length === 0 
                ? 'Select stations first' 
                : 'No common parameters available';
            paramSeg.appendChild(emptyMsg);
            multiStationState.parameter = null;
            multiStationState.parameterConfig = null;
            return;
        }

        const paramAccentBlue = 'var(--primary-color, #0072BB)';
        commonParams.forEach(param => {
        const lbl = document.createElement('label');
        lbl.className = 'drawer-checkbox-row';
        lbl.style.cssText = 'cursor:pointer;';
        const cbWrap = document.createElement('span');
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.name = 'multistation-param';
            cb.value = param.label;
            cb.dataset.paramLabel = param.label;
            cb.dataset.paramUnit = param.unit || '';
            cb.checked = multiStationState.parameter === param.label;
            const paramSelected = multiStationState.parameter === param.label;
            cb.style.accentColor = paramSelected ? paramAccentBlue : 'rgba(255,255,255,0.5)';
            cb.addEventListener('change', () => {
                if (cb.checked) {
                    paramSeg.querySelectorAll('input[type="checkbox"]').forEach(b => {
                        b.checked = b === cb;
                        b.style.accentColor = b === cb ? paramAccentBlue : 'rgba(255,255,255,0.5)';
                    });
                    multiStationState.parameter = param.label;
                    multiStationState.parameterConfig = param;
                    updateStationListVisibility();
                    updateChart();
                } else {
                    cb.checked = true;
                }
            });
            const labelText = param.unit ? `${param.label} (${param.unit})` : param.label;
            cbWrap.appendChild(cb);
            lbl.appendChild(cbWrap);
            lbl.appendChild(document.createTextNode(labelText));
            paramSeg.appendChild(lbl);
        });

        // Set default parameter if not set or not available (LF: prefer Air Temperature when common)
        if (!multiStationState.parameter || !commonParams.some(p => p.label === multiStationState.parameter)) {
            const normLbl = (l) => (l || '').toLowerCase().trim().replace(/\s+/g, ' ');
            let firstParam = commonParams[0];
            if (multiStationState.dataType === 'lf') {
                const air = commonParams.find((p) => normLbl(p.label) === 'air temperature');
                if (air) firstParam = air;
            }
            multiStationState.parameter = firstParam.label;
            multiStationState.parameterConfig = firstParam;
            let defaultCb = null;
            paramSeg.querySelectorAll('input[type="checkbox"][name="multistation-param"]').forEach((b) => {
                if (b.dataset.paramLabel === firstParam.label) defaultCb = b;
            });
            if (!defaultCb) defaultCb = paramSeg.querySelector('input[type="checkbox"]');
            if (defaultCb) {
                paramSeg.querySelectorAll('input[type="checkbox"]').forEach((b) => {
                    b.checked = b === defaultCb;
                    b.style.accentColor = b === defaultCb ? paramAccentBlue : 'rgba(255,255,255,0.5)';
                });
            }
        } else {
            const activeCb = paramSeg.querySelector(`input[data-param-label="${multiStationState.parameter}"]`);
            if (activeCb) { activeCb.checked = true; activeCb.style.accentColor = paramAccentBlue; }
            const paramConfig = commonParams.find(p => p.label === multiStationState.parameter);
            if (paramConfig) multiStationState.parameterConfig = paramConfig;
        }
        updateStationListVisibility();
    }

    // Helper function to update chart
    function updateChart() {
        updateMultiStationChart(
            multiStationState.selectedStations,
            multiStationState.dataType,
            multiStationState.parameter, // This is now the label
            multiStationState.period
        );
    }
}

/**
 * Updates the Multi Station comparison chart
 * @param {Array} selectedStations - Array of selected station objects
 * @param {string} dataType - 'eddypro' or 'lf'
 * @param {string} parameterLabel - Parameter label to compare (used to find correct key for each station)
 * @param {string} period - '7d', 'month', or 'year'
 */
function updateMultiStationChart(selectedStations, dataType, parameterLabel, period) {
    const chartElement = document.getElementById('multistation-chart');
    if (!chartElement) {
        console.error('[Cross-Station] Chart element not found');
        return;
    }

    // Destroy existing chart
    const chartId = 'multistation-chart';
    if (chartInstances[chartId]) {
        try {
            chartInstances[chartId].destroy();
            delete chartInstances[chartId];
        } catch (e) {
        }
    }

    chartElement.innerHTML = '';

    // Edge cases
    if (!selectedStations || selectedStations.length === 0) {
        chartElement.innerHTML = '<p style="color: rgba(255,255,255,0.85); text-align: center; padding: 48px 24px; font-size: 15px; line-height: 1.5;">Select at least one station and a parameter in <strong>Filters</strong>.</p>';
        return;
    }

    if (!parameterLabel || !multiStationState.parameterConfig) {
        chartElement.innerHTML = '<p style="color: rgba(255,255,255,0.85); text-align: center; padding: 48px 24px; font-size: 15px; line-height: 1.5;">Select a parameter in <strong>Filters</strong> to compare data.</p>';
        return;
    }

    const paramConfig = multiStationState.parameterConfig;
    const stationParamMap = paramConfig.stationParamMap;

    // Map period to data key
    const dataKeyMap = {
        '7d': 'last_7d',
        'month': 'last_month',
        'year': 'annual'
    };
    const dataKey = dataKeyMap[period] || 'last_7d';

    // Collect data from all stations
    const series = [];
    const seriesColors = [];
    let allTimestamps = new Set();

    selectedStations.forEach((station, idx) => {
        // Get station data
        const stationData = dataType === 'eddypro' 
            ? station.data?.eddypro?.[dataKey] 
            : station.data?.lf?.[dataKey];

        if (!stationData || stationData.length === 0) {
            return;
        }

        // Get parameter key for this station from the map (try exact match, then case-insensitive)
        const normId = (id) => (id || '').toLowerCase().replace(/[\s_-]+/g, '_');
        let paramKey = stationParamMap.get(station.station_id);
        if (!paramKey) {
            const stationIdNorm = normId(station.station_id);
            const mapEntry = Array.from(stationParamMap.entries()).find(([sid]) => normId(sid) === stationIdNorm);
            paramKey = mapEntry ? mapEntry[1] : null;
        }
        if (!paramKey) {
            return;
        }
        

        // Get station color by selection order (same as checkbox colors)
        const stationColor = MULTISTATION_PALETTE[idx % MULTISTATION_PALETTE.length];

        // Resolve paramKey: check any row (first may be gap-filled with only TIMESTAMP)
        let resolvedParamKey = paramKey;
        const paramNorm = (paramKey || '').toLowerCase().replace(/[^a-z0-9_]/g, '');
        const rowWithParam = stationData.find(r => (paramKey in r) || Object.keys(r).some(k => (k || '').toLowerCase().replace(/[^a-z0-9_]/g, '') === paramNorm));
        if (!rowWithParam) {
            return;
        }
        if (!(paramKey in rowWithParam)) {
            const found = Object.keys(rowWithParam).find(k => (k || '').toLowerCase().replace(/[^a-z0-9_]/g, '') === paramNorm);
            if (found) resolvedParamKey = found;
        }

        // Extract data points
        const seriesData = stationData.map(row => {
            const timestamp = parseTimestampUTC(row.TIMESTAMP ?? row.timestamp);
            if (timestamp) {
                allTimestamps.add(timestamp);
            }

            const value = row[resolvedParamKey];
            const y = value !== null && value !== undefined && !isNaN(Number(value)) 
                ? Number(value) 
                : null;
            
            return {
                x: timestamp,
                y: y
            };
        }).filter(point => point.x != null && !isNaN(point.x));

        if (seriesData.length === 0) {
            return;
        }
        

        // Create series label
        const stationLabel = station.display_name || station.station_name;
        const seriesLabel = paramConfig.unit 
            ? `${stationLabel} - ${paramConfig.label} (${paramConfig.unit})`
            : `${stationLabel} - ${paramConfig.label}`;

        series.push({
            name: seriesLabel,
            data: seriesData
        });

        seriesColors.push(stationColor);
    });

    if (series.length === 0) {
        chartElement.innerHTML = '<p style="color: rgba(255,255,255,0.8); text-align: center; padding: 40px;">Нет данных для выбранного периода</p>';
        return;
    }

    const timestamps = Array.from(allTimestamps).filter(t => t && !isNaN(t));
    const HALF_HOUR_MS = 30 * 60 * 1000;
    const minT = timestamps.length > 0 ? Math.min(...timestamps) : null;
    const maxT = timestamps.length > 0 ? Math.max(...timestamps) + HALF_HOUR_MS : null;
    const rangeDays = minT && maxT ? (maxT - minT) / (24 * 60 * 60 * 1000) : 0;

    let yMin = Infinity;
    let yMax = -Infinity;
    series.forEach(s => {
        s.data.forEach(p => {
            if (p.y != null && isFinite(p.y)) {
                if (p.y < yMin) yMin = p.y;
                if (p.y > yMax) yMax = p.y;
            }
        });
    });
    if (yMin === Infinity) yMin = 0;
    if (yMax === -Infinity) yMax = 1;
    const yPadding = (yMax - yMin) * 0.05 || 0.1;
    yMin = yMin - yPadding;
    yMax = yMax + yPadding;
    const showZeroLine = yMin <= 0 && yMax >= 0;

    const displayTz = multiStationState.chartTimeZone || 'UTC';
    const axisColor = 'rgba(255,255,255,0.8)';
    const fmtDay = (v) => new Date(v).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: displayTz });
    const fmtMonth = (v) => new Date(v).toLocaleDateString('en-GB', { month: 'short', year: 'numeric', timeZone: displayTz });

    const datasets = [];
    if (showZeroLine && minT != null && maxT != null) {
        datasets.push({
            label: 'Zero line',
            data: [{ x: minT, y: 0 }, { x: maxT, y: 0 }],
            borderColor: 'rgba(255,255,255,0.55)',
            backgroundColor: 'transparent',
            borderWidth: 1,
            pointRadius: 0,
            pointHoverRadius: 0,
            fill: false,
            tension: 0,
            spanGaps: false,
            showLine: true,
            order: 0.5
        });
    }
    series.forEach((s, i) => {
        const dataWithGaps = insertGapsInLineDataMultiStation(s.data.map(d => ({ x: d.x, y: d.y })));
        datasets.push({
            label: s.name,
            data: dataWithGaps,
            borderColor: seriesColors[i] || MULTISTATION_PALETTE[i % MULTISTATION_PALETTE.length],
            backgroundColor: 'transparent',
            borderWidth: 2,
            pointRadius: 0,
            pointHoverRadius: 5,
            pointHoverBorderWidth: 2,
            fill: false,
            tension: 0.15,
            spanGaps: false,
            showLine: true,
            order: 1
        });
    });

    const xScaleConfig = {
        type: 'linear',
        min: minT,
        max: maxT,
        grid: { display: true, color: 'rgba(255,255,255,0.1)', lineWidth: 1 },
        ticks: {
            color: axisColor,
            maxTicksLimit: period === 'year' || rangeDays > 365 ? 12 : 10,
            font: { size: 12, weight: '400', family: "'Roboto', 'Segoe UI', sans-serif" }
        },
        border: { display: false }
    };
    if (period === '7d' || (rangeDays <= 31 && period !== 'year')) {
        xScaleConfig.ticks.callback = (v) => fmtDay(v);
        const customTicks = [];
        const d = new Date(minT);
        d.setHours(0, 0, 0, 0);
        while (d.getTime() <= maxT) {
            customTicks.push({ value: d.getTime() });
            d.setDate(d.getDate() + 1);
        }
        xScaleConfig.afterBuildTicks = function(scale) { scale.ticks = customTicks; };
    } else if (period === 'month' && rangeDays <= 31) {
        xScaleConfig.ticks.callback = (v) => fmtDay(v);
        const customTicks = [];
        const d = new Date(minT);
        d.setDate(1);
        d.setHours(0, 0, 0, 0);
        while (d.getTime() <= maxT) {
            customTicks.push({ value: d.getTime() });
            d.setDate(d.getDate() + 7);
        }
        xScaleConfig.afterBuildTicks = function(scale) { scale.ticks = customTicks; };
    } else {
        xScaleConfig.ticks.callback = (v) => fmtMonth(v);
        const customTicks = [];
        const d = new Date(minT);
        d.setDate(1);
        d.setHours(0, 0, 0, 0);
        while (d.getTime() <= maxT) {
            customTicks.push({ value: d.getTime() });
            d.setMonth(d.getMonth() + 1);
        }
        xScaleConfig.afterBuildTicks = function(scale) { scale.ticks = customTicks; };
    }

    const yAxisTitle = paramConfig && paramConfig.unit ? `${paramConfig.label} (${paramConfig.unit})` : (paramConfig?.label || 'Value');

    const chartOptions = {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        transitions: { active: { animation: { duration: 0 } } },
        interaction: { mode: 'index', intersect: false },
        plugins: {
            legend: { display: false },
            tooltip: {
                backgroundColor: 'rgba(20, 20, 25, 0.95)',
                borderColor: 'rgba(255, 255, 255, 0.2)',
                borderWidth: 1,
                padding: 10,
                cornerRadius: 8,
                titleColor: '#ffffff',
                bodyColor: '#ffffff',
                titleFont: { size: 13, weight: '600', family: "'Roboto', 'Segoe UI', sans-serif" },
                bodyFont: { size: 12, family: "'Roboto', 'Segoe UI', sans-serif" },
                titleAlign: 'left',
                bodyAlign: 'left',
                callbacks: {
                    title: (items) => {
                        const raw = items[0]?.raw;
                        if (!raw?.x) return '';
                        const tz = multiStationState.chartTimeZone || 'UTC';
                        return new Date(raw.x).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: tz });
                    },
                    label: (ctx) => {
                        if (ctx.dataset.label === 'Zero line') return null;
                        const y = ctx.parsed.y;
                        const fullLabel = ctx.dataset.label;
                        const unitMatch = fullLabel.match(/\(([^)]+)\)\s*$/);
                        const unit = unitMatch ? unitMatch[1] : (paramConfig && paramConfig.unit ? paramConfig.unit : '');
                        const name = unitMatch ? fullLabel.replace(/\s*\([^)]+\)\s*$/, '').trim() : fullLabel;
                        if (y == null || !isFinite(y)) return name + ': —';
                        return name + ': ' + y.toFixed(2) + (unit ? ' ' + unit : '');
                    },
                    labelColor: (ctx) => ({
                        borderColor: ctx.dataset.borderColor,
                        backgroundColor: ctx.dataset.borderColor
                    })
                },
                filter: (item) => item.dataset.label !== 'Zero line'
            }
        },
        scales: {
            x: xScaleConfig,
            y: {
                min: yMin,
                max: yMax,
                title: {
                    display: true,
                    text: yAxisTitle,
                    color: axisColor,
                    font: { size: 13, weight: '600', family: "'Roboto', 'Segoe UI', sans-serif" }
                },
                ticks: {
                    color: axisColor,
                    callback: (v) => {
                        if (v == null || !isFinite(v)) return '';
                        const formatted = v.toFixed(2);
                        return formatted === '-0.00' ? '0.00' : formatted;
                    },
                    maxTicksLimit: 8,
                    font: { size: 12, weight: '400', family: "'Roboto', 'Segoe UI', sans-serif" }
                },
                grid: { color: 'rgba(255,255,255,0.1)', lineWidth: 1, drawBorder: false },
                border: { display: false }
            }
        },
        elements: {
            line: { borderCapStyle: 'round', borderJoinStyle: 'round' },
            point: { radius: 0, hoverRadius: 5, hoverBorderWidth: 2 }
        }
    };

    const crosshairPlugin = {
        id: 'multistationCrosshair',
        afterDraw: (chart) => {
            const active = chart.tooltip?.getActiveElements?.() ?? chart.tooltip?._active;
            if (!active?.length) return;
            const el = active[0].element;
            let x = el?.x;
            if (x == null && chart.tooltip?.caretX != null) x = chart.tooltip.caretX;
            const yScale = chart.scales.y;
            if (!yScale || x == null) return;
            const ctx = chart.ctx;
            ctx.save();
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.moveTo(x, yScale.top);
            ctx.lineTo(x, yScale.bottom);
            ctx.stroke();
            ctx.restore();
        }
    };

    try {
        if (typeof Chart === 'undefined') {
            chartElement.innerHTML = '<p style="color: rgba(255,255,255,0.8);">Chart.js not loaded</p>';
            return;
        }
        chartElement.innerHTML = '<div style="position:relative;height:520px;width:100%;min-width:600px"><canvas style="display:block"></canvas></div>';
        const canvas = chartElement.querySelector('canvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            chartInstances[chartId] = new Chart(ctx, {
                type: 'line',
                data: { datasets },
                plugins: [crosshairPlugin],
                options: chartOptions
            });
        }
    } catch (error) {
        console.error('[Cross-Station] Error creating chart:', error);
        const p = document.createElement('p');
        p.style.cssText = 'color: rgba(255,255,255,0.8); text-align: center; padding: 20px;';
        p.textContent = 'Error: ' + String(error?.message || 'Unknown error');
        chartElement.innerHTML = '';
        chartElement.appendChild(p);
    }
}

function updateLastUpdated() {
    const lastUpdatedEl = document.getElementById('lastUpdated');
    if (!lastUpdatedEl) return;
    if (dashboardConfig?.general?.last_updated) {
        lastUpdatedEl.textContent = dashboardConfig.general.last_updated;
        lastUpdatedEl.classList.remove('last-updated-today', 'last-updated-old');
        const str = String(dashboardConfig.general.last_updated);
        const today = new Date();
        const d = today.getDate();
        const m = today.getMonth() + 1;
        const todayPat = `${d}.${m}`;
        const todayPat2 = `${String(d).padStart(2,'0')}.${String(m).padStart(2,'0')}`;
        if (str.includes(todayPat) || str.includes(todayPat2)) {
            lastUpdatedEl.classList.add('last-updated-today');
        } else {
            lastUpdatedEl.classList.add('last-updated-old');
        }
    } else {
        lastUpdatedEl.textContent = '—';
    }
}

// Export function for CSV export
function exportToCSV(data, filename) {
    if (!data || data.length === 0) return;
    
    const headers = Object.keys(data[0]);
    const csvContent = [
        headers.join(','),
        ...data.map(row => headers.map(header => {
            const value = row[header];
            return typeof value === 'string' ? `"${value}"` : value;
        }).join(','))
    ].join('\n');
    
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
}

<script>
(function () {
  'use strict';

  function sortStationsAlphabetically(stations) {
    return (stations || []).slice().sort(function (a, b) {
      var na = String(a.display_name || a.station_name || a.station_id || '');
      var nb = String(b.display_name || b.station_name || b.station_id || '');
      return na.localeCompare(nb, undefined, { sensitivity: 'base', numeric: true });
    });
  }

  /** Без fetch: надёжная загрузка для file:// и странных URL */
  function patchDashboardLoadData() {
    if (typeof DashboardCore === 'undefined' || typeof window.__EEDY_BUILD_DEMO__ !== 'function') return;
    var originalLoad = DashboardCore.loadData;
    DashboardCore.loadData = async function () {
      try {
        var result = window.__EEDY_BUILD_DEMO__();
        if (!result || !result.success) return await originalLoad.call(DashboardCore);
        var dashboardData = sortStationsAlphabetically(result.data || []);
        var dashboardConfig = result.config || {};
        if (typeof window !== 'undefined') window.dashboardConfig = dashboardConfig;
        for (var i = 0; i < dashboardData.length; i++) {
          var station = dashboardData[i];
          if (!station.parameters && dashboardConfig.stations) {
            var stCfg = dashboardConfig.stations.find(function (s) { return s.id === station.station_id; });
            if (stCfg && stCfg.parameters) station.parameters = stCfg.parameters;
          }
        }
        DashboardCore.setState({ dashboardData: dashboardData, dashboardConfig: dashboardConfig });
        return true;
      } catch (err) {
        console.error('[EddyEye Hub Demo] loadData:', err);
        return await originalLoad.call(DashboardCore);
      }
    };
  }

  function patchFileRoute() {
    if (location.protocol !== 'file:' || typeof DashboardCore === 'undefined') return;
    DashboardCore.getStationIdFromPath = function () {
      var r = sessionStorage.getItem('eddyeye_demo_route');
      if (r === 'multi_station') return 'multi_station';
      if (r) return r;
      return 'agali_cc';
    };
  }

  function bindFileNavClicks() {
    if (location.protocol !== 'file:' || typeof DashboardCore === 'undefined') return;
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a.station-btn[data-station-id]');
      if (!a) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      var sid = a.getAttribute('data-station-id');
      sessionStorage.setItem('eddyeye_demo_route', sid);
      DashboardCore.switchStation(sid);
    }, true);
    document.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-multi-station="true"]');
      if (!b) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      sessionStorage.setItem('eddyeye_demo_route', 'multi_station');
      var tab = document.querySelector('[data-tab="multistation"]');
      if (tab) tab.click();
    }, true);
  }

  patchDashboardLoadData();
  patchFileRoute();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindFileNavClicks);
  } else {
    bindFileNavClicks();
  }
})();
</script>
